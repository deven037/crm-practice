<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in – Harbor CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6f8;--surface:#fff;--surface-2:#f1f3f5;--border:#d5dae1;--text:#1f2937;--text-muted:#5b6472;--accent:#2563eb;--danger:#b91c1c;--danger-bg:#fef2f2;--danger-line:#f5c2c2;
--bank-primary:#1d3a6e;--bank-on:#fff;--r-sm:6px;--r-md:10px;--r-lg:14px;--ease:cubic-bezier(.4,0,.2,1);--font:'Inter Variable',Inter,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/22px var(--font);color:var(--text);background:var(--surface);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.shell{min-height:100vh;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr)}

/* Brand side: bank colour fill with a harbour horizon drawn in layered tides */
.brand{position:relative;overflow:hidden;background:linear-gradient(180deg,color-mix(in srgb,var(--bank-primary) 82%,#000) 0%,var(--bank-primary) 60%);color:var(--bank-on);display:flex;flex-direction:column;justify-content:space-between;padding:48px 56px}
.brand svg{position:absolute;left:0;right:0;bottom:0;width:100%;height:58%;pointer-events:none}
.brand svg path{fill:var(--bank-on)}
.mark{display:flex;align-items:center;gap:12px;font-weight:700;font-size:18px;position:relative}
.mark i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-md);background:var(--bank-on);color:var(--bank-primary);font-size:15px}
.pitch{position:relative;max-width:460px}
.pitch h2{margin:0 0 12px;font-size:32px;line-height:40px;font-weight:700;letter-spacing:-.02em}
.pitch p{margin:0;font-size:16px;line-height:24px;opacity:.88}
.bankline{position:relative;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}
.bankline b{display:grid;place-items:center;width:28px;height:28px;border-radius:var(--r-sm);background:color-mix(in srgb,var(--bank-on) 18%,transparent);font-size:12px}

/* Form side: quiet */
.side{display:flex;flex-direction:column;justify-content:center;padding:48px 24px 24px;background:var(--surface)}
.panel{width:100%;max-width:380px;margin:auto}
.mobile-mark{display:none}
h1{margin:0 0 4px;font-size:24px;line-height:32px;font-weight:700;letter-spacing:-.01em}
.sub{margin:0 0 24px;color:var(--text-muted);font-size:15px}
.field{display:block;margin-bottom:16px}
.field>span{display:block;font-size:13px;line-height:18px;font-weight:600;margin-bottom:6px}
.ctl{position:relative}
input[type=email],input[type=password],input[type=text]{width:100%;height:46px;padding:0 14px;font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);transition:border-color .12s var(--ease),box-shadow .12s var(--ease)}
input::placeholder{color:#6b7280}
input:hover{border-color:#9aa3b0}
input:focus-visible{outline:none;border-color:var(--text);box-shadow:0 0 0 3px color-mix(in srgb,var(--text) 18%,transparent)}
input[aria-invalid=true]{border-color:var(--danger)}
.ctl input{padding-right:48px}
.eye{position:absolute;right:2px;top:2px;width:42px;height:42px;display:grid;place-items:center;border:0;background:none;border-radius:var(--r-md);color:var(--text-muted);cursor:pointer}
.eye:hover{background:var(--surface-2);color:var(--text)}
.err{display:block;margin-top:6px;font-size:13px;line-height:18px;color:var(--danger)}
.row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 24px;min-height:44px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;min-height:44px}
.chk input{width:18px;height:18px;margin:0;accent-color:var(--bank-primary)}
.link{background:none;border:0;padding:10px 4px;font:inherit;font-size:14px;font-weight:600;color:var(--text);text-decoration:underline;text-underline-offset:3px;cursor:pointer;border-radius:var(--r-sm)}
.link:hover{text-decoration-thickness:2px}
.btn{width:100%;height:48px;display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-weight:600;font-size:15px;border-radius:var(--r-md);border:1px solid var(--bank-primary);background:var(--bank-primary);color:var(--bank-on);cursor:pointer;transition:background-color .12s var(--ease),transform .12s var(--ease),box-shadow .12s var(--ease)}
.btn:hover{background:color-mix(in srgb,var(--bank-primary) 88%,#000)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:3px}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.spin{width:16px;height:16px;border:2px solid color-mix(in srgb,var(--bank-on) 35%,transparent);border-top-color:var(--bank-on);border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:16px;border:1px solid var(--danger-line);background:var(--danger-bg);color:var(--danger);border-radius:var(--r-md);font-size:14px;line-height:20px}
.banner svg{flex:none;margin-top:2px}
.foot{display:flex;flex-wrap:wrap;gap:4px 20px;justify-content:center;align-items:center;padding-top:32px;font-size:13px;color:var(--text-muted)}
.foot a{color:var(--text-muted);padding:10px 2px;text-decoration:underline;text-underline-offset:3px}
.foot a:hover{color:var(--text)}
.env{width:100%;text-align:center;font-size:12px;color:var(--text-muted);padding-bottom:8px}

@media (max-width:1023px){.brand{padding:40px 32px}.pitch h2{font-size:26px;line-height:34px}.shell{grid-template-columns:minmax(0,4fr) minmax(0,5fr)}}
@media (max-width:767px){
 .shell{display:block}
 .brand{display:none}
 .side{min-height:100vh;padding:20px 20px 16px;justify-content:flex-start}
 .panel{margin:0 auto;padding-top:24px}
 .mobile-mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:32px}
 .mobile-mark i{font-style:normal;display:grid;place-items:center;width:32px;height:32px;border-radius:var(--r-md);background:var(--bank-primary);color:var(--bank-on);font-size:15px}
 .mobile-mark small{margin-left:auto;font-size:13px;font-weight:600;color:var(--text-muted)}
 .foot{margin-top:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation-duration:2s!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="brand" aria-label="Product">
    <div class="mark"><i aria-hidden="true">◆</i><span data-product-name>Harbor CRM</span></div>
    <svg viewBox="0 0 800 400" preserveAspectRatio="none" aria-hidden="true">
      <path opacity=".05" d="M0 120 C160 60 300 170 460 110 S720 60 800 100 V400 H0Z"/>
      <path opacity=".07" d="M0 200 C140 150 320 240 480 190 S700 150 800 190 V400 H0Z"/>
      <path opacity=".09" d="M0 280 C180 230 300 320 500 270 S700 240 800 275 V400 H0Z"/>
      <path opacity=".12" d="M0 345 C200 310 320 380 520 340 S720 320 800 345 V400 H0Z"/>
    </svg>
    <div class="pitch">
      <h2>Every customer, every deal, in one calm place.</h2>
      <p>Leads, contacts, quotes and tickets for your branch team, with nothing to set up before you start.</p>
    </div>
    <div class="bankline"><b aria-hidden="true">B</b><span data-bank-name>Your bank</span></div>
  </aside>

  <main class="side" data-testid="login-page">
    <div class="panel">
      <div class="mobile-mark"><i aria-hidden="true">◆</i><span data-product-name>Harbor CRM</span><small data-bank-name>Your bank</small></div>
      <form novalidate>
        <h1>Sign in</h1>
        <p class="sub">Use your work email to continue.</p>
        <label class="field"><span>Email</span>
          <input type="email" data-testid="login-email" placeholder="you@company.com" autocomplete="username"></label>
        <label class="field"><span>Password</span>
          <div class="ctl"><input type="password" data-testid="login-password" placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="eye" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></label>
        <div class="row">
          <label class="chk"><input type="checkbox" checked> Remember me</label>
          <button type="button" class="link">Forgot password?</button>
        </div>
        <button type="submit" class="btn" data-testid="login-submit">Sign in</button>
      </form>
    </div>
    <div class="foot"><a href="#">Help</a><a href="#">Privacy</a><span>v1.0 · staging</span></div>
  </main>
</div>
<script>
// Preview only: bank name and colour come from VITE_BANK_NAME and --bank-primary in the build.
var q=new URLSearchParams(location.search);
if(q.get('bank')){document.documentElement.style.setProperty('--bank-primary','#'+q.get('bank'));}
if(q.get('on')){document.documentElement.style.setProperty('--bank-on','#'+q.get('on'));}
</script>
</body>
</html>
