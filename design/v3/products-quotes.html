<title>Harbor Products and Quotes 3.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Products and Quotes is a catalogue and a paper desk. Every product is drawn as a card in its family colour that tilts towards the pointer; the product page has a price history; quotes are shown as the real document the customer gets, with a stamp when decided; a fan chart shows where quote value stands; the quote builder lets you drag products onto the paper and slide discounts, with approval above the bank limit. Tokens mirror src/styles/v3.css. */
:root {
  --bank-primary: #1d3a6e; --bank-on: #ffffff; --bank-ink-light: #1d3a6e; --bank-ink-dark: #9db8ee;
  --bank-ink: var(--bank-ink-light);
  --bg: color-mix(in srgb, var(--bank-primary) 4%, #f5f6f8);
  --surface: #ffffff;
  --surface-2: color-mix(in srgb, var(--bank-primary) 4%, #f3f4f6);
  --surface-3: color-mix(in srgb, var(--bank-primary) 7%, #e8eaee);
  --border: color-mix(in srgb, var(--bank-primary) 8%, #e2e5ea);
  --border-strong: color-mix(in srgb, var(--bank-primary) 10%, #cfd4dc);
  --text: #171b26; --text-muted: #5a6272;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 10%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 26%, var(--surface));
  --chrome-bg: color-mix(in srgb, var(--bank-primary) 26%, #0a0d15);
  --chrome-hover: color-mix(in srgb, var(--bank-primary) 34%, #151a26);
  --chrome-line: color-mix(in srgb, var(--bank-primary) 30%, #1c2331);
  --chrome-active: color-mix(in srgb, var(--bank-primary) 55%, #1a2030);
  --chrome-text: #cfd5e3; --chrome-muted: #98a1b6; --chrome-strong: #ffffff;
  --glass: color-mix(in srgb, var(--surface) 72%, transparent);
  --glass-line: color-mix(in srgb, var(--text) 9%, transparent);
  --scrim: color-mix(in srgb, var(--bank-primary) 18%, rgba(9, 12, 20, 0.5));
  --warn-bg: #fdf0d5; --warn-text: #8a5300; --danger-bg: #fde7e7; --danger-text: #a12626; --ok-bg: #dcf5ea; --ok-text: #0c6b47;
  --shadow: 0 1px 2px rgba(16, 22, 38, 0.05), 0 4px 12px -2px rgba(16, 22, 38, 0.07);
  --shadow-lg: 0 4px 8px rgba(16, 22, 38, 0.05), 0 24px 48px -12px rgba(16, 22, 38, 0.24);
  --shadow-dock: 0 18px 40px -16px color-mix(in srgb, var(--bank-primary) 70%, rgba(0, 0, 0, 0.6));
  --shadow-bank: 0 6px 18px -6px color-mix(in srgb, var(--bank-primary) 60%, transparent);
  --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --fast: 150ms; --base: 220ms; --slow: 350ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
  padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body.dragging { cursor: grabbing; -webkit-user-select: none; user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--bank-ink); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; display: block; }

.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 1280px; margin: 0 auto 14px; }

.deck h1 small { display: block; font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--text-muted); }
.pick { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
.seg { display: flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--surface-3); border-radius: 999px; }
.seg button { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 6px; transition: background var(--fast), color var(--fast); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }

.stage { container-type: inline-size; max-width: 1280px; margin: 0 auto; }
.app { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); height: clamp(640px, 86vh, 840px); border-radius: 20px; border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg);
  background: radial-gradient(60% 50% at 100% 0%, color-mix(in srgb, var(--bank-primary) 13%, transparent), transparent 70%), radial-gradient(50% 50% at 0% 100%, color-mix(in srgb, var(--bank-primary) 8%, transparent), transparent 70%), var(--bg); }
.rail { width: 60px; margin: 10px 0 10px 10px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; color: var(--chrome-muted); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-dock);
  background: radial-gradient(130% 42% at 0% 0%, color-mix(in srgb, var(--bank-primary) 62%, transparent), transparent 72%), var(--chrome-bg); }
.rail .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; background: var(--bank-primary); color: var(--bank-on); font-family: var(--font-display); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.rail span { width: 40px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.rail span.on { color: var(--chrome-strong); background: var(--chrome-active); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.main { position: relative; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.tb { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 10px 8px 16px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.crumb { display: flex; gap: 7px; color: var(--text-muted); font-size: 13px; white-space: nowrap; min-width: 0; overflow: hidden; }
.crumb b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.chip-me { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 5px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; background: var(--bank-primary); color: var(--bank-on); }
.av.sm { width: 24px; height: 24px; font-size: 9.5px; }
.av.soft { background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.page { flex: 1; padding: 22px 24px 90px; animation: enter var(--slow) var(--ease-out); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }

/* shared pieces */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 12px; font-weight: 550; white-space: nowrap; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  transition: transform var(--fast) var(--ease-spring), border-color var(--fast), filter var(--fast), background var(--fast), color var(--fast); }
.btn:hover { transform: translateY(-1px); border-color: var(--bank-soft-line); }
.btn:active { transform: scale(.97); }
.btn.pri { color: var(--bank-on); border-color: transparent; background: linear-gradient(180deg, color-mix(in srgb, var(--bank-primary) 90%, #fff), var(--bank-primary)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), var(--shadow-bank); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--text-muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger-text); }
.btn.sq { width: 38px; padding: 0; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 62%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.ph h2 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em; }
.ph p { margin: 2px 0 0; color: var(--text-muted); }
.ph .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }
.link { color: var(--bank-ink); font-weight: 550; } .link:hover { text-decoration: underline; }
.tg { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); }
.tg.add { border: 1px dashed var(--border-strong); background: none; box-shadow: none; }
.tg.add:hover { color: var(--bank-ink); border-color: var(--bank-soft-line); background: var(--bank-soft); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; flex: 1 1 220px; max-width: 320px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted); transition: box-shadow var(--fast), border-color var(--fast); }
.search:focus-within { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; border: 1px dashed var(--border-strong); color: var(--text-muted); font-weight: 500; white-space: nowrap; transition: background var(--fast), border-color var(--fast), color var(--fast); }
.fchip:hover { background: var(--surface); color: var(--text); }
.fchip.set { border-style: solid; border-color: var(--bank-soft-line); background: var(--bank-soft); color: var(--bank-ink); }
.pop-wrap { position: relative; }
.pop { position: absolute; z-index: 9; top: 44px; left: 0; width: 250px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); transform-origin: top left; animation: pop var(--base) var(--ease-spring); }
.pop.right { left: auto; right: 0; transform-origin: top right; }
.pop input { width: 100%; height: 34px; padding: 0 10px; margin-bottom: 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); outline: 0; }
.pop input:focus { border-color: var(--bank-ink); }
.pop .opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; font-weight: 500; }
.pop .opt:hover { background: var(--bank-soft); }
.pop .opt i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pop .opt .tick { margin-left: auto; color: var(--bank-ink); opacity: 0; }
.pop .opt[aria-checked="true"] .tick { opacity: 1; }
.pop .opt small { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.pop .none { padding: 10px; color: var(--text-muted); font-size: 12.5px; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-muted); }
.empty b { display: block; font-family: var(--font-display); font-size: 17px; color: var(--text); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
.back:hover { color: var(--bank-ink); }
.box { padding: 18px 20px; }
.box h3 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.box-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .box-h h3 { margin: 0; flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.kv { display: grid; gap: 10px; margin: 0; }
.kv div { display: flex; gap: 10px; align-items: center; }
.kv dt { width: 96px; flex: none; font-size: 12.5px; color: var(--text-muted); } .kv dd { margin: 0; min-width: 0; flex: 1; overflow-wrap: anywhere; font-weight: 500; display: flex; align-items: center; gap: 8px; }
/* dialogs, sheet, form basics (shared with Contacts and Accounts) */
.scrim { position: absolute; inset: 0; z-index: 10; background: var(--scrim); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 14px; animation: fade var(--base); }
.dlg { width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 22px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); animation: pop var(--slow) var(--ease-spring); overflow: hidden; }
.dlg-head { padding: 18px 22px 0; display: flex; align-items: center; gap: 10px; }
.dlg-head h3 { font-size: 19px; font-weight: 650; flex: 1; overflow-wrap: anywhere; }
.dlg-body { padding: 14px 22px 18px; overflow-y: auto; color: var(--text-muted); }
.dlg-foot { display: flex; gap: 8px; padding: 14px 22px; background: var(--surface-2); border-top: 1px solid var(--border); }
.dlg-foot .sp { flex: 1; }
.scrim.edge { place-items: stretch end; padding: 10px; }
.sheet { width: min(400px, 100%); display: flex; flex-direction: column; border-radius: 20px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); overflow: hidden; animation: slide var(--slow) var(--ease-out); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 22px 20px; display: grid; gap: 14px; align-content: start; }
.pick-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 14px; text-align: left; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); transition: transform var(--fast) var(--ease-spring), border-color var(--fast), background var(--fast), box-shadow var(--fast); }
.pick-item:hover { transform: translateX(-3px); border-color: var(--bank-ink); background: var(--bank-soft); box-shadow: 0 0 0 3px var(--bank-soft); color: var(--bank-ink); }
.pick-item .ext { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.pick-item div { flex: 1; min-width: 0; } .pick-item b { display: block; font-weight: 600; color: var(--text); } .pick-item small { font-size: 12.5px; }
.ltabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; }
.ltabs button { position: relative; padding: 10px 12px 12px; font-weight: 550; color: var(--text-muted); white-space: nowrap; transition: color var(--fast); }
.ltabs button:hover { color: var(--text); }
.ltabs button::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--bank-primary); transform: scaleX(0); transition: transform var(--base) var(--ease-out); }
.ltabs button[aria-selected="true"] { color: var(--bank-ink); } .ltabs button[aria-selected="true"]::after { transform: scaleX(1); }
.sect { padding: 20px 22px; animation: enter var(--base) var(--ease-out); }
.fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.fg .full { grid-column: 1 / -1; }
.f label, .f .flab { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; }
.f label .tg { font-size: 10.5px; padding: 0 6px; }
.f input, .f select, .f .fake { width: 100%; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); outline: 0; transition: border-color var(--fast), box-shadow var(--fast); display: flex; align-items: center; gap: 8px; text-align: left; }
.f input:focus, .f select:focus, .f .fake:focus-visible { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.f .fake .dn { margin-left: auto; color: var(--text-muted); }
.f .fake i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.f input[type="range"] { height: 28px; padding: 0; border: 0; box-shadow: none; background: none; accent-color: var(--bank-primary); }
.f label b { color: var(--bank-ink); font-variant-numeric: tabular-nums; }
.f.bad input, .f.bad .fake { border-color: var(--danger-text); }
.f .err { color: var(--danger-text); font-size: 12px; margin-top: 4px; }
.fpop { width: 100%; min-width: 240px; max-height: 300px; overflow-y: auto; }
.savebar { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; background: var(--surface-2); border-top: 1px solid var(--border); border-radius: 0 0 18px 18px; }
.toast { position: absolute; z-index: 12; left: 50%; bottom: 18px; transform: translate(-50%, 80px); padding: 10px 16px; border-radius: 14px; display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; color: var(--chrome-strong); background: var(--chrome-bg); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-lg); transition: transform var(--slow) var(--ease-spring); }
.toast.on { transform: translate(-50%, 0); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 6px 2px 46px; font-size: 12.5px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.legend em { margin-left: auto; font-style: normal; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; } }

/* ---- Products and Quotes ---- */
.face { width: 26px; height: 26px; border-radius: 50%; flex: none; display: inline-grid; place-items: center; font-size: 10px; font-weight: 650; color: #fff; background: var(--h); box-shadow: 0 0 0 2px var(--surface); }
.face.lg { width: 34px; height: 34px; font-size: 12px; }
:root { --paper: #fffdf9; --paper-ink: #1b2130; --paper-muted: #6b7180; --paper-line: #e8e3d8; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --paper: color-mix(in srgb, var(--bank-primary) 6%, #1d2331); --paper-ink: #e9ecf3; --paper-muted: #9aa3b6; --paper-line: #343c50; } }
:root[data-theme="dark"] { --paper: color-mix(in srgb, var(--bank-primary) 6%, #1d2331); --paper-ink: #e9ecf3; --paper-muted: #9aa3b6; --paper-line: #343c50; }
.page.quiet * { animation: none !important; }
textarea { font: inherit; color: inherit; }
.f textarea { width: 100%; min-height: 84px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); outline: 0; resize: vertical; }
.f textarea:focus { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.f .hint { font-size: 12px; color: var(--text-muted); margin-top: 5px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.money-in { position: relative; } .money-in span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); } .f .money-in input { padding-left: 26px; font-variant-numeric: tabular-nums; }
.switch { position: relative; width: 40px; height: 23px; flex: none; border-radius: 99px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); transition: background var(--base); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 17px; height: 17px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform var(--base) var(--ease-spring); }
.switch[aria-checked="true"] { background: var(--bank-primary); box-shadow: none; } .switch[aria-checked="true"]::after { transform: translateX(17px); }
.swrow { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); }
.swrow div { flex: 1; } .swrow b { display: block; } .swrow small { color: var(--text-muted); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 13px; font-size: 13px; background: var(--warn-bg); color: var(--warn-text); animation: enter var(--base) var(--ease-out); }
.note.info { background: var(--bank-soft); color: var(--bank-ink); }
.note.ok { background: var(--ok-bg); color: var(--ok-text); }
.vseg { margin-left: auto; }

/* the product card: every product is drawn as a card in its family colour, and it tilts towards the pointer */
.pc { position: relative; display: flex; flex-direction: column; justify-content: space-between; width: 100%; aspect-ratio: 1.586; padding: 14px 16px 13px; border-radius: 16px; overflow: hidden; color: #fff; text-align: left;
  background: radial-gradient(110% 80% at var(--mx, 25%) var(--my, 0%), rgba(255,255,255,.30), transparent 55%),
    linear-gradient(140deg, color-mix(in srgb, var(--fc) 92%, #fff), color-mix(in srgb, var(--fc) 62%, var(--bank-primary)) 58%, color-mix(in srgb, var(--bank-primary) 62%, #04060b));
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 0 0 1px rgba(255,255,255,.08), 0 18px 30px -18px color-mix(in srgb, var(--fc) 80%, #000);
  transform: perspective(800px) rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); transition: transform .6s var(--ease-out), box-shadow var(--base), filter var(--base); }
.pc::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-radial-gradient(circle at 115% 125%, rgba(255,255,255,.075) 0 1px, transparent 1px 13px); }
.pc.live { transition: transform 90ms linear, box-shadow var(--base); }
.pc > * { position: relative; }
.pc-top { display: flex; align-items: center; gap: 8px; }
.pc-ic { width: 34px; height: 26px; border-radius: 7px; display: grid; place-items: center; background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.12)); box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
.pc-bank { margin-left: auto; font-family: var(--font-display); font-size: 11.5px; font-weight: 650; opacity: .8; letter-spacing: .02em; }
.pc-nm { display: block; font-family: var(--font-display); font-size: 17px; line-height: 21px; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; text-shadow: 0 1px 2px rgba(0,0,0,.18); }
.pc-bot { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; }
.pc-sku { font-size: 11px; letter-spacing: .16em; opacity: .78; font-variant-numeric: tabular-nums; }
.pc-pr { font-family: var(--font-display); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pc-pr small { font-family: var(--font-sans); font-size: 11.5px; font-weight: 500; opacity: .85; margin-left: 3px; }
.pc.retired { filter: grayscale(.92) brightness(.9); }
.pc-ret { position: absolute !important; top: 15px; right: -30px; transform: rotate(35deg); width: 120px; text-align: center; padding: 2px 0; font-size: 10.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; background: rgba(0,0,0,.45); }
.pc.big { border-radius: 22px; padding: 22px 24px 20px; } .pc.big .pc-nm { font-size: 25px; line-height: 30px; } .pc.big .pc-pr { font-size: 26px; } .pc.big .pc-ic { width: 44px; height: 34px; border-radius: 9px; }

/* catalogue */
.fam { margin-bottom: 24px; }
.fam-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.fam-h h3 { font-size: 17px; font-weight: 650; }
.fdot { width: 10px; height: 10px; border-radius: 3px; background: var(--fc); box-shadow: 0 0 0 4px color-mix(in srgb, var(--fc) 16%, transparent); }
.fam-h .fv { margin-left: auto; font-size: 12.5px; color: var(--text-muted); }
.fam-h .fv b { color: var(--text); font-variant-numeric: tabular-nums; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(226px, 1fr)); gap: 18px 16px; }
.slot { display: flex; flex-direction: column; gap: 8px; text-align: left; border-radius: 16px; animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.slot:hover .pc { box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 26px 40px -20px color-mix(in srgb, var(--fc) 85%, #000); }
.slot-m { display: flex; justify-content: space-between; gap: 8px; padding: 0 4px; font-size: 12.5px; color: var(--text-muted); }
.slot-m b { color: var(--text); font-weight: 600; }
.plist { overflow: hidden; }
.pl-row { display: grid; grid-template-columns: 52px minmax(0, 1.6fr) 110px 150px 96px 130px 104px 64px; gap: 14px; align-items: center; padding: 10px 18px; border-top: 1px solid var(--border); cursor: pointer; transition: background var(--fast); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.pl-row:hover { background: color-mix(in srgb, var(--bank-primary) 3%, var(--surface-2)); }
.pl-row.head { border-top: 0; cursor: default; padding-top: 12px; padding-bottom: 8px; animation: none; } .pl-row.head:hover { background: none; }
.pl-row.dim { opacity: .62; }
.r { text-align: right; font-variant-numeric: tabular-nums; }
.mini { width: 52px; height: 33px; border-radius: 7px; background: linear-gradient(140deg, color-mix(in srgb, var(--fc) 92%, #fff), color-mix(in srgb, var(--fc) 62%, var(--bank-primary)) 60%, color-mix(in srgb, var(--bank-primary) 62%, #04060b)); box-shadow: 0 4px 10px -5px color-mix(in srgb, var(--fc) 80%, #000); display: grid; place-items: center; color: #fff; }
.mini.off { filter: grayscale(.9); }
.nm2 b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .nm2 small { color: var(--text-muted); font-size: 12px; letter-spacing: .06em; }
.wbar { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-variant-numeric: tabular-nums; }
.wbar span { flex: 1; height: 6px; border-radius: 9px; background: var(--surface-3); overflow: hidden; }
.wbar span i { display: block; height: 100%; width: var(--w); border-radius: inherit; background: #1f9d63; transform-origin: left; animation: grow var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }

/* product page */
.phero { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 28px; align-items: center; margin-bottom: 20px; }
.hero-card { animation: bob 6s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-6px); } }
.hero-t h2 { font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 6px; }
.hero-t p { margin: 0 0 12px; color: var(--text-muted); max-width: 60ch; }
.hero-t .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
.hero-t .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.fig { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.fig b { font-family: var(--font-display); font-size: 25px; line-height: 30px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.fig small { color: var(--text-muted); font-size: 12.5px; }
.fig.ring { flex-direction: row; align-items: center; gap: 14px; }
.ringsvg { width: 62px; height: 62px; flex: none; transform: rotate(-90deg); }
.ringsvg circle { fill: none; stroke-width: 7; }
.ringsvg .arc { stroke: #1f9d63; stroke-linecap: round; stroke-dasharray: var(--v) 100; animation: arc 1s var(--ease-out) backwards .2s; }
@keyframes arc { from { stroke-dasharray: 0 100; } }
.lim { position: relative; height: 8px; border-radius: 9px; background: var(--surface-3); margin: 8px 0 4px; }
.lim i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); border-radius: inherit; background: var(--bank-primary); transform-origin: left; animation: grow var(--slow) var(--ease-out) backwards .2s; }
.lim i.over { background: #e0611a; }
.lim em { position: absolute; top: -4px; bottom: -4px; left: var(--l); width: 2px; border-radius: 2px; background: var(--text); }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .ln2 { fill: none; stroke: var(--bank-ink); stroke-width: 2.5; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s var(--ease-out) forwards .15s; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .area { fill: url(#pg); opacity: 0; animation: fade .8s forwards .6s; }
@keyframes fade2 { to { opacity: 1; } }
.chart .area { animation-name: fade2; }
.chart .gl { stroke: var(--border); stroke-dasharray: 3 4; }
.chart text { fill: var(--text-muted); font-size: 11px; font-family: var(--font-sans); }
.chart .pt { fill: var(--surface); stroke: var(--bank-ink); stroke-width: 2.5; }
.chart .pl { fill: var(--text); font-weight: 600; font-size: 11.5px; }
.uq { display: grid; grid-template-columns: 112px minmax(0, 1fr) auto auto; gap: 12px; align-items: center; width: 100%; text-align: left; padding: 10px 6px; border-top: 1px solid var(--border); border-radius: 0; transition: background var(--fast); }
.uq:hover { background: var(--surface-2); }
.uq b { font-variant-numeric: tabular-nums; font-weight: 600; } .uq .ac { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .uq small { color: var(--text-muted); font-size: 12px; display: block; }
.dz { display: inline-flex; padding: 1px 8px; border-radius: 99px; font-size: 11.5px; font-weight: 650; background: var(--surface-2); color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); font-variant-numeric: tabular-nums; }
.dz.over { background: var(--warn-bg); color: var(--warn-text); box-shadow: none; }
.lead { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 13px; }
.lead:first-of-type { border-top: 0; } .lead div { flex: 1; min-width: 0; } .lead b { display: block; font-weight: 550; } .lead small { color: var(--text-muted); }

/* product form */
.pfcols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 18px; align-items: start; }
.prev { position: sticky; top: 74px; display: grid; gap: 14px; }
.prev .qline { padding: 12px 14px; border-radius: 12px; background: var(--paper); color: var(--paper-ink); box-shadow: 0 0 0 1px var(--paper-line), var(--shadow); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; font-size: 13px; }
.prev .qline small { color: var(--paper-muted); font-size: 11.5px; } .prev .qline .r { font-weight: 600; }
.sug { display: inline-flex; align-items: center; gap: 5px; padding: 1px 9px; border-radius: 99px; font-size: 12px; font-weight: 600; color: var(--bank-ink); background: var(--bank-soft); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.sect + .sect { border-top: 1px solid var(--border); }
.sect h3 { font-size: 15px; font-weight: 650; margin-bottom: 14px; }

/* quotes desk */
.qtop { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(250px, 1fr); gap: 14px; margin-bottom: 16px; }
.fanc { padding: 16px 18px 10px; overflow: hidden; }
.fan { width: 100%; height: auto; display: block; }
.fan text { font-family: var(--font-sans); fill: var(--text-muted); font-size: 12px; }
.fan .big { font-family: var(--font-display); fill: var(--text); font-size: 22px; font-weight: 700; }
.fan .nmv { fill: var(--text); font-weight: 600; font-size: 13px; }
.fan .rib { cursor: pointer; transition: opacity var(--base); }
.fan .rib path { fill: var(--c); opacity: .26; transition: opacity var(--base); transform-origin: 170px 50%; animation: ribin .9s var(--ease-out) backwards; animation-delay: var(--d); }
@keyframes ribin { from { transform: scaleX(0); } }
.fan .rib:hover path, .fan .rib.on path { opacity: .55; }
.fan .rib rect { fill: var(--c); }
.fan.picked .rib:not(.on) { opacity: .45; }
.fanbar { display: none; }
.fanbar .bar { display: flex; height: 14px; border-radius: 99px; overflow: hidden; gap: 2px; margin: 4px 0 12px; }
.fanbar .bar i { background: var(--c); flex: var(--f) 1 0; min-width: 4px; transform-origin: left; animation: grow var(--slow) var(--ease-out) backwards; }
.fanbar .leg { display: grid; gap: 4px; }
.fanbar .leg button { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 10px; text-align: left; font-size: 13px; }
.fanbar .leg button:hover, .fanbar .leg button.on { background: var(--surface-2); }
.fanbar .leg i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.fanbar .leg span { margin-left: auto; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.watch { display: grid; gap: 14px; align-content: start; }
.wcard { padding: 14px 16px; }
.wcard .wh { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; margin-bottom: 8px; }
.wcard .wh b { font-family: var(--font-display); font-size: 24px; line-height: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.wcard .wh span { flex: 1; font-weight: 600; } .wcard .wh .ico { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; background: var(--c-bg); color: var(--c-fg); }
.witem { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; margin: 0 -8px; border-radius: 10px; font-size: 13px; text-align: left; }
.witem:hover { background: var(--surface-2); } .witem b { font-variant-numeric: tabular-nums; font-weight: 600; } .witem span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); } .witem em { font-style: normal; font-size: 12px; font-weight: 600; }
.grp { margin-bottom: 16px; }
.grp-h { display: flex; align-items: baseline; gap: 10px; padding: 0 4px 8px; }
.grp-h h3 { font-size: 15px; font-weight: 650; } .grp-h span { color: var(--text-muted); font-size: 12.5px; }
.grp-h .gv { margin-left: auto; font-variant-numeric: tabular-nums; }
.qr { display: grid; grid-template-columns: 26px 40px minmax(0, 1fr) 170px 150px 150px; gap: 14px; align-items: center; padding: 11px 18px 11px 14px; border-top: 1px solid var(--border); cursor: pointer; transition: background var(--fast); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.qr:first-child { border-top: 0; }
.qr:hover { background: color-mix(in srgb, var(--bank-primary) 3%, var(--surface-2)); }
.qr.sel { background: var(--bank-soft); }
.ck { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; cursor: pointer; }
.ck input { width: 16px; height: 16px; accent-color: var(--bank-primary); cursor: pointer; }
.thumb { position: relative; width: 34px; height: 44px; border-radius: 4px; background: var(--paper); box-shadow: 0 0 0 1px var(--paper-line), 0 6px 12px -6px rgba(16,22,38,.4); padding: 7px 5px 0; display: grid; gap: 3px; align-content: start; overflow: hidden; transform: rotate(-3deg); transition: transform var(--base) var(--ease-spring); }
.qr:hover .thumb { transform: rotate(0deg) translateY(-2px) scale(1.06); }
.thumb::before { content: ''; position: absolute; inset: 0 0 auto; height: 3px; background: var(--bank-primary); }
.thumb i { height: 2.5px; border-radius: 2px; background: var(--paper-line); } .thumb i:nth-child(2n) { width: 70%; }
.thumb em { position: absolute; right: -2px; bottom: 5px; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--c); transform: rotate(-14deg); }
.qm2 { min-width: 0; } .qm2 .t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.qm2 .t b { font-variant-numeric: tabular-nums; flex: none; } .qm2 .t span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qm2 small { display: block; color: var(--text-muted); font-size: 12.5px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vd { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); min-width: 0; }
.vd b { color: var(--text); font-weight: 600; } .vd.soon b { color: var(--warn-text); } .vd.late b { color: var(--danger-text); }
.vring { width: 26px; height: 26px; flex: none; transform: rotate(-90deg); }
.vring circle { fill: none; stroke-width: 4; } .vring .bg { stroke: var(--surface-3); } .vring .fg { stroke: var(--c); stroke-linecap: round; stroke-dasharray: var(--v) 100; }
.amt { text-align: right; } .amt b { display: block; font-family: var(--font-display); font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; } .amt small { color: var(--text-muted); font-size: 11.5px; }
.stc2 { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
.apb { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; color: var(--warn-text); } .apb.ok { color: var(--ok-text); }
.selbar { position: sticky; bottom: 14px; z-index: 5; display: flex; align-items: center; gap: 10px; width: fit-content; max-width: 100%; margin: 12px auto 0; padding: 8px 8px 8px 16px; border-radius: 16px; color: var(--chrome-strong); background: var(--chrome-bg); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-lg); animation: pop var(--slow) var(--ease-spring); }
.selbar .btn { height: 34px; background: var(--chrome-hover); border-color: var(--chrome-line); color: var(--chrome-strong); box-shadow: none; }
.selbar .btn.danger { color: #ffb1b1; }

/* the paper: a quote is shown as the document the customer gets */
.paper { position: relative; background: var(--paper); color: var(--paper-ink); border-radius: 5px; padding: 32px 34px 26px; font-size: 12.5px; overflow: hidden;
  box-shadow: 0 0 0 1px var(--paper-line), 0 2px 4px rgba(16,22,38,.06), 0 30px 60px -30px rgba(16,22,38,.55); transition: box-shadow var(--base), transform var(--base) var(--ease-spring); }
.paper::before { content: ''; position: absolute; inset: 0 0 auto; height: 6px; background: linear-gradient(90deg, var(--bank-primary), color-mix(in srgb, var(--bank-primary) 45%, #fff)); }
.paper.thud { animation: thud .32s ease-out .28s; }
@keyframes thud { 40% { transform: translateY(3px) scale(.995); } }
.lh { display: flex; align-items: flex-start; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid var(--paper-line); }
.blogo { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--bank-primary); color: var(--bank-on); font-family: var(--font-display); font-weight: 700; font-size: 19px; }
.lh .bn b { display: block; font-family: var(--font-display); font-size: 16px; font-weight: 700; } .lh .bn small { color: var(--paper-muted); font-size: 11.5px; }
.lh .qn { margin-left: auto; text-align: right; } .lh .qn .lab { color: var(--paper-muted); } .lh .qn b { display: block; font-family: var(--font-display); font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; } .lh .qn small { color: var(--paper-muted); }
.bill { display: grid; grid-template-columns: 1.4fr 1fr 1fr; gap: 14px; padding: 14px 0 16px; }
.bill .lab { color: var(--paper-muted); font-size: 10px; } .bill b { display: block; font-weight: 600; margin-top: 2px; } .bill small { color: var(--paper-muted); }

}

function priceChart(p) {
  const W = 560, H = 170, l = 30, r = 16, t = 24, b = 26, from = -730;
  const pts = p.hist.map(([d, v, u]) => [Math.max(d, from), v, u]);
  const vs = pts.map((x) => x[1]), lo = Math.min(...vs) * 0.8, hi = Math.max(...vs) * 1.12;
  const X = (d) => l + ((d - from) / -from) * (W - l - r), Y = (v) => t + (1 - (v - lo) / (hi - lo)) * (H - t - b);
  let path = `M${X(pts[0][0])},${Y(pts[0][1])}`;
  pts.slice(1).forEach(([d, v]) => { path += ` H${X(d)} V${Y(v)}`; });
  path += ` H${X(0)}`;
  const area = path + ` V${H - b} H${X(pts[0][0])} Z`;
  const ticks = [-730, -548, -365, -183, 0].map((d) => `<text x="${X(d)}" y="${H - 6}" text-anchor="middle">${dt(d).toLocaleDateString('en-GB', { month: 'short', year: 'numeric' })}</text>`).join('');
  const grid = [lo + (hi - lo) * 0.25, lo + (hi - lo) * 0.75].map((v) => `<line class="gl" x1="${l}" x2="${W - r}" y1="${Y(v)}" y2="${Y(v)}"/>`).join('');
  const dots = pts.map(([d, v, u], i) => `<g><circle class="pt" cx="${X(d)}" cy="${Y(v)}" r="5"><title>${money(v)} from ${day(d)} · set by ${USERS[u][0]}</title></circle><text class="pl" x="${X(d) + (i === pts.length - 1 && X(d) > W - 90 ? -8 : 8)}" y="${Y(v) - 9}" text-anchor="${i === pts.length - 1 && X(d) > W - 90 ? 'end' : 'start'}">${money(v)}</text></g>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Price over the last two years"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--bank-primary)" stop-opacity=".22"/><stop offset="1" stop-color="var(--bank-primary)" stop-opacity="0"/></linearGradient></defs>${grid}<path class="area" d="${area}"/><path class="ln2" d="${path}" pathLength="1"/>${dots}${ticks}</svg>`;
}
function productView() {

/* ---------- Product form ---------- */

/* ---------- Quotes desk ---------- */
function fanSVG() {
  const cats = Object.keys(STC), vals = cats.map((s) => Q.filter((q) => q.st === s).reduce((t, q) => t + fyOf(q), 0)), cnt = cats.map((s) => Q.filter((q) => q.st === s).length);
  const tot = vals.reduce((a, b) => a + b, 0) || 1, H = 200, gap = 14, top = 14, L = 196, R = 420, sc = H / tot;
  let ly = top, ry = top, ribs = '', lastLab = -99;
  cats.forEach((s, i) => {
    const h = Math.max(3, vals[i] * sc), mid = (L + R) / 2;
    const d = `M${L},${ly} C${mid},${ly} ${mid},${ry} ${R},${ry} V${ry + h} C${mid},${ry + h} ${mid},${ly + h} ${L},${ly + h} Z`;
    ribs += `<g class="rib ${qf === s ? 'on' : ''}" data-a="qf" data-f="${s}" style="--c:${STC[s]}" role="button" aria-label="Show ${s} quotes"><path d="${d}" style="--d:${i * 90}ms"/><rect x="${R}" y="${ry}" width="8" height="${h}" rx="3"/><text class="nmv" x="${R + 18}" y="${(lastLab = Math.max(ry + h / 2, lastLab + 36)) - 2}">${s}</text><text x="${R + 18}" y="${lastLab + 14}">${cnt[i]} · ${short(vals[i])}</text></g>`;
    ly += h; ry += h + gap;
  });
  const vb = Math.max(ry, top + H + 4, lastLab + 24) + 6;
  return `<svg class="fan ${qf !== 'all' && STC[qf] ? 'picked' : ''}" viewBox="0 0 600 ${vb}" role="img" aria-label="Quotes by status"><rect x="${L - 8}" y="${top}" width="8" height="${ly - top}" rx="3" fill="var(--bank-primary)"/><text x="${L - 20}" y="${top + (ly - top) / 2 - 8}" text-anchor="end">All ${Q.length} quotes</text><text class="big" x="${L - 20}" y="${top + (ly - top) / 2 + 18}" text-anchor="end">${short(tot)}</text>${ribs}</svg>
  <div class="fanbar"><div class="bar">${cats.map((s, i) => `<i style="--c:${STC[s]};--f:${vals[i] || 0.01}"></i>`).join('')}</div><div class="leg">${cats.map((s, i) => `<button class="${qf === s ? 'on' : ''}" data-a="qf" data-f="${s}"><i style="--c:${STC[s]}"></i>${s}<span>${cnt[i]} · ${short(vals[i])}</span></button>`).join('')}</div></div>`;
}
const daysLeft = (q) => q.valid;
function validity(q) {
  if (q.st === 'Draft') return `<span class="vd">${ic('clock', 15)}<span>Valid till <b>${dayS(q.valid)}</b></span></span>`;
  if (q.st === 'Sent') {
    const left = daysLeft(q), total = Math.max(1, q.valid - q.sent), v = Math.max(4, (left / total) * 100), c = left <= 2 ? '#d33a3a' : left <= 7 ? '#d9a21a' : '#1f9d63';
    return `<span class="vd ${left <= 2 ? 'late' : left <= 7 ? 'soon' : ''}"><svg class="vring" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.9"/><circle class="fg" cx="18" cy="18" r="15.9" pathLength="100" style="--c:${c};--v:${v}"/></svg><span><b>${plural(left, 'day')}</b> left</span></span>`;
  }
  if (q.st === 'Accepted') return `<span class="vd">${ic('check', 15)}<span>Accepted <b>${dayS(q.dec)}</b></span></span>`;
  if (q.st === 'Rejected') return `<span class="vd"><span>${esc(q.reason || 'Rejected')}</span></span>`;
  return `<span class="vd">${ic('hourglass', 15)}<span>Expired <b>${dayS(q.dec)}</b></span></span>`;
}
function qrow(q, i) {
  const a = ACC[q.acc], ap = needsAppr(q) && q.st === 'Draft' ? (q.appr === 'approved' ? `<span class="apb ok">${ic('shield', 13)}Approved</span>` : q.appr === 'waiting' ? `<span class="apb">${ic('shield', 13)}Waiting for approval</span>` : `<span class="apb">${ic('shield', 13)}Needs approval</span>`) : '';
  return `<div class="qr ${sel.has(q.id) ? 'sel' : ''}" data-a="openQ" data-id="${q.id}" role="link" tabindex="0" style="--d:${i * 30}ms">
    <label class="ck" data-a="sel" data-id="${q.id}"><input type="checkbox" ${sel.has(q.id) ? 'checked' : ''} aria-label="Select ${q.id}"></label>
    <span class="thumb" aria-hidden="true">${q.lines.slice(0, 5).map(() => '<i></i>').join('')}${DECIDED.includes(q.st) ? `<em style="--c:${STC[q.st]}"></em>` : ''}</span>
    <span class="qm2"><span class="t"><b>${q.id}</b><span>${esc(a[0])}</span></span><small>${q.deal ? esc(DEALS[q.deal][0]) : 'No deal'} · ${plural(q.lines.length, 'line')} · ${USERS[q.own][0]}</small></span>
    ${validity(q)}
    <span class="amt"><b>${short(fyOf(q))}</b><small>first-year value</small></span>
    <span class="stc2">${pill(q.st)}${ap}</span></div>`;
}
function quotesView() {
  const s = qs.trim().toLowerCase();
  const base = Q.filter((q) => !s || (q.id + ' ' + ACC[q.acc][0] + ' ' + (q.deal ? DEALS[q.deal][0] : '')).toLowerCase().includes(s));
  const waiting = Q.filter((q) => q.st === 'Draft' && needsAppr(q) && q.appr !== 'approved'), soon = Q.filter((q) => q.st === 'Sent' && q.valid <= 7).sort((a, b) => a.valid - b.valid);
  const openV = Q.filter((q) => !DECIDED.includes(q.st)).reduce((t, q) => t + fyOf(q), 0);
  let body, n = 0;
  const fl = { all: null, appr: ['Waiting for approval', (q) => q.st === 'Draft' && needsAppr(q) && q.appr !== 'approved'], soon: ['Expiring within 7 days', (q) => q.st === 'Sent' && q.valid <= 7] };
  if (qf !== 'all') {
    const [title, fn] = fl[qf] || [qf, (q) => q.st === qf];
    const list = base.filter(fn);
    body = `<div class="grp"><div class="grp-h"><h3>${esc(title)}</h3><span>${list.length}</span><button class="link" data-a="qf" data-f="all" style="margin-left:auto">Show all quotes</button></div><div class="card q">${list.map((q) => qrow(q, n++)).join('') || '<div class="empty"><b>No quotes here</b></div>'}</div></div>`;
  } else {
    const groups = [['Needs you', 'Drafts to finish, approve or send', base.filter((q) => q.st === 'Draft').sort((a, b) => b.c - a.c)], ['With the customer', 'Sent, waiting for an answer', base.filter((q) => q.st === 'Sent').sort((a, b) => a.valid - b.valid)], ['Decided', 'Accepted, rejected or expired', base.filter((q) => DECIDED.includes(q.st)).sort((a, b) => b.dec - a.dec)]];
    body = groups.filter((g) => g[2].length).map(([t, sub, list]) => `<div class="grp"><div class="grp-h"><h3>${t}</h3><span>${sub}</span><span class="gv muted">${list.length} · <b style="color:var(--text)">${short(list.reduce((x, q) => x + fyOf(q), 0))}</b></span></div><div class="card q">${list.map((q) => qrow(q, n++)).join('')}</div></div>`).join('') || `<div class="card empty"><b>No quotes match “${esc(qs)}”</b></div>`;
  }
  const wl = (list, fmt) => list.slice(0, 3).map((q) => `<button class="witem" data-a="openQ" data-id="${q.id}"><b>${q.id}</b><span>${esc(ACC[q.acc][0])}</span>${fmt(q)}</button>`).join('') || '<div class="muted" style="font-size:13px">Nothing right now.</div>';
  return `<div class="ph"><div><h2>Quotes</h2><p>${short(openV)} first-year value still open across ${plural(Q.filter((q) => !DECIDED.includes(q.st)).length, 'quote')}.</p></div>
    <div class="acts">${toolbox('quotes')}<button class="btn pri" data-a="newQuote">${ic('plus')}New quote</button></div></div>
  <div class="qtop">
    <div class="card fanc"><div class="box-h"><h3>Where quotes stand</h3><span class="muted" style="font-size:12.5px">by first-year value · click a status to filter</span></div>${fanSVG()}</div>
    <div class="watch">
      <div class="card wcard"><button class="wh" data-a="qf" data-f="appr"><i class="ico" style="--c-bg:var(--warn-bg);--c-fg:var(--warn-text)">${ic('shield', 17)}</i><span>Waiting for approval</span><b>${waiting.length}</b></button>${wl(waiting, (q) => `<em style="color:var(--warn-text)">${Math.max(...q.lines.map((l) => l.d))}% off</em>`)}</div>
      <div class="card wcard"><button class="wh" data-a="qf" data-f="soon"><i class="ico" style="--c-bg:var(--danger-bg);--c-fg:var(--danger-text)">${ic('hourglass', 17)}</i><span>Expiring within 7 days</span><b>${soon.length}</b></button>${wl(soon, (q) => `<em style="color:${q.valid <= 2 ? 'var(--danger-text)' : 'var(--warn-text)'}">${plural(q.valid, 'day')}</em>`)}</div>
    </div>
  </div>
  <div class="tools"><label class="search">${ic('search', 16)}<input data-i="qs" value="${esc(qs)}" placeholder="Search quote number, account or deal" aria-label="Search quotes"></label>${qf !== 'all' ? `<button class="fchip set" data-a="qf" data-f="all">${esc((fl[qf] || [qf])[0])}${ic('x', 14)}</button>` : ''}</div>
  ${body}
  ${sel.size ? `<div class="selbar"><b>${sel.size} selected</b><button class="btn" data-a="selNone">Clear</button><button class="btn danger" data-a="bulkDel">${ic('trash', 16)}Delete</button></div>` : ''}`;
}

/* ---------- the paper ---------- */
function paper(q, live) {

/* tilt: product cards lean towards the pointer */
let tiltEl = null;
document.addEventListener('pointermove', (e) => {
  if (reduced || e.pointerType === 'touch' || drag) return;
  const c = e.target.closest ? e.target.closest('.tilt') : null;
  if (tiltEl && tiltEl !== c) { tiltEl.classList.remove('live'); tiltEl.style.cssText = tiltEl.style.cssText.replace(/--(rx|ry|mx|my):[^;]+;?/g, ''); }
  tiltEl = c; if (!c) return;
  const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
  c.classList.add('live'); c.style.setProperty('--ry', ((px - 0.5) * 16).toFixed(2) + 'deg'); c.style.setProperty('--rx', ((0.5 - py) * 12).toFixed(2) + 'deg'); c.style.setProperty('--mx', (px * 100).toFixed(0) + '%'); c.style.setProperty('--my', (py * 100).toFixed(0) + '%');
});

  const r = $('app').getBoundingClientRect(); drag.fly.style.left = e.clientX - r.left - 24 + 'px'; drag.fly.style.top = e.clientY - r.top - 20 + 'px';
  const pb = $('paperbox'), hit = document.elementFromPoint(e.clientX, e.clientY);
