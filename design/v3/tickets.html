<title>Harbor Tickets 3.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Tickets is a service desk run by the clock. An SLA dial and live fuses show how much time each ticket has left; a team board to hand tickets out by dragging; a ticket room with a time track, a chat style conversation and internal notes; a full page form that shows the SLA promise; an SLA policy ladder in Setup. Tokens mirror src/styles/v3.css. */
:root {
  --bank-primary: #1d3a6e; --bank-on: #ffffff; --bank-ink-light: #1d3a6e; --bank-ink-dark: #9db8ee;
  --bank-ink: var(--bank-ink-light);
  --bg: color-mix(in srgb, var(--bank-primary) 4%, #f5f6f8);
  --surface: #ffffff;
  --surface-2: color-mix(in srgb, var(--bank-primary) 4%, #f3f4f6);
  --surface-3: color-mix(in srgb, var(--bank-primary) 7%, #e8eaee);
  --border: color-mix(in srgb, var(--bank-primary) 8%, #e2e5ea);
  --border-strong: color-mix(in srgb, var(--bank-primary) 10%, #cfd4dc);
  --text: #171b26; --text-muted: #5a6272;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 10%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 26%, var(--surface));
  --chrome-bg: color-mix(in srgb, var(--bank-primary) 26%, #0a0d15);
  --chrome-hover: color-mix(in srgb, var(--bank-primary) 34%, #151a26);
  --chrome-line: color-mix(in srgb, var(--bank-primary) 30%, #1c2331);
  --chrome-active: color-mix(in srgb, var(--bank-primary) 55%, #1a2030);
  --chrome-text: #cfd5e3; --chrome-muted: #98a1b6; --chrome-strong: #ffffff;
  --glass: color-mix(in srgb, var(--surface) 72%, transparent);
  --glass-line: color-mix(in srgb, var(--text) 9%, transparent);
  --scrim: color-mix(in srgb, var(--bank-primary) 18%, rgba(9, 12, 20, 0.5));
  --warn-bg: #fdf0d5; --warn-text: #8a5300; --danger-bg: #fde7e7; --danger-text: #a12626; --ok-bg: #dcf5ea; --ok-text: #0c6b47;
  --shadow: 0 1px 2px rgba(16, 22, 38, 0.05), 0 4px 12px -2px rgba(16, 22, 38, 0.07);
  --shadow-lg: 0 4px 8px rgba(16, 22, 38, 0.05), 0 24px 48px -12px rgba(16, 22, 38, 0.24);
  --shadow-dock: 0 18px 40px -16px color-mix(in srgb, var(--bank-primary) 70%, rgba(0, 0, 0, 0.6));
  --shadow-bank: 0 6px 18px -6px color-mix(in srgb, var(--bank-primary) 60%, transparent);
  --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --fast: 150ms; --base: 220ms; --slow: 350ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {

  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
  padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body.dragging { cursor: grabbing; -webkit-user-select: none; user-select: none; }
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--bank-ink); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; display: block; }
h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }

.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 1280px; margin: 0 auto 14px; }
.deck h1 { font-family: var(--font-display); font-size: 20px; font-weight: 650; margin: 0; flex: 1 1 200px; }
.deck h1 small { display: block; font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--text-muted); }
.pick { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
.seg { display: flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--surface-3); border-radius: 999px; }
.seg button { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 6px; transition: background var(--fast), color var(--fast); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }

.stage { container-type: inline-size; max-width: 1280px; margin: 0 auto; }
.app { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); height: clamp(640px, 86vh, 840px); border-radius: 20px; border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg);
  background: radial-gradient(60% 50% at 100% 0%, color-mix(in srgb, var(--bank-primary) 13%, transparent), transparent 70%), radial-gradient(50% 50% at 0% 100%, color-mix(in srgb, var(--bank-primary) 8%, transparent), transparent 70%), var(--bg); }
.rail { width: 60px; margin: 10px 0 10px 10px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; color: var(--chrome-muted); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-dock);
  background: radial-gradient(130% 42% at 0% 0%, color-mix(in srgb, var(--bank-primary) 62%, transparent), transparent 72%), var(--chrome-bg); }
.rail .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; background: var(--bank-primary); color: var(--bank-on); font-family: var(--font-display); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.rail span { width: 40px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.rail span.on { color: var(--chrome-strong); background: var(--chrome-active); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.main { position: relative; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.tb { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 10px 8px 16px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.crumb { display: flex; gap: 7px; color: var(--text-muted); font-size: 13px; white-space: nowrap; min-width: 0; overflow: hidden; }
.crumb b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.chip-me { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 5px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; background: var(--bank-primary); color: var(--bank-on); }
.av.sm { width: 24px; height: 24px; font-size: 9.5px; }
.av.soft { background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.page { flex: 1; padding: 22px 24px 90px; animation: enter var(--slow) var(--ease-out); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }

/* shared pieces */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 12px; font-weight: 550; white-space: nowrap; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  transition: transform var(--fast) var(--ease-spring), border-color var(--fast), filter var(--fast), background var(--fast), color var(--fast); }
.btn:hover { transform: translateY(-1px); border-color: var(--bank-soft-line); }
.btn:active { transform: scale(.97); }
.btn.pri { color: var(--bank-on); border-color: transparent; background: linear-gradient(180deg, color-mix(in srgb, var(--bank-primary) 90%, #fff), var(--bank-primary)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), var(--shadow-bank); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--text-muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger-text); }
.btn.sq { width: 38px; padding: 0; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 62%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.ph h2 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em; }
.ph p { margin: 2px 0 0; color: var(--text-muted); }
.ph .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }
.link { color: var(--bank-ink); font-weight: 550; } .link:hover { text-decoration: underline; }
.tg { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); }
.tg.add { border: 1px dashed var(--border-strong); background: none; box-shadow: none; }
.tg.add:hover { color: var(--bank-ink); border-color: var(--bank-soft-line); background: var(--bank-soft); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; flex: 1 1 220px; max-width: 320px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted); transition: box-shadow var(--fast), border-color var(--fast); }
.search:focus-within { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; border: 1px dashed var(--border-strong); color: var(--text-muted); font-weight: 500; white-space: nowrap; transition: background var(--fast), border-color var(--fast), color var(--fast); }
.fchip:hover { background: var(--surface); color: var(--text); }
.fchip.set { border-style: solid; border-color: var(--bank-soft-line); background: var(--bank-soft); color: var(--bank-ink); }
.pop-wrap { position: relative; }
.pop { position: absolute; z-index: 9; top: 44px; left: 0; width: 250px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); transform-origin: top left; animation: pop var(--base) var(--ease-spring); }
.pop.right { left: auto; right: 0; transform-origin: top right; }
.pop input { width: 100%; height: 34px; padding: 0 10px; margin-bottom: 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); outline: 0; }
.pop input:focus { border-color: var(--bank-ink); }
.pop .opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; font-weight: 500; }
.pop .opt:hover { background: var(--bank-soft); }
.pop .opt i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pop .opt .tick { margin-left: auto; color: var(--bank-ink); opacity: 0; }
.pop .opt[aria-checked="true"] .tick { opacity: 1; }
.pop .opt small { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.pop .none { padding: 10px; color: var(--text-muted); font-size: 12.5px; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-muted); }
.empty b { display: block; font-family: var(--font-display); font-size: 17px; color: var(--text); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
.back:hover { color: var(--bank-ink); }
.box { padding: 18px 20px; }
.box h3 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.box-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .box-h h3 { margin: 0; flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.kv { display: grid; gap: 10px; margin: 0; }
.kv div { display: flex; gap: 10px; align-items: center; }
.kv dt { width: 96px; flex: none; font-size: 12.5px; color: var(--text-muted); } .kv dd { margin: 0; min-width: 0; flex: 1; overflow-wrap: anywhere; font-weight: 500; display: flex; align-items: center; gap: 8px; }
/* dialogs, sheet, form basics (shared with Contacts and Accounts) */
.scrim { position: absolute; inset: 0; z-index: 10; background: var(--scrim); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 14px; animation: fade var(--base); }
.dlg { width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 22px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); animation: pop var(--slow) var(--ease-spring); overflow: hidden; }
.dlg-head { padding: 18px 22px 0; display: flex; align-items: center; gap: 10px; }
.dlg-head h3 { font-size: 19px; font-weight: 650; flex: 1; overflow-wrap: anywhere; }
.dlg-body { padding: 14px 22px 18px; overflow-y: auto; color: var(--text-muted); }
.dlg-foot { display: flex; gap: 8px; padding: 14px 22px; background: var(--surface-2); border-top: 1px solid var(--border); }
.dlg-foot .sp { flex: 1; }
.scrim.edge { place-items: stretch end; padding: 10px; }
.sheet { width: min(400px, 100%); display: flex; flex-direction: column; border-radius: 20px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); overflow: hidden; animation: slide var(--slow) var(--ease-out); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 22px 20px; display: grid; gap: 14px; align-content: start; }
.pick-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 14px; text-align: left; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); transition: transform var(--fast) var(--ease-spring), border-color var(--fast), background var(--fast), box-shadow var(--fast); }
.pick-item:hover { transform: translateX(-3px); border-color: var(--bank-ink); background: var(--bank-soft); box-shadow: 0 0 0 3px var(--bank-soft); color: var(--bank-ink); }
.pick-item .ext { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.pick-item div { flex: 1; min-width: 0; } .pick-item b { display: block; font-weight: 600; color: var(--text); } .pick-item small { font-size: 12.5px; }
.ltabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; }
.ltabs button { position: relative; padding: 10px 12px 12px; font-weight: 550; color: var(--text-muted); white-space: nowrap; transition: color var(--fast); }
.ltabs button:hover { color: var(--text); }
.ltabs button::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--bank-primary); transform: scaleX(0); transition: transform var(--base) var(--ease-out); }
.ltabs button[aria-selected="true"] { color: var(--bank-ink); } .ltabs button[aria-selected="true"]::after { transform: scaleX(1); }
.sect { padding: 20px 22px; animation: enter var(--base) var(--ease-out); }
.fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.fg .full { grid-column: 1 / -1; }
.f label, .f .flab { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; }
.f label .tg { font-size: 10.5px; padding: 0 6px; }
.f input, .f select, .f .fake { width: 100%; height: 40px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); outline: 0; transition: border-color var(--fast), box-shadow var(--fast); display: flex; align-items: center; gap: 8px; text-align: left; }
.f input:focus, .f select:focus, .f .fake:focus-visible { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.f .fake .dn { margin-left: auto; color: var(--text-muted); }
.f .fake i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.f input[type="range"] { height: 28px; padding: 0; border: 0; box-shadow: none; background: none; accent-color: var(--bank-primary); }
.f label b { color: var(--bank-ink); font-variant-numeric: tabular-nums; }
.f.bad input, .f.bad .fake { border-color: var(--danger-text); }
.f .err { color: var(--danger-text); font-size: 12px; margin-top: 4px; }
.fpop { width: 100%; min-width: 240px; max-height: 300px; overflow-y: auto; }
.savebar { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; background: var(--surface-2); border-top: 1px solid var(--border); border-radius: 0 0 18px 18px; }
.toast { position: absolute; z-index: 12; left: 50%; bottom: 18px; transform: translate(-50%, 80px); padding: 10px 16px; border-radius: 14px; display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; color: var(--chrome-strong); background: var(--chrome-bg); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-lg); transition: transform var(--slow) var(--ease-spring); }
.toast.on { transform: translate(-50%, 0); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 6px 2px 46px; font-size: 12.5px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.legend em { margin-left: auto; font-style: normal; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; } }

/* ---- Tickets: shared bits ---- */
.face { width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 650; color: #fff; background: var(--h); box-shadow: 0 0 0 2px var(--surface); }
.face.lg { width: 34px; height: 34px; font-size: 12px; }
.who { display: inline-flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-muted); }
.who b { color: var(--text); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--c) 70%, var(--text)); white-space: nowrap; }
.pr .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.pr .bars i { width: 3px; border-radius: 2px; background: color-mix(in srgb, var(--c) 22%, var(--surface-3)); }
.pr .bars i:nth-child(1) { height: 4px; } .pr .bars i:nth-child(2) { height: 7px; } .pr .bars i:nth-child(3) { height: 10px; } .pr .bars i:nth-child(4) { height: 12px; }
.pr .bars i.on { background: var(--c); }
.chn { display: inline-flex; align-items: center; gap: 5px; color: var(--text-muted); font-size: 12.5px; white-space: nowrap; }
.esc { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; color: var(--danger-text); background: var(--danger-bg); }
.frc { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 600; color: var(--warn-text); background: var(--warn-bg); white-space: nowrap; }
.frc.late { color: var(--danger-text); background: var(--danger-bg); }
.opt[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }
.pop .opt .why { margin-left: auto; font-size: 11px; color: var(--text-muted); }

/* the fuse: how much of the SLA time is used */
.fuse { position: relative; height: 8px; border-radius: 99px; background: var(--surface-3); }
.fuse > i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); min-width: 8px; border-radius: inherit; background: var(--c); transition: width 1s linear, background var(--slow); }
.fuse > i::after { content: ''; position: absolute; right: -3px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 4px color-mix(in srgb, var(--c) 22%, transparent); }
.fuse.hot > i::after { animation: spark .9s ease-in-out infinite; }
@keyframes spark { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--c) 6%, transparent); transform: scale(1.15); } }
.fuse.breach > i { width: 100%; background: repeating-linear-gradient(-45deg, var(--c) 0 6px, color-mix(in srgb, var(--c) 62%, #fff) 6px 12px); background-size: 17px 17px; animation: crawl 1s linear infinite; }
.fuse.breach > i::after, .fuse.paused > i::after, .fuse.done > i::after { display: none; }
@keyframes crawl { to { background-position: 17px 0; } }
.fuse.paused > i { background: repeating-linear-gradient(-45deg, var(--border-strong) 0 4px, var(--surface-3) 4px 8px); }
.fuse.done > i { width: 100%; opacity: .55; }
.fuse-t { display: flex; justify-content: space-between; gap: 8px; margin-top: 7px; font-size: 12.5px; color: var(--text-muted); white-space: nowrap; }
.fuse-t b { color: color-mix(in srgb, var(--c) 72%, var(--text)); font-variant-numeric: tabular-nums; font-weight: 650; }

/* ---- Queue ---- */
.desk { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 14px; margin-bottom: 16px; }
.dialcard { position: relative; padding: 12px 12px 10px; display: flex; flex-direction: column; align-items: center; overflow: hidden;
  background: radial-gradient(80% 60% at 50% 40%, color-mix(in srgb, var(--bank-primary) 7%, transparent), transparent 70%), var(--surface); }
.dialcard svg { width: 236px; height: 236px; overflow: visible; }
.dialcard .cap { font-size: 12px; color: var(--text-muted); text-align: center; }
.dot { cursor: pointer; transition: r var(--fast) var(--ease-spring); }
.dot:hover { r: 9; }
.core { animation: core 1.6s ease-in-out infinite; transform-origin: 118px 118px; }
@keyframes core { 50% { transform: scale(1.06); } }
.hand { stroke: var(--bank-ink); stroke-width: 2; stroke-linecap: round; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tile { position: relative; overflow: hidden; text-align: left; padding: 14px 16px 13px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px;
  animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); transition: transform var(--fast) var(--ease-spring), border-color var(--fast), box-shadow var(--fast); }
.tile:hover { transform: translateY(-2px); border-color: var(--bank-soft-line); }
.tile[aria-pressed="true"] { border-color: var(--bank-ink); box-shadow: 0 0 0 3px var(--bank-soft), var(--shadow); }
.tile .lab { display: flex; align-items: center; gap: 6px; }
.tile .lab i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tile b { font-family: var(--font-display); font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.tile.hot b { color: var(--danger-text); }
.tile small { color: var(--text-muted); font-size: 12px; }
.tile.hot::before { content: ''; position: absolute; inset: auto -20px -30px auto; width: 90px; height: 90px; border-radius: 50%; background: color-mix(in srgb, #d33a3a 16%, transparent); animation: core 2s ease-in-out infinite; }
.mbars { display: flex; align-items: flex-end; gap: 4px; height: 22px; margin-top: 2px; }
.mbars i { flex: 1; border-radius: 3px; background: color-mix(in srgb, var(--bank-primary) 30%, var(--surface-3)); height: var(--h); transform-origin: bottom; animation: rise var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.mbars i.lo { background: color-mix(in srgb, #d33a3a 55%, var(--surface-3)); }
@keyframes rise { from { transform: scaleY(0); } }

.q { overflow: hidden; }
.qhead, .qrow { display: grid; grid-template-columns: 5px minmax(0, 1fr) 168px 112px 230px; gap: 16px; align-items: center; padding-right: 18px; }
.qhead { padding-top: 11px; padding-bottom: 9px; }
.qrow { position: relative; width: 100%; text-align: left; padding-top: 13px; padding-bottom: 13px; border-top: 1px solid var(--border); cursor: pointer; transition: background var(--fast);
  animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.qrow:hover { background: color-mix(in srgb, var(--bank-primary) 3%, var(--surface-2)); }
.qrow.landed { animation: landed 1.6s var(--ease-out); }
@keyframes landed { 0% { background: var(--bank-soft); } 100% { background: transparent; } }
.qrow .stripe { align-self: stretch; border-radius: 0 4px 4px 0; background: var(--c); }
.qrow.breach .stripe { box-shadow: 0 0 12px color-mix(in srgb, var(--c) 70%, transparent); }
.qm { min-width: 0; }
.qm .t { display: flex; align-items: center; gap: 8px; min-width: 0; }
.qm .t span { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qm .id { font-size: 12px; color: var(--text-muted); font-variant-numeric: tabular-nums; flex: none; }
.qm .s { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; margin-top: 4px; font-size: 12.5px; }
.ownc { display: flex; align-items: center; gap: 8px; min-width: 0; font-size: 13px; }
.ownc .face { animation: pop var(--slow) var(--ease-spring); }
.take { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px dashed var(--bank-soft-line); color: var(--bank-ink); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 5px; transition: background var(--fast), transform var(--fast) var(--ease-spring); }
.take:hover { background: var(--bank-soft); transform: translateY(-1px); }
.qfoot { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12.5px; }

/* team board */
.tray { padding: 14px 16px; margin-bottom: 14px; border: 1.5px dashed var(--border-strong); background: var(--surface-2); box-shadow: none; transition: border-color var(--fast), background var(--fast); }
.tray h3 { font-size: 15px; display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.tray .chips { display: flex; flex-wrap: wrap; gap: 10px; min-height: 40px; }
.crew { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.agent { padding: 14px; display: flex; flex-direction: column; gap: 10px; transition: border-color var(--fast), box-shadow var(--fast), transform var(--fast) var(--ease-spring); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.agent.over, .tray.over { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft), var(--shadow); transform: translateY(-2px); }
.agent-h { display: flex; align-items: center; gap: 10px; }
.agent-h div { flex: 1; min-width: 0; } .agent-h b { display: block; } .agent-h small { color: var(--text-muted); font-size: 12px; }
.load { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; }
.load i { height: 6px; border-radius: 3px; background: var(--surface-3); transition: background var(--base); }
.load i.on { background: var(--c); }
.load-t { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: -4px; }
.tchips { display: grid; gap: 8px; min-height: 40px; align-content: start; }
.tchip { display: grid; gap: 6px; padding: 9px 11px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); cursor: grab; touch-action: none; -webkit-user-select: none; user-select: none; text-align: left; transition: transform var(--fast) var(--ease-spring), opacity var(--fast); }
.tray .tchip { width: 230px; }
.tchip:hover { transform: translateY(-1px); }
.tchip.lifted { opacity: .35; }
.tchip .t1 { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; min-width: 0; }
.tchip .t1 span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tchip .t1 .id { font-weight: 500; font-size: 11.5px; color: var(--text-muted); flex: none; }
.tchip .fuse { height: 5px; } .tchip .fuse > i::after { width: 8px; height: 8px; margin-top: -4px; }
.tchip .fuse-t { margin-top: 0; font-size: 11.5px; }
.flychip { position: absolute; z-index: 20; pointer-events: none; width: 230px; transform: rotate(-3deg) scale(1.04); box-shadow: var(--shadow-lg); cursor: grabbing; }

/* ---- Ticket room ---- */
.tkh { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.tkh .tt { flex: 1 1 360px; min-width: 0; }
.tkh h2 { font-size: 26px; line-height: 32px; font-weight: 700; letter-spacing: -0.02em; }
.tkh .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-top: 8px; font-size: 13px; }
.tkh .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.trackc { position: relative; padding: 16px 20px 14px; margin-bottom: 14px; overflow: hidden; }
.trk-top { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 6px 18px; margin-bottom: 14px; }
.timer { font-family: var(--font-display); font-size: 34px; line-height: 36px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; color: color-mix(in srgb, var(--c) 75%, var(--text)); }
.timer-l { color: var(--text-muted); font-size: 13px; padding-bottom: 4px; }
.trk-top .sp { flex: 1; }
.goal { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 12px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); font-size: 12.5px; }
.goal b { font-weight: 600; } .goal .ok { color: var(--ok-text); } .goal .bad { color: var(--danger-text); }
.trk { position: relative; height: 58px; }
.trk-bar { position: absolute; left: 0; right: 0; top: 14px; height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
.trk-fill { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); background: linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, var(--surface-3)), var(--c)); border-radius: 99px; transition: width 1s linear; }
.trk-over { position: absolute; top: 0; bottom: 0; left: var(--l); width: var(--w); background: repeating-linear-gradient(-45deg, #d33a3a 0 5px, #e8726f 5px 10px); }
.trk-pause { position: absolute; top: 0; bottom: 0; left: var(--l); width: var(--w); background: repeating-linear-gradient(-45deg, var(--border-strong) 0 4px, var(--surface) 4px 8px); }
.mk { position: absolute; top: 0; left: var(--x); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
.mk .pin { width: 14px; height: 14px; margin-top: 12px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 3px var(--c); }
.mk.flag .pin { border-radius: 3px; transform: rotate(45deg); }
.mk.now .pin { width: 4px; height: 26px; margin-top: 6px; border-radius: 3px; background: var(--bank-ink); box-shadow: 0 0 0 3px var(--bank-soft); animation: core 1.6s ease-in-out infinite; }
.mk.now { color: var(--bank-ink); font-weight: 600; }
.mk.start { transform: none; align-items: flex-start; } .mk.end { transform: translateX(-100%); align-items: flex-end; }
.mk b { color: var(--text); font-weight: 600; }
.stamp { position: absolute; left: 50%; top: 10px; z-index: 2; padding: 6px 14px; border: 3px solid var(--c); border-radius: 12px; color: var(--c); background: color-mix(in srgb, var(--surface) 85%, transparent); font-family: var(--font-display); font-weight: 750; font-size: 15px; text-transform: uppercase; letter-spacing: .04em; transform: translateX(-50%) rotate(-7deg); animation: stamp .55s var(--ease-spring); }
.stamp small { display: block; font-family: var(--font-sans); font-size: 11px; font-weight: 600; text-transform: none; letter-spacing: 0; }
@keyframes stamp { from { transform: translateX(-50%) rotate(-7deg) scale(2.6); opacity: 0; } }
.tcols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; }
.convo { display: flex; flex-direction: column; overflow: hidden; }
.convo-h { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--border); }
.convo-h h3 { flex: 1; font-size: 16px; }
.thread { display: flex; flex-direction: column; gap: 12px; padding: 18px; height: 440px; overflow-y: auto; background: linear-gradient(180deg, var(--surface-2), var(--surface) 140px); }
.msg { display: flex; align-items: flex-end; gap: 10px; max-width: 80%; animation: msgin var(--slow) var(--ease-spring) backwards; }
@keyframes msgin { from { opacity: 0; transform: translateY(12px) scale(.97); } }
.msg.me, .msg.note { align-self: flex-end; flex-direction: row-reverse; }
.bub { padding: 10px 14px; border-radius: 16px 16px 16px 5px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border), var(--shadow); overflow-wrap: anywhere; }
.msg.me .bub { border-radius: 16px 16px 5px 16px; background: linear-gradient(170deg, color-mix(in srgb, var(--bank-primary) 16%, var(--surface)), var(--bank-soft)); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.msg.note .bub { border-radius: 16px 16px 5px 16px; background: var(--warn-bg); color: var(--warn-text); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--warn-text) 30%, transparent); }
.bub .by { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; font-size: 11.5px; color: var(--text-muted); }
.msg.note .bub .by { color: var(--warn-text); }
.bub .by b { color: var(--text); font-weight: 600; } .msg.note .bub .by b { color: inherit; }
.att { display: inline-flex; align-items: center; gap: 6px; margin-top: 8px; padding: 6px 10px; border-radius: 10px; background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); font-size: 12.5px; font-weight: 500; }
.sysl { align-self: center; display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 999px; background: var(--surface-3); color: var(--text-muted); font-size: 12px; text-align: center; animation: msgin var(--slow) var(--ease-out) backwards; }
.sysl b { color: var(--text); font-weight: 600; }
.composer { border-top: 1px solid var(--border); padding: 12px 14px 14px; display: grid; gap: 10px; transition: background var(--base); }
.composer.note { background: color-mix(in srgb, var(--warn-bg) 55%, var(--surface)); }
.composer textarea { width: 100%; min-height: 76px; resize: vertical; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border-strong); background: var(--surface); outline: 0; font: inherit; color: inherit; transition: border-color var(--fast), box-shadow var(--fast); }
.composer textarea:focus { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.composer.note textarea:focus { border-color: var(--warn-text); box-shadow: 0 0 0 4px var(--warn-bg); }
.crow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.crow .sp { flex: 1; }
.tickbox { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-muted); cursor: pointer; }
.tickbox input { width: 16px; height: 16px; accent-color: var(--bank-primary); }
.side .box h3 { font-size: 14.5px; }
.fieldbtn { width: 100%; display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 550; text-align: left; transition: border-color var(--fast), box-shadow var(--fast); }
.fieldbtn:hover { border-color: var(--bank-soft-line); box-shadow: 0 0 0 3px var(--bank-soft); }
.fieldbtn .dn { margin-left: auto; color: var(--text-muted); }
.fieldbtn i.c { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.slab { display: block; font-size: 12px; color: var(--text-muted); margin: 0 0 5px; }
.sgrid { display: grid; gap: 12px; }
.cust { display: flex; align-items: center; gap: 12px; }
.cust .av { width: 40px; height: 40px; font-size: 13px; }
.cust div { min-width: 0; } .cust b { display: block; }
.minis { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; margin-top: 12px; }
.mini { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 11px; background: var(--surface-2); font-size: 12.5px; text-align: left; width: 100%; }
.mini:hover { background: var(--bank-soft); }
.mini span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lvls { display: grid; gap: 8px; }
.lvl { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--border-strong); text-align: left; width: 100%; transition: border-color var(--fast), background var(--fast); }
.lvl[aria-checked="true"] { border-color: #d33a3a; background: color-mix(in srgb, #d33a3a 8%, var(--surface)); }
.lvl .n { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 700; background: var(--danger-bg); color: var(--danger-text); flex: none; }
.lvl div { flex: 1; } .lvl b { display: block; } .lvl small { color: var(--text-muted); }
.ta { width: 100%; min-height: 84px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); outline: 0; font: inherit; color: inherit; resize: vertical; }
.ta:focus { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.f.bad .ta { border-color: var(--danger-text); }

/* ---- form ---- */
.fcols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 14px; align-items: start; max-width: 1120px; }
.fhead { padding: 20px 22px 6px; } .fhead h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; } .fhead p { margin: 4px 0 0; color: var(--text-muted); }
.sect { padding: 18px 22px 22px; border-top: 1px solid var(--border); }
.sect h3 { font-size: 15px; font-weight: 650; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.sect h3 .n { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; font-size: 11.5px; background: var(--bank-soft); color: var(--bank-ink); }
.sect .fg { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.fake { cursor: pointer; }
.sim { margin-top: 10px; padding: 10px 12px; border-radius: 14px; background: var(--warn-bg); color: var(--warn-text); font-size: 12.5px; animation: enter var(--base) var(--ease-out); }
.sim b { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.sim button { display: flex; width: 100%; gap: 8px; align-items: center; padding: 6px 8px; border-radius: 9px; text-align: left; color: var(--text); background: color-mix(in srgb, var(--surface) 70%, transparent); margin-top: 4px; }
.sim button:hover { background: var(--surface); }
.sim button span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prio-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.pcard { padding: 10px 12px; border-radius: 14px; border: 1px solid var(--border-strong); text-align: left; display: grid; gap: 4px; transition: border-color var(--fast), background var(--fast), transform var(--fast) var(--ease-spring); }
.pcard:hover { transform: translateY(-2px); }
.pcard[aria-checked="true"] { border-color: var(--c); background: color-mix(in srgb, var(--c) 10%, var(--surface)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); }
.pcard small { font-size: 11.5px; color: var(--text-muted); }

/* Time is counted in minutes from Wednesday 18 November 2026, 00:00. The page starts at 11:40 and the clock runs for real. */

function track(t) {
  const now = NOW(), due = dueOf(t), frd = frDueOf(t), end0 = t.done != null ? t.done : t.pausedAt != null ? t.pausedAt : now;
  const a = t.at, b = Math.max(due, end0) + (Math.max(due, end0) - a) * 0.06;
  const X = (m) => Math.max(0, Math.min(100, ((m - a) / (b - a)) * 100));
  const s = stateOf(t), c = colOf(t);
  let h = `<div class="trk" style="--c:${c}"><div class="trk-bar"><div class="trk-fill" style="--w:${X(Math.min(end0, due))}%"></div>`;
  if (end0 > due) h += `<div class="trk-over" style="--l:${X(due)}%;--w:${X(end0) - X(due)}%"></div>`;
  if (t.pausedAt != null) h += `<div class="trk-pause" style="--l:${X(t.pausedAt)}%;--w:${100 - X(t.pausedAt)}%"></div>`;
  h += `</div><div class="mk start" style="--x:0%;--c:var(--text-muted)"><i class="pin"></i><small>Created <b>${whenS(a)}</b></small></div>`;
  const frx = X(t.fr != null ? t.fr : frd);
  if (frx > 10 && frx < 88) h += `<div class="mk mid" style="--x:${frx}%;--c:${t.fr != null && t.fr <= frd ? '#1f9d63' : '#d9a21a'}"><i class="pin"></i><small>First reply ${t.fr != null ? '<b>' + whenS(t.fr) + '</b>' : 'due ' + whenS(frd)}</small></div>`;
  if (s !== 'done' && s !== 'paused' && X(now) < 92 && X(now) > 6 && Math.abs(X(now) - frx) > 7) h += `<div class="mk now mid" style="--x:${X(now)}%"><i class="pin"></i><small>now</small></div>`;
  h += `<div class="mk flag ${X(due) > 88 ? 'end' : ''}" style="--x:${X(due)}%;--c:${c}"><i class="pin"></i><small>Resolve by <b>${whenS(due)}</b></small></div></div>`;
  return h;
}

/* ---------- actions ---------- */
function sys(t, text) { threadOf(t).push({ k: 'sys', at: NOW(), text }); }

document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; drag.on = true; drag.chip.classList.add('lifted'); document.body.classList.add('dragging'); drag.fly = drag.chip.cloneNode(true); drag.fly.classList.add('flychip'); drag.fly.classList.remove('lifted'); app.appendChild(drag.fly); }
  const a = app.getBoundingClientRect(); drag.fly.style.left = e.clientX - a.left - 110 + 'px'; drag.fly.style.top = e.clientY - a.top - 24 + 'px';
  const hit = document.elementFromPoint(e.clientX, e.clientY), zone = hit && hit.closest('[data-drop]');
  document.querySelectorAll('[data-drop]').forEach((z) => z.classList.toggle('over', z === zone));
  drag.zone = zone;
});
document.addEventListener('pointerup', () => {
  if (!drag) return; const d = drag; drag = null;
  if (!d.on) { suppress = true; setTimeout(() => (suppress = false), 0); return openTicket(d.id); }
  suppress = true; setTimeout(() => (suppress = false), 0);
  d.fly.remove(); document.body.classList.remove('dragging');
  const t = TBT(d.id);
  if (d.zone) { const u = d.zone.dataset.drop || null; if (u !== (t.own || null)) { t.own = u; sys(t, u ? `Assigned to <b>${USERS[u][0]}</b>` : 'Unassigned'); toast(u ? `${t.id} assigned to ${USERS[u][0]}` + (T.filter((x) => isOpen(x) && x.own === u).length > CAP ? ' · over capacity' : '') : `${t.id} is back in Unassigned`); } }
  render();
});
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (pop) { pop = null; render(); } else if (dlg) { dlg = null; overlay(); } });
$('screens').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.s === 'form') { newForm(); } if (b.dataset.s === 'ticket') { C = { mode: 'reply', text: '', wait: false }; } show(b.dataset.s); });

/* the clocks tick: every second the fuses and the ticket timer update in place */
let tick = 0;
setInterval(() => {
  tick++;
  if (drag) return;
  document.querySelectorAll('[data-fz]').forEach((el) => { const t = TBT(el.dataset.fz); if (t) el.outerHTML = fuseHTML(t); });
  if (screen === 'ticket') { const t = TBT(cur); if ($('timer')) $('timer').innerHTML = timerHTML(t); if (tick % 10 === 0 && $('trk')) $('trk').innerHTML = track(t); }
  if (screen === 'queue' && tick % 20 === 0 && $('dial') && !pop) $('dial').outerHTML = dial();
}, 1000);

const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
$('themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; });
const BANKS = [['H', '#1d3a6e', '#1d3a6e', '#9db8ee'], ['M', '#9b1c3a', '#8a1933', '#f2a3b5'], ['C', '#0f6b52', '#0d5c47', '#7fd6b9']];
$('banks').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const [letter, primary, inkL, inkD] = BANKS[+b.dataset.bank], r = document.documentElement.style;
  r.setProperty('--bank-primary', primary); r.setProperty('--bank-ink-light', inkL); r.setProperty('--bank-ink-dark', inkD);
  USERS.PN[1] = primary; LOGO = letter; $('logo').textContent = letter; render();
  $('banks').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
});
rail();
render();
</script>
