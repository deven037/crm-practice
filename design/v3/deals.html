<meta name="claude:viewport-fit-sides" content="cover">
<title>Harbor Deals 3.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: Deals is a pipeline. Chevron stage gates over a board you drag on, with Won and Lost bins; a forecast runway that plots every open deal by close date and win chance; a deal room with a clickable stage path; a full page form that shows where the deal lands on the runway. Tokens mirror src/styles/v3.css. */
:root {
  --bank-primary: #1d3a6e; --bank-on: #ffffff; --bank-ink-light: #1d3a6e; --bank-ink-dark: #9db8ee;
  --bank-ink: var(--bank-ink-light);
  --bg: color-mix(in srgb, var(--bank-primary) 4%, #f5f6f8);

  --surface-3: color-mix(in srgb, var(--bank-primary) 7%, #e8eaee);
  --border: color-mix(in srgb, var(--bank-primary) 8%, #e2e5ea);
  --border-strong: color-mix(in srgb, var(--bank-primary) 10%, #cfd4dc);
  --text: #171b26; --text-muted: #5a6272;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 10%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 26%, var(--surface));
  --chrome-bg: color-mix(in srgb, var(--bank-primary) 26%, #0a0d15);
  --chrome-hover: color-mix(in srgb, var(--bank-primary) 34%, #151a26);
  --chrome-line: color-mix(in srgb, var(--bank-primary) 30%, #1c2331);
  --chrome-active: color-mix(in srgb, var(--bank-primary) 55%, #1a2030);
  --chrome-text: #cfd5e3; --chrome-muted: #98a1b6; --chrome-strong: #ffffff;
  --glass: color-mix(in srgb, var(--surface) 72%, transparent);
  --glass-line: color-mix(in srgb, var(--text) 9%, transparent);
  --scrim: color-mix(in srgb, var(--bank-primary) 18%, rgba(9, 12, 20, 0.5));
  --warn-bg: #fdf0d5; --warn-text: #8a5300; --danger-bg: #fde7e7; --danger-text: #a12626; --ok-bg: #dcf5ea; --ok-text: #0c6b47;
  --shadow: 0 1px 2px rgba(16, 22, 38, 0.05), 0 4px 12px -2px rgba(16, 22, 38, 0.07);
  --shadow-lg: 0 4px 8px rgba(16, 22, 38, 0.05), 0 24px 48px -12px rgba(16, 22, 38, 0.24);
  --shadow-dock: 0 18px 40px -16px color-mix(in srgb, var(--bank-primary) 70%, rgba(0, 0, 0, 0.6));

  --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Segoe UI', sans-serif;

}

  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
  padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}

:focus-visible { outline: 2px solid var(--bank-ink); outline-offset: 2px; border-radius: 6px; }

.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 1280px; margin: 0 auto 14px; }

.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

.stage { container-type: inline-size; max-width: 1280px; margin: 0 auto; }

  background: radial-gradient(60% 50% at 100% 0%, color-mix(in srgb, var(--bank-primary) 13%, transparent), transparent 70%), radial-gradient(50% 50% at 0% 100%, color-mix(in srgb, var(--bank-primary) 8%, transparent), transparent 70%), var(--bg); }
.rail { width: 60px; margin: 10px 0 10px 10px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; color: var(--chrome-muted); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-dock);
  background: radial-gradient(130% 42% at 0% 0%, color-mix(in srgb, var(--bank-primary) 62%, transparent), transparent 72%), var(--chrome-bg); }
.rail .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; background: var(--bank-primary); color: var(--bank-on); font-family: var(--font-display); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.rail span { width: 40px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.rail span.on { color: var(--chrome-strong); background: var(--chrome-active); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.main { position: relative; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.tb { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 10px 8px 16px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.crumb { display: flex; gap: 7px; color: var(--text-muted); font-size: 13px; white-space: nowrap; min-width: 0; overflow: hidden; }

.chip-me { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 5px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; background: var(--bank-primary); color: var(--bank-on); }
.av.sm { width: 24px; height: 24px; font-size: 9.5px; }
.av.soft { background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }

@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }

/* shared pieces */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 12px; font-weight: 550; white-space: nowrap; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  transition: transform var(--fast) var(--ease-spring), border-color var(--fast), filter var(--fast), background var(--fast), color var(--fast); }
.btn:hover { transform: translateY(-1px); border-color: var(--bank-soft-line); }
.btn:active { transform: scale(.97); }
.btn.pri { color: var(--bank-on); border-color: transparent; background: linear-gradient(180deg, color-mix(in srgb, var(--bank-primary) 90%, #fff), var(--bank-primary)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), var(--shadow-bank); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--text-muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger-text); }
.btn.sq { width: 38px; padding: 0; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 62%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.ph h2 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em; }
.ph p { margin: 2px 0 0; color: var(--text-muted); }
.ph .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }
.link { color: var(--bank-ink); font-weight: 550; } .link:hover { text-decoration: underline; }
.tg { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); }
.tg.add { border: 1px dashed var(--border-strong); background: none; box-shadow: none; }
.tg.add:hover { color: var(--bank-ink); border-color: var(--bank-soft-line); background: var(--bank-soft); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; flex: 1 1 220px; max-width: 320px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted); transition: box-shadow var(--fast), border-color var(--fast); }
.search:focus-within { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; border: 1px dashed var(--border-strong); color: var(--text-muted); font-weight: 500; white-space: nowrap; transition: background var(--fast), border-color var(--fast), color var(--fast); }
.fchip:hover { background: var(--surface); color: var(--text); }
.fchip.set { border-style: solid; border-color: var(--bank-soft-line); background: var(--bank-soft); color: var(--bank-ink); }
.pop-wrap { position: relative; }
.pop { position: absolute; z-index: 9; top: 44px; left: 0; width: 250px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); transform-origin: top left; animation: pop var(--base) var(--ease-spring); }
.pop.right { left: auto; right: 0; transform-origin: top right; }
.pop input { width: 100%; height: 34px; padding: 0 10px; margin-bottom: 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); outline: 0; }
.pop input:focus { border-color: var(--bank-ink); }
.pop .opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; font-weight: 500; }
.pop .opt:hover { background: var(--bank-soft); }
.pop .opt i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pop .opt .tick { margin-left: auto; color: var(--bank-ink); opacity: 0; }
.pop .opt[aria-checked="true"] .tick { opacity: 1; }
.pop .opt small { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.pop .none { padding: 10px; color: var(--text-muted); font-size: 12.5px; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-muted); }
.empty b { display: block; font-family: var(--font-display); font-size: 17px; color: var(--text); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
.back:hover { color: var(--bank-ink); }
.box { padding: 18px 20px; }
.box h3 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.box-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .box-h h3 { margin: 0; flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.kv { display: grid; gap: 10px; margin: 0; }
.kv div { display: flex; gap: 10px; align-items: center; }
.kv dt { width: 96px; flex: none; font-size: 12.5px; color: var(--text-muted); } .kv dd { margin: 0; min-width: 0; flex: 1; overflow-wrap: anywhere; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); } .qrow:last-child { border-bottom: 0; padding-bottom: 0; } .qrow:first-child { padding-top: 0; }
.qrow b { margin-left: auto; font-variant-numeric: tabular-nums; }
.mate { display: flex; align-items: center; gap: 10px; padding: 6px; margin: 0 -6px; border-radius: 12px; text-align: left; min-width: 0; width: calc(100% + 12px); transition: background var(--fast); }
.mate:hover { background: var(--bank-soft); }
.mate div { min-width: 0; } .mate b, .mate small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mate b { font-weight: 550; } .mate small { color: var(--text-muted); font-size: 12.5px; }
.face { --h: var(--bank-primary); width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 650; font-size: 11.5px;
  background: color-mix(in srgb, var(--h) 20%, var(--surface)); color: color-mix(in srgb, var(--h) 66%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h) 30%, transparent); }
.crest { --h: var(--bank-primary); position: relative; width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px 11px 4px 4px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .02em;
  background: linear-gradient(160deg, color-mix(in srgb, var(--h) 34%, var(--surface)), color-mix(in srgb, var(--h) 14%, var(--surface))); color: color-mix(in srgb, var(--h) 68%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h) 32%, transparent), inset 0 -4px 0 color-mix(in srgb, var(--h) 40%, transparent); }
.crest.sm { width: 22px; height: 22px; font-size: 9px; border-radius: 7px 7px 3px 3px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h) 32%, transparent), inset 0 -2px 0 color-mix(in srgb, var(--h) 40%, transparent); }

/* dialogs, sheet, form basics (shared with Contacts and Accounts) */
.scrim { position: absolute; inset: 0; z-index: 10; background: var(--scrim); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 14px; animation: fade var(--base); }
.dlg { width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 22px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); animation: pop var(--slow) var(--ease-spring); overflow: hidden; }
.dlg-head { padding: 18px 22px 0; display: flex; align-items: center; gap: 10px; }
.dlg-head h3 { font-size: 19px; font-weight: 650; flex: 1; overflow-wrap: anywhere; }
.dlg-body { padding: 14px 22px 18px; overflow-y: auto; color: var(--text-muted); }
.dlg-foot { display: flex; gap: 8px; padding: 14px 22px; background: var(--surface-2); border-top: 1px solid var(--border); }
.dlg-foot .sp { flex: 1; }
.scrim.edge { place-items: stretch end; padding: 10px; }
.sheet { width: min(400px, 100%); display: flex; flex-direction: column; border-radius: 20px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); overflow: hidden; animation: slide var(--slow) var(--ease-out); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 22px 20px; display: grid; gap: 14px; align-content: start; }
.pick-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 14px; text-align: left; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); transition: transform var(--fast) var(--ease-spring), border-color var(--fast), background var(--fast), box-shadow var(--fast); }
.pick-item:hover { transform: translateX(-3px); border-color: var(--bank-ink); background: var(--bank-soft); box-shadow: 0 0 0 3px var(--bank-soft); color: var(--bank-ink); }
.pick-item .ext { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.pick-item div { flex: 1; min-width: 0; } .pick-item b { display: block; font-weight: 600; color: var(--text); } .pick-item small { font-size: 12.5px; }
.ltabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; }
.ltabs button { position: relative; padding: 10px 12px 12px; font-weight: 550; color: var(--text-muted); white-space: nowrap; transition: color var(--fast); }
.ltabs button:hover { color: var(--text); }
.ltabs button::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--bank-primary); transform: scaleX(0); transition: transform var(--base) var(--ease-out); }
.ltabs button[aria-selected="true"] { color: var(--bank-ink); } .ltabs button[aria-selected="true"]::after { transform: scaleX(1); }
.sect { padding: 20px 22px; animation: enter var(--base) var(--ease-out); }
.fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.fg .full { grid-column: 1 / -1; }
.f label, .f .flab { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; }

/* ---- Deals: summary line ---- */

/* ---- pipeline board: chevron gates, drag lanes, outcome bins ---- */
.board { --n: 3; display: grid; grid-template-columns: repeat(var(--n), minmax(220px, 1fr)) minmax(200px, .9fr); gap: 14px 10px; align-items: start; overflow-x: auto; padding: 2px 2px 10px; }

.drop { min-height: 150px; padding: 6px; margin: -6px; border-radius: 16px; display: grid; gap: 9px; align-content: start; grid-template-columns: minmax(0, 1fr); border: 1.5px dashed transparent; transition: background var(--fast), border-color var(--fast); }

/* ---- forecast runway ---- */

  background: radial-gradient(circle at 34% 30%, color-mix(in srgb, var(--c) 55%, #fff), var(--c) 70%); box-shadow: 0 0 0 2px var(--surface), 0 10px 22px -10px var(--c); opacity: .92;
  animation: bub var(--slow) var(--ease-spring) backwards; animation-delay: var(--d); transition: transform var(--base) var(--ease-spring), opacity var(--fast); }

.tip { position: absolute; z-index: 6; width: 236px; transform: translate(-50%, -100%); padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); display: grid; gap: 3px; pointer-events: none; animation: fade var(--fast); }

.fbar i { position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); border-radius: 4px; background: var(--bank-soft-line); transform-origin: left; animation: grow var(--slow) var(--ease-out) backwards; animation-delay: calc(var(--d) + 100ms); }
.fbar i + i { background: var(--bank-primary); }

/* ---- list ---- */
.lst { overflow: hidden; }
.lr { display: grid; grid-template-columns: minmax(200px, 1.8fr) 130px 100px 92px minmax(130px, 1fr) 44px; align-items: center; gap: 12px; padding: 0 16px; min-height: 58px; border-bottom: 1px solid var(--border); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }

.lr.row { cursor: pointer; transition: background var(--fast); } .lr.row:hover { background: color-mix(in srgb, var(--bank-primary) 4%, var(--surface)); }
.lr .r { text-align: right; } .lr .pr { margin: 0; }
.nm { display: flex; align-items: center; gap: 10px; min-width: 0; } .nm div { min-width: 0; }
.nm b, .nm small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .nm b { font-weight: 600; } .nm small { color: var(--text-muted); font-size: 12.5px; }

/* ---- deal room ---- */
.hero { --h: var(--bank-primary); position: relative; overflow: hidden; padding: 22px; margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 18px; }
.hero::before { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(115deg, color-mix(in srgb, var(--h) 9%, transparent) 0 1px, transparent 1px 22px), radial-gradient(70% 140% at 100% 0%, color-mix(in srgb, var(--h) 22%, transparent), transparent 70%); -webkit-mask-image: linear-gradient(90deg, transparent, #000 65%); mask-image: linear-gradient(90deg, transparent, #000 65%); }
.hero > * { position: relative; }
.hid { flex: 1 1 280px; min-width: 0; }
.hid h2 { font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; overflow-wrap: anywhere; margin-bottom: 8px; }
.hid p { margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; color: var(--text-muted); }
.hero .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.pathc { padding: 14px 16px; margin-bottom: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; }
.path { flex: 1 1 420px; display: flex; gap: 4px; overflow-x: auto; min-width: 0; padding-bottom: 2px; }
.step { flex: 1 0 136px; height: 46px; padding: 0 22px 0 28px; display: flex; align-items: center; justify-content: center; gap: 6px; font-weight: 600; font-size: 13px; white-space: nowrap; color: var(--text-muted); background: var(--surface-3);
  clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); transition: background var(--base), color var(--base), filter var(--fast); }
.step.first { padding-left: 16px; border-radius: 12px 0 0 12px; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }
.step:hover { filter: brightness(.94); color: var(--text); }
.step.done { background: color-mix(in srgb, var(--c) 26%, var(--surface)); color: color-mix(in srgb, var(--c) 70%, var(--text)); }
.step.now { background: color-mix(in srgb, var(--c) 84%, #000); color: #fff; }
.step.done, .step.now { animation: fill var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
@keyframes fill { from { background: var(--surface-3); color: var(--text-muted); } }
.closers { display: flex; flex-wrap: wrap; gap: 8px; }
.btn.won { color: var(--ok-text); } .btn.won:hover { background: var(--ok-bg); border-color: transparent; }
.btn.lostb:hover { background: var(--danger-bg); color: var(--danger-text); border-color: transparent; }

.outc.won { background: var(--ok-bg); color: var(--ok-text); } .outc.lost { background: var(--surface-2); color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); }
.outc .btn { height: 32px; margin-left: auto; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 14px; }
.fig { padding: 16px 20px; border-right: 1px solid var(--border); min-width: 0; } .fig:last-child { border-right: 0; }
.fig b { display: block; font-family: var(--font-display); font-size: 26px; line-height: 1.15; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.fig small { display: block; color: var(--text-muted); font-size: 12.5px; }
.fig.pg { display: flex; align-items: center; gap: 12px; }
.nxt { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 13px; background: var(--bank-soft); box-shadow: inset 0 0 0 1px var(--bank-soft-line); margin: 0 0 12px; font-weight: 550; }
.nxt svg { color: var(--bank-ink); margin-top: 2px; }
.box .acts { display: flex; flex-wrap: wrap; gap: 8px; }
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { position: relative; padding: 0 0 16px 26px; animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.tl li::before { content: ''; position: absolute; left: 5px; top: 18px; bottom: 0; width: 2px; background: var(--border); }
.tl li:last-child { padding-bottom: 0; } .tl li:last-child::before { display: none; }
.tl li > i { position: absolute; left: 0; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, var(--surface)); }
.tl b { display: block; font-weight: 550; overflow-wrap: anywhere; } .tl small { color: var(--text-muted); font-size: 12.5px; }
/* History sits beside Quotes + Details and takes exactly their height; new events scroll inside it */
.dgrid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.nxc { grid-column: 1; grid-row: 1; } .acc-c { grid-column: 2; grid-row: 1; } .quo { grid-column: 2; grid-row: 2; } .det { grid-column: 2; grid-row: 3; }

.accb { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; } .accb div { min-width: 0; flex: 1; } .accb b { display: block; font-weight: 600; overflow-wrap: anywhere; }
.accb .crest { width: 44px; height: 44px; font-size: 15px; }
.blocked { display: flex; gap: 10px; padding: 10px 12px; border-radius: 12px; background: var(--warn-bg); color: var(--warn-text); font-size: 13px; margin-top: 10px; }
.reasons { display: grid; gap: 4px; max-height: 230px; overflow-y: auto; margin-top: 8px; }
.rsn { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 11px; border-radius: 11px; text-align: left; font-weight: 500; color: var(--text); border: 1px solid var(--border); transition: background var(--fast), border-color var(--fast); }

.rsn .tick { margin-left: auto; color: var(--bank-ink); opacity: 0; } .rsn[aria-checked="true"] .tick { opacity: 1; }

@keyframes cf { from { transform: translate(-50%, -50%); } 75% { opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)); opacity: 0; } }

/* ---- full page form with a live runway ---- */
.fcols { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 14px; align-items: start; max-width: 1060px; }
.fhead { padding: 20px 22px 14px; } .fhead h2 { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; } .fhead p { margin: 4px 0 0; color: var(--text-muted); }
.prev { position: sticky; top: 74px; padding: 16px; }

/* ---------- runway ---------- */

}

/* ---------- stage changes ---------- */
function burst(at) {
  if (reduced() || !at) return;
  let x = at.x, y = at.y;
  if (at.getBoundingClientRect) { const r = at.getBoundingClientRect(); x = r.left + r.width / 2; y = r.top + r.height / 2; }
  const cols = ['#17936a', '#c98a12', '#2f6fe0', '#6d4fd6', '#d1478d', getComputedStyle(document.documentElement).getPropertyValue('--bank-primary').trim()];
  for (let i = 0; i < 28; i++) {
    const p = document.createElement('i'), ang = Math.random() * Math.PI * 2, dist = 60 + Math.random() * 100;
    p.className = 'cf';
    p.style.cssText = `left:${x}px;top:${y}px;--dx:${Math.cos(ang) * dist}px;--dy:${Math.sin(ang) * dist + 50}px;--r:${Math.random() * 720 - 360}deg;background:${cols[i % cols.length]};animation-delay:${Math.random() * 90}ms`;
    document.body.appendChild(p); setTimeout(() => p.remove(), 1300);
  }
}

}
// Probability follows the stage default unless someone set it by hand.
const probTouchedFor = (d) => OPEN.every((s) => s.p !== d.prob);
function confirmLost() {
  const d = byId(lost.id); if (!lost.reason) return;

  d.stage = 'Closed Lost'; d.prob = 0; d.close = 0; d.reason = lost.reason;

function overlay() {
  const o = $('overlay'), d = byId(cur);
  if (lost) {
    const ld = byId(lost.id);
    o.innerHTML = `<div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="Mark deal as lost"><div class="dlg-head"><h3>Mark ${esc(ld.name)} as lost?</h3></div><div class="dlg-body">
      Pick the reason.
      <label class="search" style="margin-top:12px">${ic('search', 16)}<input id="lostQ" placeholder="Find a reason" aria-label="Find a reason" value="${esc(lost.q)}"></label>
      <div class="reasons" id="reasons" role="radiogroup" aria-label="Reason">${reasonsHtml()}</div>
      <div class="f" style="margin-top:14px;color:var(--text)"><label for="lostNote">Note <span class="muted">(optional)</span></label><input id="lostNote" autocomplete="off" placeholder="What happened?"></div>
    </div><div class="dlg-foot"><span class="sp"></span><button class="btn" data-close>Keep it open</button><button class="btn danger" id="lostYes" ${lost.reason ? '' : 'disabled'}>${ic('xc', 16)}Mark as lost</button></div></div></div>`;
    $('lostQ').focus();
    return;
  }
  if (del) {
    o.innerHTML = `<div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="Delete deal"><div class="dlg-head"><h3>Delete ${esc(d.name)}?</h3></div><div class="dlg-body">
      This can’t be undone. The deal and its history go.${d.quotes.length ? ` Its ${plural(d.quotes.length, 'quote')} ${d.quotes.length === 1 ? 'stays' : 'stay'}, without a link to a deal.` : ''}
      ${stOf(d.stage).won ? `<div class="blocked">${ic('alert', 16)}<span>This deal is won. Deleting it lowers your won totals and reports.</span></div>` : ''}
    </div><div class="dlg-foot"><span class="sp"></span><button class="btn" data-close>Keep deal</button><button class="btn danger" id="delYes">${ic('trash')}Delete deal</button></div></div></div>`;
    return;
  }
  if (!sheet) { o.innerHTML = ''; return; }
  o.innerHTML = `<div class="scrim edge" id="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="Choose a layout">
    <div class="dlg-head" style="padding-bottom:6px"><h3>Choose a layout</h3><button type="button" class="btn ghost sq" data-close aria-label="Close">${ic('x')}</button></div>
    <div class="sheet-body"><p class="muted" style="margin:0">Pick the layout to use for this new deal.</p>
      ${LAYOUTS.map((l, k) => `<button class="pick-item" data-layout="${k}" style="--d:${k * 60}ms"><span class="ext">${ic('rows', 17)}</span><div><b>${l.name}</b><small>${l.tabs.length} tabs${l.def ? ' · Default' : ''}</small></div>${ic('right', 16)}</button>`).join('')}
      <p class="muted" style="margin:8px 0 0">Or use an AutoFlow process, a guided flow with several steps instead of one form.</p>
      <button class="pick-item" data-autoflow style="--d:150ms"><span class="ext">${ic('swap', 17)}</span><div><b>Credit application</b><small>6 steps · AutoFlow</small></div>${ic('right', 16)}</button>
    </div></div></div>`;
  o.querySelector('.pick-item').focus();
}
function closeOver() { const wasPick = sheet && screen === 'pipe'; sheet = null; del = false; lost = null; if (wasPick) render(); else overlay(); }

/* ---------- full page form ---------- */
function accLabel() { const a = fAcc == null ? NOACC : ACC[fAcc]; return `${crest(a, 'sm')}<span>${esc(a.name)}</span><span class="dn">${ic('down', 14)}</span>`; }
function stageLabel() { return `<i style="--c:${stOf(fStage).c}"></i><span>${fStage}</span><span class="dn">${ic('down', 14)}</span>`; }
function formView() {
  const e = formMode === 'edit' ? byId(cur) : null, v = (k) => (e ? esc(e[k]) : '');
  fAcc = e ? e.acc : null; fStage = e ? e.stage : OPEN[0].n; probTouched = !!e; fp = null;
  const extra = (t) => (t === 'Facility' ? ['Facility type', 'Tenor (months)', 'Interest rate (%)'] : t === 'Security' ? ['Collateral', 'Collateral value ($)', 'Guarantor'] : ['Lead source', 'Competing bank', 'Region']);
  page.innerHTML = `
  <button class="back" data-cancel>${ic('left', 16)}${e ? esc(e.name) : 'Deals'}</button>
  <div class="fcols">
    <form class="card" id="dform" novalidate aria-label="${e ? 'Edit deal' : 'New deal'}">
      <div class="fhead"><h2>${e ? 'Edit deal' : 'New deal'}</h2><p>Layout: <b style="color:var(--text)">${e ? e.layout : layout.name}</b>${e ? '' : ` <button type="button" class="tg add" data-relayout>Change</button>`}</p></div>
      <div class="ltabs" role="tablist" aria-label="Form sections">${layout.tabs.map((t, k) => `<button type="button" role="tab" aria-selected="${k === 0}" data-ltab="${k}">${t}</button>`).join('')}</div>
      <div class="sect" data-tab="0"><div class="fg">
        <div class="f full" id="f-name"><label for="in-name">Deal name *</label><input id="in-name" value="${v('name')}" autocomplete="off" placeholder="For example: Working capital renewal"></div>
        <div class="f"><span class="flab" id="l-acc">Account</span><span class="pop-wrap" style="display:block"><button type="button" class="fake" id="in-acc" aria-labelledby="l-acc in-acc" aria-haspopup="listbox" data-fpop="acc">${accLabel()}</button><span class="fslot" id="slot-acc"></span></span></div>
        <div class="f" id="f-amt"><label for="in-amt">Amount ($) *</label><input id="in-amt" type="number" inputmode="numeric" min="0" value="${e ? e.amt : ''}" placeholder="0"></div>
        <div class="f"><span class="flab" id="l-stage">Stage</span><span class="pop-wrap" style="display:block"><button type="button" class="fake" id="in-stage" aria-labelledby="l-stage in-stage" aria-haspopup="listbox" data-fpop="stage">${stageLabel()}</button><span class="fslot" id="slot-stage"></span></span></div>
        <div class="f" id="f-close"><label for="in-close">Expected close date *</label><input id="in-close" type="date" value="${isoOf(e ? e.close : 30)}"></div>
        <div class="f full"><label for="in-prob">Chance to win <b id="probV">${e ? e.prob : OPEN[0].p}%</b><span class="muted" id="probHint" style="font-weight:400">${e ? '' : 'follows the stage until you change it'}</span></label><input id="in-prob" type="range" min="0" max="100" step="5" value="${e ? e.prob : OPEN[0].p}"></div>
        <div class="f"><label for="in-owner">Owner</label><select id="in-owner">${OWNERS.map((t) => `<option ${(e ? e.owner : 'Priya Nair') === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="f"><label for="in-camp">Campaign</label><select id="in-camp"><option>None</option>${CAMPS.map((t) => `<option ${e && e.camp === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div class="f full"><label for="in-next">Next step</label><input id="in-next" value="${v('next')}" autocomplete="off" placeholder="What happens next, and who does it?"></div>
      </div></div>
      ${layout.tabs.slice(1).map((t, k) => `<div class="sect" data-tab="${k + 1}" hidden><div class="fg">${extra(t).map((lab, i) => `<div class="f"><label for="cf-${k}-${i}">${lab}</label><input id="cf-${k}-${i}" autocomplete="off"></div>`).join('')}</div></div>`).join('')}
      <div class="savebar"><button type="button" class="btn" data-cancel>Cancel</button><button class="btn pri">${e ? 'Save changes' : 'Create deal'}</button></div>
    </form>
    <aside class="card prev" aria-label="Preview"><span class="lab">On the forecast runway</span>
      <div class="mrun"><div class="past"></div><div class="nowl"><span>Today</span></div><i class="bub" id="pvb"></i><span class="ax">→ close date</span></div>
      <div class="pvs"><div><span>Weighted value</span><b id="pvW"></b></div><div><span>Counts toward</span><b id="pvM"></b></div></div>
      <p class="muted" id="pvNote"></p>
    </aside>
  </div>`;
  preview();
}
function preview() {
  const amt = Math.max(0, +$('in-amt').value || 0), p = +$('in-prob').value, cv = $('in-close').value, off = cv ? offOf(cv) : 30, st = stOf(fStage);
  const mxA = Math.max(amt, ...D.filter(isOpen).map((d) => d.amt)), s = Math.round(14 + 34 * Math.sqrt(amt / (mxA || 1)));
  const b = $('pvb');
  b.style.cssText = `--c:${st.c};--s:${s}px;left:${((Math.max(X0, Math.min(X1, off)) - X0) / (X1 - X0)) * 100}%;top:${10 + (1 - p / 100) * 80}%`;
  $('probV').textContent = p + '%';
  $('pvW').textContent = short((amt * p) / 100);
  $('pvM').textContent = !isOpen({ stage: fStage }) ? 'Not forecast' : off < 0 ? 'Past close date' : monthName(monthKey(off), true);
  const peers = D.filter((d) => d.stage === fStage && !(formMode === 'edit' && d.id === cur)).length;
  $('pvNote').textContent = isOpen({ stage: fStage }) ? `Joins ${plural(peers, 'other open deal')} in ${fStage}.` : `${fStage} deals sit in the ${st.won ? 'Won' : 'Lost'} bin, outside the forecast.`;
}
function setTab(k) { page.querySelectorAll('[data-tab]').forEach((x) => (x.hidden = +x.dataset.tab !== k)); page.querySelectorAll('[data-ltab]').forEach((x) => x.setAttribute('aria-selected', +x.dataset.ltab === k)); }
function fpList(kind, s = '') {
  s = s.toLowerCase();
  if (kind === 'acc') {
    const list = [{ v: '', a: NOACC }].concat(ACC.map((a, i) => ({ v: String(i), a }))).filter((o) => o.a.name.toLowerCase().includes(s));
    return list.map((o) => `<button type="button" class="opt" role="menuitemradio" aria-checked="${String(fAcc == null ? '' : fAcc) === o.v}" data-fk="acc" data-fv="${o.v}">${crest(o.a, 'sm')}${esc(o.a.name)}<span class="tick">${ic('check', 15)}</span></button>`).join('') || '<div class="none">No account matches.</div>';
  }
  const list = STAGES.filter((x) => x.n.toLowerCase().includes(s));
  return list.map((x) => `<button type="button" class="opt" role="menuitemradio" aria-checked="${fStage === x.n}" data-fk="stage" data-fv="${x.n}"><i style="--c:${x.c}"></i>${x.n}<small>${x.p}%</small><span class="tick" style="margin-left:8px">${ic('check', 15)}</span></button>`).join('') || '<div class="none">No stage matches.</div>';
}
function openFpop(kind) {
  closeFpop(); fp = kind;
  $('slot-' + kind).innerHTML = `<div class="pop fpop" id="fpop"><input id="fpQ" placeholder="${kind === 'acc' ? 'Find an account' : 'Find a stage'}" aria-label="${kind === 'acc' ? 'Find an account' : 'Find a stage'}" autocomplete="off"><div id="fpList">${fpList(kind)}</div></div>`;
  $('fpQ').focus();
}
function closeFpop() { fp = null; document.querySelectorAll('.fslot').forEach((s) => (s.innerHTML = '')); }
function setFv(k, v) {
  if (k === 'acc') { fAcc = v === '' ? null : +v; $('in-acc').innerHTML = accLabel(); }
  else {
    fStage = v; $('in-stage').innerHTML = stageLabel();
    if (!probTouched) { $('in-prob').value = stOf(v).p; }
  }
  closeFpop(); $('in-' + k).focus(); preview();
}

/* ---------- drag on the board ---------- */
let drag = null, suppress = false;
app.addEventListener('pointerdown', (e) => {
  const el = e.target.closest('.board .dc');
  if (!el || e.button !== 0) return;
  drag = { el, id: +el.dataset.id, x: e.clientX, y: e.clientY, on: false, z: null };
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
    drag.ox = drag.x - r.left; drag.oy = drag.y - r.top;
    g.classList.add('drag-card'); g.classList.remove('land'); g.removeAttribute('data-open'); g.setAttribute('aria-hidden', 'true'); g.style.width = r.width + 'px';
    document.body.appendChild(g); drag.g = g; drag.on = true; drag.el.classList.add('lift'); document.body.classList.add('dragging');
  }
  drag.g.style.left = e.clientX - drag.ox + 'px'; drag.g.style.top = e.clientY - drag.oy + 'px';
  drag.g.style.visibility = 'hidden';
  const hit = document.elementFromPoint(e.clientX, e.clientY), z = hit && hit.closest('[data-drop]');
  drag.g.style.visibility = '';
  if (z !== drag.z) { if (drag.z) drag.z.classList.remove('over'); if (z) z.classList.add('over'); drag.z = z; }
});
function endDrag(e, drop) {
  if (!drag) return;
  const dd = drag; drag = null;
  if (!dd.on) return;
  suppress = true; setTimeout(() => (suppress = false), 0);
  dd.g.remove(); document.body.classList.remove('dragging'); dd.el.classList.remove('lift'); if (dd.z) dd.z.classList.remove('over');
  const d = byId(dd.id);
  if (drop && dd.z && dd.z.dataset.drop !== d.stage) moveTo(d, dd.z.dataset.drop, { x: e.clientX, y: e.clientY });
}
document.addEventListener('pointerup', (e) => endDrag(e, true));
document.addEventListener('pointercancel', (e) => endDrag(e, false));

/* ---------- events ---------- */
app.addEventListener('click', (e) => {
  if (suppress) { suppress = false; return; }
  const t = e.target, c = (sel) => t.closest(sel), d = byId(cur);
  let el;
  if ((el = c('[data-fv]'))) return setFv(el.dataset.fk, el.dataset.fv);
  if (c('#fpop')) return;
  if ((el = c('[data-fpop]'))) { if (fp === el.dataset.fpop) closeFpop(); else openFpop(el.dataset.fpop); return; }
  if (fp) closeFpop();
  if ((el = c('[data-own]'))) { const v = el.dataset.own; fOwn.has(v) ? fOwn.delete(v) : fOwn.add(v); return render(); }
  if ((el = c('[data-cl]'))) { fClose = el.dataset.cl; pop = null; return render(true); }
  if ((el = c('[data-sort]'))) { sort = el.dataset.sort; pop = null; return render(true); }
  if (c('[data-tool]')) { pop = null; render(); return toast('Opens in Setup'); }
  if ((el = c('[data-reason]'))) { lost.reason = el.dataset.reason; $('reasons').querySelectorAll('.rsn').forEach((x) => x.setAttribute('aria-checked', x === el)); $('lostYes').disabled = false; return; }
  if (c('#pop')) return;
  if ((el = c('[data-pop]'))) { pop = pop === el.dataset.pop ? null : el.dataset.pop; popQ = ''; render(); const pq = $('popQ'); if (pq) pq.focus(); return; }
  if (pop) { pop = null; popQ = ''; render(); }
  if (c('#lostYes')) return confirmLost();
  if (c('[data-close]') || t.id === 'scrim') return closeOver();
  if (c('#delYes')) { D.splice(D.indexOf(d), 1); cur = D[0].id; show(view); return toast('Deal deleted'); }
  if ((el = c('[data-stage]'))) return moveTo(d, el.dataset.stage, el);
  if (c('[data-reopen]')) return moveTo(d, OPEN[OPEN.length - 1].n, null);
  if (c('[data-log]')) return toast('Log a call, meeting or note here');
  if (c('[data-quote]')) return toast('Opens the quote');
  if (c('[data-person]')) return toast('Opens the contact profile');
  if (c('[data-acct]')) return toast('Opens the account');
  if ((el = c('[data-more]'))) { const k = el.dataset.more; binAll.has(k) ? binAll.delete(k) : binAll.add(k); return render(); }
  if ((el = c('[data-pst]'))) { pst = +el.dataset.pst; return render(true); }
  if (c('#clear')) { fOwn.clear(); fClose = 'any'; q = ''; return render(true); }
  if ((el = c('[data-view]'))) return show(el.dataset.view);
  if (c('[data-sheet]') || c('[data-relayout]')) { sheet = 'layout'; return overlay(); }
  if ((el = c('[data-layout]'))) { formMode = 'new'; layout = LAYOUTS[+el.dataset.layout]; return show('form', null, 1); }
  if (c('[data-autoflow]')) return toast('The guided AutoFlow opens here');
  if (c('[data-edit]')) { formMode = 'edit'; layout = LAYOUTS[0]; return show('form', null, 1); }
  if (c('[data-cancel]')) return show(formMode === 'edit' ? 'deal' : view);
  if ((el = c('[data-ltab]'))) return setTab(+el.dataset.ltab);
  if (c('[data-del]')) { del = true; return overlay(); }
  if ((el = c('[data-open]'))) return show('deal', +el.dataset.open);
  if ((el = c('[data-go]'))) return show(el.dataset.go);
  if ((el = c('[data-step]'))) { const s = (rowsNow().length ? rowsNow() : [...D]).sort((x, y) => (isOpen(y) - isOpen(x)) || x.close - y.close), i = Math.max(0, s.indexOf(d)); return show('deal', s[(i + +el.dataset.step + s.length) % s.length].id); }
});
app.addEventListener('mouseover', (e) => { if ($('tip')) showTip(e.target.closest('[data-tip]')); });
app.addEventListener('focusin', (e) => { if ($('tip')) showTip(e.target.closest('[data-tip]')); });
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { q = t.value; const pos = t.selectionStart; pipeView(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (t.id === 'popQ') { popQ = t.value; const pos = t.selectionStart; render(); const n = $('popQ'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (t.id === 'fpQ') { $('fpList').innerHTML = fpList(fp, t.value); }
  else if (t.id === 'lostQ') { lost.q = t.value; $('reasons').innerHTML = reasonsHtml(); }
  else if (t.closest('#dform')) {
    if (t.id === 'in-prob') { probTouched = true; $('probHint').textContent = ''; }
    const f = t.closest('.f'); if (f) { f.classList.remove('bad'); const er = f.querySelector('.err'); if (er) er.remove(); }
    preview();
  }
});
app.addEventListener('submit', (e) => {
  e.preventDefault();
  let ok = true; setTab(0);
  const amtRaw = $('in-amt').value, closeV = $('in-close').value;
  [['f-name', 'in-name', !$('in-name').value.trim(), 'Enter the deal name.'], ['f-amt', 'in-amt', amtRaw === '' || +amtRaw < 0, amtRaw === '' ? 'Enter the amount.' : 'The amount can’t be negative.'], ['f-close', 'in-close', !closeV, 'Pick the expected close date.']].forEach(([f, i, bad, msg]) => {
    $(f).classList.toggle('bad', bad); const er = $(f).querySelector('.err'); if (er) er.remove();
    if (bad) { $(f).insertAdjacentHTML('beforeend', `<div class="err">${msg}</div>`); if (ok) $(i).focus(); ok = false; }
  });
  if (!ok) return;
  const camp = $('in-camp').value;
  const o = { name: $('in-name').value.trim(), acc: fAcc, amt: +amtRaw, stage: fStage, close: offOf(closeV), prob: +$('in-prob').value, owner: $('in-owner').value, camp: camp === 'None' ? '' : camp, next: $('in-next').value.trim() };
  const edit = formMode === 'edit';
  if (edit) { const d = byId(cur); if (d.stage !== o.stage) d.hist.unshift({ t: 'Moved to ' + o.stage, w: 'Today', by: 'Priya Nair', c: stOf(o.stage).c }); Object.assign(d, o); }
  else { D.push({ id: seq++, quotes: [], reason: '', layout: layout.name, created: 'Today', hist: [{ t: 'Deal created in ' + o.stage, w: 'Today', by: 'Priya Nair', c: stOf(o.stage).c }], ...o }); cur = seq - 1; q = ''; fOwn.clear(); fClose = 'any'; }
  show('deal');
  toast(edit ? 'Changes saved' : 'Deal created');
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (fp) { const k = fp; closeFpop(); $('in-' + k).focus(); }
  else if (pop) { pop = null; render(); }
  else if (sheet || del || lost) closeOver();
});
$('screens').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.s); });
let rz, lastW = 0;
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (app.clientWidth !== lastW) { lastW = app.clientWidth; if (screen === 'pipe') render(); } }, 120); }).observe(app);
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
$('themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; });
const BANKS = [['H', '#1d3a6e', '#1d3a6e', '#9db8ee'], ['M', '#9b1c3a', '#8a1933', '#f2a3b5'], ['C', '#0f6b52', '#0d5c47', '#7fd6b9']];
$('banks').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const [letter, primary, inkL, inkD] = BANKS[+b.dataset.bank], r = document.documentElement.style;
  r.setProperty('--bank-primary', primary); r.setProperty('--bank-ink-light', inkL); r.setProperty('--bank-ink-dark', inkD);
  $('logo').textContent = letter;
  $('banks').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
});
lastW = app.clientWidth;
render(true);
</script>
