<meta name="claude:viewport-fit-sides" content="cover">
<title>Harbor Leads 3.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: the five Leads screens inside a still copy of the 3.0 shell. Rows and cards sit on layered
   surfaces; one status flow bar is the page's signature. Tokens mirror src/styles/v3.css. */
:root {
  --bank-primary: #1d3a6e; --bank-on: #ffffff; --bank-ink-light: #1d3a6e; --bank-ink-dark: #9db8ee;
  --bank-ink: var(--bank-ink-light);
  --bg: color-mix(in srgb, var(--bank-primary) 4%, #f5f6f8);
  --surface: #ffffff;
  --surface-2: color-mix(in srgb, var(--bank-primary) 4%, #f3f4f6);
  --surface-3: color-mix(in srgb, var(--bank-primary) 7%, #e8eaee);
  --border: color-mix(in srgb, var(--bank-primary) 8%, #e2e5ea);
  --border-strong: color-mix(in srgb, var(--bank-primary) 10%, #cfd4dc);
  --text: #171b26; --text-muted: #5a6272;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 10%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 26%, var(--surface));
  --bank-accent: color-mix(in srgb, var(--bank-primary) 45%, #fff);
  --chrome-bg: color-mix(in srgb, var(--bank-primary) 26%, #0a0d15);
  --chrome-hover: color-mix(in srgb, var(--bank-primary) 34%, #151a26);
  --chrome-line: color-mix(in srgb, var(--bank-primary) 30%, #1c2331);
  --chrome-active: color-mix(in srgb, var(--bank-primary) 55%, #1a2030);
  --chrome-text: #cfd5e3; --chrome-muted: #98a1b6; --chrome-strong: #ffffff;
  --glass: color-mix(in srgb, var(--surface) 72%, transparent);
  --glass-strong: color-mix(in srgb, var(--surface) 90%, transparent);
  --glass-line: color-mix(in srgb, var(--text) 9%, transparent);
  --scrim: color-mix(in srgb, var(--bank-primary) 18%, rgba(9, 12, 20, 0.5));
  --warn-bg: #fdf0d5; --warn-text: #8a5300; --danger-bg: #fde7e7; --danger-text: #a12626; --ok-bg: #dcf5ea; --ok-text: #0c6b47;
  --shadow: 0 1px 2px rgba(16, 22, 38, 0.05), 0 4px 12px -2px rgba(16, 22, 38, 0.07);
  --shadow-lg: 0 4px 8px rgba(16, 22, 38, 0.05), 0 24px 48px -12px rgba(16, 22, 38, 0.24);
  --shadow-dock: 0 18px 40px -16px color-mix(in srgb, var(--bank-primary) 70%, rgba(0, 0, 0, 0.6));
  --shadow-bank: 0 6px 18px -6px color-mix(in srgb, var(--bank-primary) 60%, transparent);
  --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --fast: 150ms; --base: 220ms; --slow: 350ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
:root { --violet: #6d4fd6; --s-new: #2f6fe0; --s-contacted: #c98a12; --s-qualified: #17936a; --s-unqualified: #8a93a6; --s-converted: #6d4fd6; --s-kyc: #0f97a8; --s-callback: #d1478d; }
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
  padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--bank-ink); outline-offset: 2px; border-radius: 6px; }
svg { flex: none; display: block; }
h2, h3 { font-family: var(--font-display); margin: 0; letter-spacing: -0.01em; }

.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 1280px; margin: 0 auto 14px; }
.deck h1 { font-family: var(--font-display); font-size: 20px; font-weight: 650; margin: 0; flex: 1 1 200px; }
.deck h1 small { display: block; font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--text-muted); }
.pick { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
.seg { display: flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--surface-3); border-radius: 999px; }
.seg button { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 6px; transition: background var(--fast), color var(--fast); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }

.stage { container-type: inline-size; max-width: 1280px; margin: 0 auto; }
.app { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); height: clamp(640px, 86vh, 840px); border-radius: 20px; border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg);
  background: radial-gradient(60% 50% at 100% 0%, color-mix(in srgb, var(--bank-primary) 13%, transparent), transparent 70%), radial-gradient(50% 50% at 0% 100%, color-mix(in srgb, var(--bank-primary) 8%, transparent), transparent 70%), var(--bg); }
.rail { width: 60px; margin: 10px 0 10px 10px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; color: var(--chrome-muted); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-dock);
  background: radial-gradient(130% 42% at 0% 0%, color-mix(in srgb, var(--bank-primary) 62%, transparent), transparent 72%), var(--chrome-bg); }
.rail .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; background: var(--bank-primary); color: var(--bank-on); font-family: var(--font-display); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.rail span { width: 40px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.rail span.on { color: var(--chrome-strong); background: var(--chrome-active); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.main { position: relative; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.tb { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 10px 8px 16px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.crumb { display: flex; gap: 7px; color: var(--text-muted); font-size: 13px; white-space: nowrap; min-width: 0; overflow: hidden; }
.crumb b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.chip-me { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 5px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; background: var(--bank-primary); color: var(--bank-on); }
i { font-style: normal; }
.av.soft { background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.av.lg { width: 60px; height: 60px; font-size: 20px; font-family: var(--font-display); box-shadow: 0 0 0 4px var(--surface), 0 0 0 5px var(--bank-soft-line), var(--shadow-bank); }
.av.sm { width: 22px; height: 22px; font-size: 9.5px; }
.page { flex: 1; padding: 22px 24px 90px; animation: enter var(--slow) var(--ease-out); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(8px); } }

/* shared pieces */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 12px; font-weight: 550; white-space: nowrap; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  transition: transform var(--fast) var(--ease-spring), border-color var(--fast), filter var(--fast), background var(--fast); }
.btn:hover { transform: translateY(-1px); border-color: var(--bank-soft-line); }
.btn:active { transform: scale(.97); }
.btn.pri { color: var(--bank-on); border-color: transparent; background: linear-gradient(180deg, color-mix(in srgb, var(--bank-primary) 90%, #fff), var(--bank-primary)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), var(--shadow-bank); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--text-muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger-text); }
.btn.sq { width: 38px; padding: 0; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 62%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.ph h2 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em; }
.ph p { margin: 2px 0 0; color: var(--text-muted); }
.ph .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }

/* ---- list ---- */
.flow { display: flex; gap: 6px; padding: 8px; margin-bottom: 14px; }
.flow button { flex: var(--w) 1 0; min-width: 92px; text-align: left; padding: 10px 12px 12px; border-radius: 12px; position: relative; overflow: hidden; transition: background var(--fast), transform var(--fast) var(--ease-spring), flex-grow var(--slow) var(--ease-out); }
.flow button:hover { background: var(--surface-2); transform: translateY(-1px); }
.flow button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 10%, var(--surface)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 34%, transparent); }
.flow b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 650; line-height: 1.15; }
.flow span { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.flow span i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.flow button::after { content: ''; position: absolute; left: 12px; right: 12px; bottom: 5px; height: 3px; border-radius: 3px; background: var(--c); transform-origin: left; animation: growx 700ms var(--ease-out) backwards; animation-delay: var(--d); opacity: .85; }
@keyframes growx { from { transform: scaleX(0); } }
.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; flex: 1 1 220px; max-width: 320px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted); transition: box-shadow var(--fast), border-color var(--fast); }
.search:focus-within { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; border: 1px dashed var(--border-strong); color: var(--text-muted); font-weight: 500; white-space: nowrap; transition: background var(--fast), border-color var(--fast), color var(--fast); }
.fchip:hover { background: var(--surface); color: var(--text); }
.fchip.set { border-style: solid; border-color: var(--bank-soft-line); background: var(--bank-soft); color: var(--bank-ink); }
.pop-wrap { position: relative; }
.pop { position: absolute; z-index: 9; top: 44px; left: 0; width: 250px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); transform-origin: top left; animation: pop var(--base) var(--ease-spring); }
.pop.right { left: auto; right: 0; transform-origin: top right; }
.pop input { width: 100%; height: 34px; padding: 0 10px; margin-bottom: 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); outline: 0; }
.pop input:focus { border-color: var(--bank-ink); }
.pop .opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; font-weight: 500; }
.pop .opt:hover { background: var(--bank-soft); }
.pop .opt i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.pop .opt .tick { margin-left: auto; color: var(--bank-ink); opacity: 0; }
.pop .opt[aria-checked="true"] .tick { opacity: 1; }
.pop .none { padding: 12px 10px; color: var(--text-muted); font-size: 13px; }
.pop .tag { margin-left: auto; font-size: 10.5px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 6px; padding: 0 5px; }
.pop .opt[aria-checked="true"] .tag { display: none; }
.tbl { overflow: hidden; }
.tr { display: grid; grid-template-columns: 36px minmax(180px, 2.2fr) minmax(110px, 1fr) minmax(90px, .9fr) minmax(120px, 1fr) minmax(90px, .8fr) 64px 76px; align-items: center; gap: 10px; padding: 0 14px; min-height: 58px; border-bottom: 1px solid var(--border); position: relative; }
.tr:last-child { border-bottom: 0; }
.tr.head { min-height: 40px; background: var(--surface-2); font-size: 12px; font-weight: 600; color: var(--text-muted); }
.tr.head button { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; }
.tr.head button:hover { color: var(--text); }
.tr.row { cursor: pointer; transition: background var(--fast), transform var(--fast) var(--ease-out), box-shadow var(--fast); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.tr.row:hover { background: color-mix(in srgb, var(--bank-primary) 4%, var(--surface)); box-shadow: inset 3px 0 0 var(--bank-primary); }
.tr.row.sel { background: var(--bank-soft); }
.who { display: flex; align-items: center; gap: 11px; min-width: 0; }
.who div { min-width: 0; }
.who b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { color: var(--text-muted); font-size: 12.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.own { display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; }
.quick { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transform: translateX(6px); transition: opacity var(--fast), transform var(--fast) var(--ease-out); }
.tr.row:hover .quick, .tr.row:focus-within .quick { opacity: 1; transform: none; }
.quick button { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--text-muted); }
.quick button:hover { background: var(--surface); color: var(--bank-ink); box-shadow: var(--shadow); }
.cb { width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid var(--border-strong); display: grid; place-items: center; background: var(--surface); color: var(--bank-on); transition: background var(--fast), border-color var(--fast), transform var(--fast) var(--ease-spring); }
.cb svg { opacity: 0; }
.cb[aria-checked="true"] { background: var(--bank-primary); border-color: var(--bank-primary); transform: scale(1.06); }
.cb[aria-checked="true"] svg { opacity: 1; }
.foot { display: flex; align-items: center; gap: 10px; padding: 10px 14px; color: var(--text-muted); font-size: 13px; }
.foot .acts { margin-left: auto; display: flex; gap: 6px; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-muted); }
.empty b { display: block; font-family: var(--font-display); font-size: 17px; color: var(--text); }
.bulk { position: absolute; z-index: 8; left: 50%; bottom: 16px; transform: translate(-50%, 90px); display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 16px; border-radius: 18px; color: var(--chrome-strong); background: var(--chrome-bg); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-lg); white-space: nowrap; transition: transform var(--slow) var(--ease-spring); max-width: calc(100% - 24px); }
.bulk.on { transform: translate(-50%, 0); }
.bulk b { margin-right: 8px; }
.bulk button { height: 34px; padding: 0 12px; border-radius: 10px; font-weight: 500; color: var(--chrome-text); display: inline-flex; align-items: center; gap: 6px; }
.bulk button:hover { background: var(--chrome-hover); color: var(--chrome-strong); }

/* ---- record ---- */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
.back:hover { color: var(--bank-ink); }
.stbtn { display: flex; align-items: center; gap: 6px; padding: 4px 8px 4px 4px; border-radius: 999px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); transition: border-color var(--fast), box-shadow var(--fast); }
.stbtn:hover, .stbtn[aria-expanded="true"] { border-color: var(--bank-soft-line); box-shadow: 0 0 0 4px var(--bank-soft); color: var(--text); }
.hero { position: relative; z-index: 3; padding: 22px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 18px; margin-bottom: 14px; }
.hero::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 70px; border-radius: 17px 17px 0 0; background: linear-gradient(120deg, color-mix(in srgb, var(--bank-primary) 22%, transparent), transparent 70%); pointer-events: none; }
.hero > * { position: relative; }
.hero h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.hero .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.steps { display: flex; padding: 16px 22px 18px; margin-bottom: 14px; gap: 0; }
.step { flex: 1; position: relative; text-align: center; font-size: 12.5px; font-weight: 500; color: var(--text-muted); padding-top: 30px; }
.step::before { content: ''; position: absolute; top: 10px; left: -50%; right: 50%; height: 4px; background: var(--surface-3); }
.step:first-child::before { content: none; }
.step::after { content: ''; position: absolute; top: 2px; left: 50%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border-strong); transition: background var(--base), border-color var(--base), transform var(--base) var(--ease-spring); }
.step.done::before, .step.now::before { background: var(--bank-primary); animation: growx 600ms var(--ease-out) backwards; transform-origin: left; }
.step.done::after { background: var(--bank-primary); border-color: var(--bank-primary); }
.step.now::after { border-color: var(--bank-primary); box-shadow: 0 0 0 5px var(--bank-soft); transform: scale(1.15); }
.step.now { color: var(--text); font-weight: 600; }

      <span>${pill(l.status)}</span><span class="c-src muted">${l.source}</span>
      <span class="c-own own"><i class="av sm">${init(l.owner)}</i>${l.owner}</span>
      <b class="c-val num">${money(l.value)}</b><span class="c-age muted num">${l.age}</span>
      <span class="quick"><button aria-label="Call ${esc(l.name)}" data-stop>${ic('phone', 15)}</button><button aria-label="Email ${esc(l.name)}" data-stop>${ic('mail', 15)}</button></span></div>`).join('')
      : '<div class="empty"><b>No leads match</b>Try a different search, or clear the filters.</div>'}
    <div class="foot"><span class="num">${rows.length ? '1–' + rows.length : 0} of ${rows.length}</span><span>· 10 per page</span><div class="acts"><button class="btn sq" aria-label="Previous page">${ic('left', 15)}</button><button class="btn sq" aria-label="Next page">${ic('right', 15)}</button></div></div>
  </div>`;
  if (pop === 'status' && $('popQ')) { const p = $('popQ'); p.focus(); p.setSelectionRange(p.value.length, p.value.length); }
}
function bulkBar() {
  const b = $('bulk');
  const on = screen === 'list' && picked.size > 0;
  b.classList.toggle('on', on);
  if (on) b.innerHTML = `<b>${picked.size} selected</b><button>${ic('user', 15)}Assign owner</button><button>${ic('edit', 15)}Update a field</button><button>${ic('trash', 15)}Delete</button><button id="unpick" aria-label="Clear selection">${ic('x', 15)}</button>`;
}

/* ---------- record ---------- */
function recordView() {
  const L = LEADS[cur];
  const order = ['New', 'Contacted', 'Qualified', 'Converted'];
  const at = L.status === 'Unqualified' ? -1 : Math.max(order.indexOf(L.status), L.status === 'KYC pending' || L.status === 'Call back' ? 1 : 0);
  const conv = L.status === 'Converted';
  page.innerHTML = `
  <button class="back" data-go="list">${ic('left', 15)}All leads</button>
  <div class="card hero">
    <i class="av lg">${init(L.name)}</i>
    <div><h2>${esc(L.name)}</h2><div class="muted">${esc(L.company)} · ${L.source}</div></div>
    <span class="pop-wrap"><button class="stbtn" data-pop="rstatus" aria-label="Change status" aria-expanded="${pop === 'rstatus'}">${pill(L.status)}${ic('down', 14)}</button>${pop === 'rstatus' ? statusPop(false) : ''}</span>
    <div class="acts">
      <button class="btn sq" aria-label="Previous lead" data-step="-1">${ic('left', 15)}</button><button class="btn sq" aria-label="Next lead" data-step="1">${ic('right', 15)}</button>
      <button class="btn">${ic('edit')}Edit</button>
      <button class="btn danger">${ic('trash')}Delete</button>
      ${conv ? '' : `<button class="btn pri" data-go="convert">${ic('swap')}Convert lead</button>`}
    </div>
  </div>
  <div class="card steps">${order.map((s, k) => `<div class="step ${at > k ? 'done' : at === k ? 'now' : ''}">${s}</div>`).join('')}</div>
  <div class="cols">
    <div class="card box"><h3>Details</h3>
      <div class="fields">
        <div><span>Email</span><b>${L.email}</b></div><div><span>Phone</span><b class="num">${L.phone}</b></div>
        <div><span>Company</span><b>${esc(L.company)}</b></div><div><span>Source</span><b>${L.source}</b></div>
        <div><span>Owner</span><b class="own"><i class="av sm">${init(L.owner)}</i>${L.owner}</b></div><div><span>Created</span><b>${L.age} ago</b></div>
        <div><span>Interested product</span><b>${L.product}</b></div><div><span>Campaign</span><b>${L.campaign}</b></div>
        <div><span>Page layout</span><b>Retail lead</b></div><div><span>Preferred branch</span><b>Mumbai Fort</b></div>
      </div>
      ${conv ? `<div class="dup" style="background:var(--bank-soft);color:var(--bank-ink)">${ic('check')}This lead is converted. Its contact, account and deal stay if you delete it.</div>` : ''}
    </div>
    <div class="side">
      <div class="card box"><span class="lab">Estimated value</span><div class="big num">${money(L.value)}</div><div class="muted">${L.product}</div></div>
      <div class="card box"><h3>Reach out</h3><div class="reach"><button class="btn">${ic('phone')}Call<small class="num">${L.phone}</small></button><button class="btn">${ic('mail')}Email<small>${L.email.split('@')[0]}@…</small></button></div></div>
    </div>
  </div>`;
}

/* ---------- form ---------- */
function formView() {
  page.innerHTML = `
  <button class="back" data-go="list">${ic('left', 15)}All leads</button>
  <div class="ph"><div><h2>New lead</h2><p>Only a name and an email are needed to start.</p></div></div>
  <form class="formgrid" id="lf" novalidate>
    <div class="card">
      <div class="sect"><h3>Who is it</h3><div class="fg">
        <div class="f" id="f-name"><label for="in-name">Full name *</label><input id="in-name" autocomplete="off" placeholder="Aditi Rao"></div>
        <div class="f"><label for="in-company">Company</label><input id="in-company" autocomplete="off" placeholder="Rao Exports Pvt Ltd"></div>
        <div class="f" id="f-email"><label for="in-email">Email *</label><input id="in-email" type="email" autocomplete="off" placeholder="name@company.com"></div>
        <div class="f"><label for="in-phone">Phone</label><input id="in-phone" autocomplete="off" placeholder="+91 98201 55 0142"></div>
      </div><div id="dup"></div></div>
      <div class="sect"><h3>About the lead</h3><div class="fg">
        <div class="f"><label for="in-status">Status</label><select id="in-status">${STATUS.map((s) => `<option>${s[0]}</option>`).join('')}</select></div>
        <div class="f"><label for="in-source">Source</label><select id="in-source"><option>Web</option><option>Referral</option><option>Branch walk-in</option><option>Event</option><option>Partner</option><option>Cold call</option></select></div>
        <div class="f"><label for="in-owner">Owner</label><select id="in-owner"><option>Priya Nair</option><option>Sana Iyer</option><option>Arjun Das</option></select></div>
        <div class="f"><label for="in-value">Estimated value (₹)</label><input id="in-value" inputmode="numeric" placeholder="4800000"></div>
      </div></div>
      <div class="sect"><h3>What they want</h3><div class="fg">
        <div class="f"><label for="in-product">Interested product</label><select id="in-product"><option>—</option><option>Home loan</option><option>Working capital limit</option><option>Current account</option><option>Personal loan</option></select></div>
        <div class="f"><label for="in-campaign">Campaign</label><select id="in-campaign"><option>—</option><option>Festive home loans</option><option>SME outreach Q3</option></select></div>
      </div></div>
      <div class="savebar"><button type="button" class="btn ghost" data-go="list">Cancel</button><button class="btn pri" type="submit">Save lead</button></div>
    </div>
    <div class="card preview" aria-live="polite">
      <span class="lab">Preview</span>
      <i class="av lg" id="pv-av">?</i>
      <h3 id="pv-name">New lead</h3><div class="muted" id="pv-co">Company</div>
      <div class="row2" id="pv-pills"></div>
      <div class="big num" id="pv-val">₹0</div>
    </div>
  </form>`;
  preview();
}
function preview() {
  const v = (id) => $(id).value.trim();
  $('pv-name').textContent = v('in-name') || 'New lead';
  $('pv-av').textContent = v('in-name') ? init(v('in-name')) : '?';
  $('pv-co').textContent = v('in-company') || 'Company';
  $('pv-pills').innerHTML = pill($('in-status').value) + `<span class="pill" style="--c:var(--text-muted)"><i></i>${$('in-source').value}</span>`;
  $('pv-val').textContent = money(Number(v('in-value').replace(/\D/g, '')) || 0);
  const twin = LEADS.find((l) => l.email === v('in-email').toLowerCase());
  $('dup').innerHTML = twin ? `<div class="dup">${ic('alert')}<span><b>${esc(twin.name)}</b> already uses this email. Open that lead, or save anyway if this is a different person.</span></div>` : '';
}

/* ---------- convert ---------- */
function convertView() {
  const L = LEADS[cur], steps = ['Contact', 'Account', 'Deal', 'Review'];
  let body;
  if (wz.done) body = `<div style="text-align:center"><div class="okmark" style="margin:6px auto 12px">${ic('check', 26)}</div><h3 style="font-size:19px">${esc(L.name)} is now a customer record</h3><p class="muted" style="margin:4px 0 0">The lead is kept and marked Converted.</p></div>
    <div class="made"><div style="--d:120ms"><span>${ic('user', 14)}Contact</span><b>${esc(L.name)}</b></div><div style="--d:240ms"><span>${ic('building', 14)}Account</span><b>${esc(L.company)}</b></div>${wz.deal ? `<div style="--d:360ms"><span>${ic('deal', 14)}Deal</span><b>${L.product} · ${money(L.value)}</b></div>` : ''}</div>`;
  else if (wz.step === 0) body = `<div><p class="muted" style="margin:0 0 14px">A contact is made from the lead. Check the details.</p><div class="fg"><div class="f"><label for="c1">Full name</label><input id="c1" value="${esc(L.name)}"></div><div class="f"><label for="c2">Email</label><input id="c2" value="${L.email}"></div><div class="f"><label for="c3">Phone</label><input id="c3" value="${L.phone}"></div><div class="f"><label for="c4">Job title</label><input id="c4" placeholder="Director"></div></div></div>`;
  else if (wz.step === 1) body = `<div><div class="choice"><button aria-pressed="${wz.account === 'new'}" data-acc="new"><b>Create a new account</b><small>${esc(L.company)}</small></button><button aria-pressed="${wz.account === 'old'}" data-acc="old"><b>Add to an existing account</b><small>Pick one you already have</small></button></div>
    ${wz.account === 'new' ? `<div class="fg"><div class="f"><label for="a1">Account name</label><input id="a1" value="${esc(L.company)}"></div><div class="f"><label for="a2">Industry</label><select id="a2"><option>Manufacturing</option><option>Trading</option><option>Services</option></select></div></div>` : `<div class="f"><label for="a3">Find an account</label><input id="a3" placeholder="Start typing a name"></div>`}</div>`;
  else if (wz.step === 2) body = `<div><div class="choice"><button aria-pressed="${wz.deal}" data-deal="1"><b>Open a deal</b><small>Track this as business in progress</small></button><button aria-pressed="${!wz.deal}" data-deal="0"><b>No deal for now</b><small>Only the contact and account</small></button></div>
    ${wz.deal ? `<div class="fg"><div class="f"><label for="d1">Deal name</label><input id="d1" value="${esc(L.product + ' · ' + L.company)}"></div><div class="f"><label for="d2">Value (₹)</label><input id="d2" value="${L.value}"></div><div class="f"><label for="d3">Stage</label><select id="d3"><option>Qualification</option><option>Proposal</option><option>Negotiation</option></select></div></div>` : ''}</div>`;
  else body = `<div><p class="muted" style="margin:0 0 4px">This is what will be made. Nothing is saved until you finish.</p><div class="made"><div style="--d:0ms"><span>${ic('user', 14)}Contact</span><b>${esc(L.name)}</b></div><div style="--d:80ms"><span>${ic('building', 14)}Account · ${wz.account === 'new' ? 'new' : 'existing'}</span><b>${esc(L.company)}</b></div>${wz.deal ? `<div style="--d:160ms"><span>${ic('deal', 14)}Deal</span><b>${L.product} · ${money(L.value)}</b></div>` : ''}</div></div>`;
  $('overlay').innerHTML = `<div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-label="Convert lead">
    <div class="dlg-head"><h3>${wz.done ? 'Converted' : 'Convert ' + esc(L.name)}</h3><button class="btn ghost sq" aria-label="Close" data-go="record">${ic('x')}</button></div>
    ${wz.done ? '' : `<div class="wz">${steps.map((s, k) => `<span class="${k < wz.step ? 'done' : k === wz.step ? 'now' : ''}">${s}</span>`).join('')}</div>`}
    <div class="dlg-body">${body}</div>
    <div class="dlg-foot">${wz.done ? `<span class="sp"></span><button class="btn" data-go="list">Back to leads</button><button class="btn pri" data-go="record">Open the record</button>`
      : `<button class="btn ghost" data-go="record">Cancel</button><span class="sp"></span>${wz.step ? '<button class="btn" data-wz="-1">Back</button>' : ''}<button class="btn pri" data-wz="1">${wz.step === 3 ? 'Finish conversion' : 'Next'}</button>`}</div>
  </div></div>`;
}

/* ---------- triage ---------- */
const QUEUE = LEADS.filter((l) => l.status === 'New' || l.status === 'Call back' || l.status === 'KYC pending');
function tcard(l, cls) {
  return `<div class="tcard ${cls}"><div class="who"><i class="av lg">${init(l.name)}</i><div><b>${esc(l.name)}</b><small>${esc(l.company)}</small></div></div>
    <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">${pill(l.status)}<span class="muted">${l.source} · ${l.age} old</span></div>
    <div><span class="lab">Estimated value</span><div class="big num">${money(l.value)}</div></div>
    <div class="fields"><div><span>Wants</span><b>${l.product}</b></div><div><span>Owner</span><b>${l.owner}</b></div><div><span>Email</span><b>${l.email}</b></div></div></div>`;
}
function triageView() {
  const left = QUEUE.slice(tri.i);
  page.innerHTML = `<div class="tri">
    <div class="tri-top"><h2>Triage</h2><span class="muted num">${Math.min(tri.i + 1, QUEUE.length)} of ${QUEUE.length}</span><button class="btn" data-go="list">Exit</button></div>
    <div class="bar"><i style="width:${(tri.i / QUEUE.length) * 100}%"></i></div>
    ${left.length ? `<div class="stack" id="stack">${left.slice(0, 3).map((l, k) => tcard(l, k ? 'b' + k : 'top')).reverse().join('')}</div>
      <div class="tri-acts"><button class="btn no" data-tri="l">Disqualify<small>D</small></button><button class="btn" data-tri="u">Skip<small>→</small></button><button class="btn yes" data-tri="r">Qualify<small>Q</small></button></div>`
      : `<div class="card done-all"><div class="okmark">${ic('check', 26)}</div><h3 style="font-size:20px">Queue cleared</h3><p class="muted">${tri.done} leads sorted. New ones show here as they arrive.</p><button class="btn pri" data-go="list">Back to leads</button></div>`}
  </div>`;
}
function triAct(dir) {
  const top = document.querySelector('.tcard.top'); if (!top || top.dataset.busy) return;
  top.dataset.busy = 1; top.classList.add('out-' + dir);
  if (dir !== 'u') tri.done++;
  setTimeout(() => { tri.i++; triageView(); }, 300);
}

/* ---------- events ---------- */
app.addEventListener('click', (e) => {
  const t = e.target, c = (sel) => t.closest(sel);
  let el;
  if ((el = c('[data-st]'))) {
    if (pop === 'status') { fStatus.has(el.dataset.st) ? fStatus.delete(el.dataset.st) : fStatus.add(el.dataset.st); }
    else { LEADS[cur].status = el.dataset.st; pop = null; popQ = ''; }
    return render();
  }
  if (c('#pop')) return;
  if ((el = c('[data-pop]'))) { pop = pop === el.dataset.pop ? null : el.dataset.pop; popQ = ''; return render(); }
  if (pop) { pop = null; popQ = ''; render(); }
  if (c('[data-stop]')) return;
  if ((el = c('[data-pick]'))) { const id = +el.dataset.pick; picked.has(id) ? picked.delete(id) : picked.add(id); return render(); }
  if (c('#unpick')) { picked.clear(); return render(); }
  if (c('#clear')) { fStatus.clear(); q = ''; return render(); }
  if ((el = c('[data-flow]'))) { const s = el.dataset.flow; const only = fStatus.size === 1 && fStatus.has(s); fStatus.clear(); if (!only) fStatus.add(s); return render(); }
  if ((el = c('[data-sort]'))) { sortBy = sortBy === el.dataset.sort ? null : el.dataset.sort; return render(); }
  if ((el = c('[data-go]'))) return show(el.dataset.go);
  if ((el = c('[data-step]'))) return show('record', (cur + +el.dataset.step + LEADS.length) % LEADS.length);
  if ((el = c('[data-open]'))) return show('record', +el.dataset.open);
  if ((el = c('[data-acc]'))) { wz.account = el.dataset.acc; return convertView(); }
  if ((el = c('[data-deal]'))) { wz.deal = el.dataset.deal === '1'; return convertView(); }
  if ((el = c('[data-wz]'))) { const d = +el.dataset.wz; if (wz.step === 3 && d > 0) { wz.done = true; LEADS[cur].status = 'Converted'; recordView(); } else wz.step = Math.max(0, wz.step + d); return convertView(); }
  if ((el = c('[data-tri]'))) return triAct(el.dataset.tri);
  if (t.id === 'scrim') return show('record');
});
app.addEventListener('input', (e) => {
  if (e.target.id === 'q') { q = e.target.value; const pos = e.target.selectionStart; listView(); const n = $('q'); n.focus(); n.setSelectionRange(pos, pos); }
  else if (e.target.id === 'popQ') { popQ = e.target.value; render(); }
  else if (screen === 'form') { preview(); e.target.closest('.f')?.classList.remove('bad'); e.target.closest('.f')?.querySelector('.err')?.remove(); }
});
app.addEventListener('submit', (e) => {
  e.preventDefault();
  let ok = true;
  [['f-name', 'in-name', 'Enter the lead’s name.'], ['f-email', 'in-email', 'Enter an email like name@company.com.']].forEach(([f, i, msg]) => {
    const bad = i === 'in-email' ? !/^\S+@\S+\.\S+$/.test($(i).value.trim()) : !$(i).value.trim();
    $(f).classList.toggle('bad', bad); $(f).querySelector('.err')?.remove();
    if (bad) { $(f).insertAdjacentHTML('beforeend', `<div class="err">${msg}</div>`); if (ok) $(i).focus(); ok = false; }
  });
  if (!ok) return;
  LEADS.unshift({ id: LEADS.length, name: $('in-name').value.trim(), company: $('in-company').value.trim() || '—', email: $('in-email').value.trim().toLowerCase(), phone: $('in-phone').value.trim() || '—', status: $('in-status').value, source: $('in-source').value, owner: $('in-owner').value, value: Number($('in-value').value.replace(/\D/g, '')) || 0, age: 'just now', product: $('in-product').value, campaign: $('in-campaign').value });
  LEADS.forEach((l, k) => (l.id = k)); picked.clear();
  show('record', 0);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (pop) { pop = null; render(); } else if (screen === 'convert') show('record'); }
  if (screen === 'triage' && !e.target.matches('input')) { const k = e.key.toLowerCase(); if (k === 'q') triAct('r'); else if (k === 'd') triAct('l'); else if (e.key === 'ArrowRight') triAct('u'); }
  if (e.key === 'Enter' && e.target.matches('.tr.row')) show('record', +e.target.dataset.open);
});
$('screens').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.s); });
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
$('themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; });
const BANKS = [['H', '#1d3a6e', '#1d3a6e', '#9db8ee'], ['M', '#9b1c3a', '#8a1933', '#f2a3b5'], ['C', '#0f6b52', '#0d5c47', '#7fd6b9']];
$('banks').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const [letter, primary, inkL, inkD] = BANKS[+b.dataset.bank], r = document.documentElement.style;
  r.setProperty('--bank-primary', primary); r.setProperty('--bank-ink-light', inkL); r.setProperty('--bank-ink-dark', inkD);
  $('logo').textContent = letter;
  $('banks').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
});
render(true);
</script>
