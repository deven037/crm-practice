<title>Harbor Activity 3.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Activity, Tasks and Calendar 3.0. Shared tokens and pieces below are the same as design/v3/deals.html; the module styles follow. */

/* Layout: Deals is a pipeline. Chevron stage gates over a board you drag on, with Won and Lost bins; a forecast runway that plots every open deal by close date and win chance; a deal room with a clickable stage path; a full page form that shows where the deal lands on the runway. Tokens mirror src/styles/v3.css. */
:root {
  --bank-primary: #1d3a6e; --bank-on: #ffffff; --bank-ink-light: #1d3a6e; --bank-ink-dark: #9db8ee;
  --bank-ink: var(--bank-ink-light);
  --bg: color-mix(in srgb, var(--bank-primary) 4%, #f5f6f8);
  --surface: #ffffff;
  --surface-2: color-mix(in srgb, var(--bank-primary) 4%, #f3f4f6);
  --surface-3: color-mix(in srgb, var(--bank-primary) 7%, #e8eaee);
  --border: color-mix(in srgb, var(--bank-primary) 8%, #e2e5ea);
  --border-strong: color-mix(in srgb, var(--bank-primary) 10%, #cfd4dc);
  --text: #171b26; --text-muted: #5a6272;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 10%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 26%, var(--surface));
  --chrome-bg: color-mix(in srgb, var(--bank-primary) 26%, #0a0d15);
  --chrome-hover: color-mix(in srgb, var(--bank-primary) 34%, #151a26);
  --chrome-line: color-mix(in srgb, var(--bank-primary) 30%, #1c2331);
  --chrome-active: color-mix(in srgb, var(--bank-primary) 55%, #1a2030);
  --chrome-text: #cfd5e3; --chrome-muted: #98a1b6; --chrome-strong: #ffffff;
  --glass: color-mix(in srgb, var(--surface) 72%, transparent);
  --glass-line: color-mix(in srgb, var(--text) 9%, transparent);
  --scrim: color-mix(in srgb, var(--bank-primary) 18%, rgba(9, 12, 20, 0.5));
  --warn-bg: #fdf0d5; --warn-text: #8a5300; --danger-bg: #fde7e7; --danger-text: #a12626; --ok-bg: #dcf5ea; --ok-text: #0c6b47;
  --shadow: 0 1px 2px rgba(16, 22, 38, 0.05), 0 4px 12px -2px rgba(16, 22, 38, 0.07);
  --shadow-lg: 0 4px 8px rgba(16, 22, 38, 0.05), 0 24px 48px -12px rgba(16, 22, 38, 0.24);
  --shadow-dock: 0 18px 40px -16px color-mix(in srgb, var(--bank-primary) 70%, rgba(0, 0, 0, 0.6));
  --shadow-bank: 0 6px 18px -6px color-mix(in srgb, var(--bank-primary) 60%, transparent);
  --font-sans: 'IBM Plex Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Bricolage Grotesque', 'IBM Plex Sans', 'Segoe UI', sans-serif;
  --fast: 150ms; --base: 220ms; --slow: 350ms;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1); --ease-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bank-ink: var(--bank-ink-dark);
  --bg: color-mix(in srgb, var(--bank-primary) 7%, #0d1119);
  --surface: color-mix(in srgb, var(--bank-primary) 5%, #171c28);
  --surface-2: color-mix(in srgb, var(--bank-primary) 7%, #1f2533);
  --surface-3: color-mix(in srgb, var(--bank-primary) 9%, #293041);
  --border: color-mix(in srgb, var(--bank-primary) 10%, #2c3445);
  --border-strong: color-mix(in srgb, var(--bank-primary) 12%, #3a4358);
  --text: #e9ecf3; --text-muted: #9aa3b6;
  --bank-soft: color-mix(in srgb, var(--bank-primary) 22%, var(--surface));
  --bank-soft-line: color-mix(in srgb, var(--bank-primary) 42%, var(--surface));
  --glass: color-mix(in srgb, var(--surface) 68%, transparent);
  --glass-line: color-mix(in srgb, #fff 9%, transparent);
  --warn-bg: #3d2c0b; --warn-text: #f7cf7d; --danger-bg: #431417; --danger-text: #ffb1b1; --ok-bg: #0f3327; --ok-text: #86e3b9;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 12px -2px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 4px 8px rgba(0, 0, 0, 0.3), 0 24px 48px -12px rgba(0, 0, 0, 0.65);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 14px; line-height: 1.45;
  padding-block: 16px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--bank-ink); outline-offset: 2px; border-radius: 6px; }

.deck { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; max-width: 1280px; margin: 0 auto 14px; }
.deck h1 { font-family: var(--font-display); font-size: 20px; font-weight: 650; margin: 0; flex: 1 1 200px; }
.deck h1 small { display: block; font-family: var(--font-sans); font-size: 13px; font-weight: 400; color: var(--text-muted); }
.pick { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); }
.seg { display: flex; flex-wrap: wrap; padding: 3px; gap: 2px; background: var(--surface-3); border-radius: 999px; }
.seg button { padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 6px; transition: background var(--fast), color var(--fast); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.sw { width: 12px; height: 12px; border-radius: 50%; background: var(--c); }

.stage { container-type: inline-size; max-width: 1280px; margin: 0 auto; }
.app { position: relative; overflow: hidden; display: grid; grid-template-columns: auto minmax(0, 1fr); height: clamp(640px, 86vh, 840px); border-radius: 20px; border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg);
  background: radial-gradient(60% 50% at 100% 0%, color-mix(in srgb, var(--bank-primary) 13%, transparent), transparent 70%), radial-gradient(50% 50% at 0% 100%, color-mix(in srgb, var(--bank-primary) 8%, transparent), transparent 70%), var(--bg); }
.rail { width: 60px; margin: 10px 0 10px 10px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 0; color: var(--chrome-muted); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-dock);
  background: radial-gradient(130% 42% at 0% 0%, color-mix(in srgb, var(--bank-primary) 62%, transparent), transparent 72%), var(--chrome-bg); }
.rail .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; margin-bottom: 8px; background: var(--bank-primary); color: var(--bank-on); font-family: var(--font-display); font-weight: 700; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
.rail span { width: 40px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.rail span.on { color: var(--chrome-strong); background: var(--chrome-active); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.main { position: relative; min-width: 0; overflow-y: auto; display: flex; flex-direction: column; }
.tb { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 10px 8px 16px; border-radius: 16px; background: var(--glass); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px); border: 1px solid var(--glass-line); box-shadow: var(--shadow); }
.crumb { display: flex; gap: 7px; color: var(--text-muted); font-size: 13px; white-space: nowrap; min-width: 0; overflow: hidden; }
.crumb b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.chip-me { margin-left: auto; display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 5px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: 13px; white-space: nowrap; }
.av { width: 30px; height: 30px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; background: var(--bank-primary); color: var(--bank-on); }
.av.sm { width: 24px; height: 24px; font-size: 9.5px; }
.av.soft { background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.page { flex: 1; padding: 22px 24px 90px; animation: enter var(--slow) var(--ease-out); }
@keyframes enter { from { opacity: 0; transform: translateY(10px); } }
@keyframes pop { from { opacity: 0; transform: scale(.9) translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@keyframes grow { from { transform: scaleX(0); } }

/* shared pieces */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 38px; padding: 0 14px; border-radius: 12px; font-weight: 550; white-space: nowrap; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow);
  transition: transform var(--fast) var(--ease-spring), border-color var(--fast), filter var(--fast), background var(--fast), color var(--fast); }
.btn:hover { transform: translateY(-1px); border-color: var(--bank-soft-line); }
.btn:active { transform: scale(.97); }
.btn.pri { color: var(--bank-on); border-color: transparent; background: linear-gradient(180deg, color-mix(in srgb, var(--bank-primary) 90%, #fff), var(--bank-primary)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), var(--shadow-bank); }
.btn.pri:hover { filter: brightness(1.08); }
.btn.ghost { background: none; border-color: transparent; box-shadow: none; color: var(--text-muted); }
.btn.ghost:hover { background: var(--surface-2); color: var(--text); }
.btn.danger { color: var(--danger-text); }
.btn.sq { width: 38px; padding: 0; }
.btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap;
  background: color-mix(in srgb, var(--c) 14%, var(--surface)); color: color-mix(in srgb, var(--c) 62%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.ph { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin-bottom: 18px; }
.ph h2 { font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.02em; }
.ph p { margin: 2px 0 0; color: var(--text-muted); }
.ph .acts { margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px; }
.lab { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.muted { color: var(--text-muted); }
.num { font-variant-numeric: tabular-nums; }
.link { color: var(--bank-ink); font-weight: 550; } .link:hover { text-decoration: underline; }
.tg { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--text-muted); box-shadow: inset 0 0 0 1px var(--border); }
.tg.add { border: 1px dashed var(--border-strong); background: none; box-shadow: none; }
.tg.add:hover { color: var(--bank-ink); border-color: var(--bank-soft-line); background: var(--bank-soft); }

.tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; flex: 1 1 220px; max-width: 320px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-strong); color: var(--text-muted); transition: box-shadow var(--fast), border-color var(--fast); }
.search:focus-within { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); }
.fchip { display: inline-flex; align-items: center; gap: 6px; height: 38px; padding: 0 12px; border-radius: 12px; border: 1px dashed var(--border-strong); color: var(--text-muted); font-weight: 500; white-space: nowrap; transition: background var(--fast), border-color var(--fast), color var(--fast); }
.fchip:hover { background: var(--surface); color: var(--text); }
.fchip.set { border-style: solid; border-color: var(--bank-soft-line); background: var(--bank-soft); color: var(--bank-ink); }
.pop-wrap { position: relative; }
.pop { position: absolute; z-index: 9; top: 44px; left: 0; width: 250px; padding: 6px; border-radius: 16px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); transform-origin: top left; animation: pop var(--base) var(--ease-spring); }
.pop.right { left: auto; right: 0; transform-origin: top right; }
.pop input { width: 100%; height: 34px; padding: 0 10px; margin-bottom: 4px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); outline: 0; }
.pop input:focus { border-color: var(--bank-ink); }
.pop .opt { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 10px; text-align: left; font-weight: 500; }
.pop .opt:hover { background: var(--bank-soft); }
.pop .opt i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.pop .opt .tick { margin-left: auto; color: var(--bank-ink); opacity: 0; }
.pop .opt[aria-checked="true"] .tick { opacity: 1; }
.pop .opt small { margin-left: auto; color: var(--text-muted); font-size: 12px; }
.pop .none { padding: 10px; color: var(--text-muted); font-size: 12.5px; }
.empty { padding: 44px 20px; text-align: center; color: var(--text-muted); }
.empty b { display: block; font-family: var(--font-display); font-size: 17px; color: var(--text); }
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-weight: 500; margin-bottom: 12px; }
.back:hover { color: var(--bank-ink); }
.box { padding: 18px 20px; }
.box h3 { font-size: 16px; font-weight: 650; margin-bottom: 12px; }
.box-h { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; } .box-h h3 { margin: 0; flex: 1; }
.cols { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 14px; align-items: start; }
.stack { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.kv { display: grid; gap: 10px; margin: 0; }
.kv div { display: flex; gap: 10px; align-items: center; }
.kv dt { width: 96px; flex: none; font-size: 12.5px; color: var(--text-muted); } .kv dd { margin: 0; min-width: 0; flex: 1; overflow-wrap: anywhere; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.qrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); } .qrow:last-child { border-bottom: 0; padding-bottom: 0; } .qrow:first-child { padding-top: 0; }
.qrow b { margin-left: auto; font-variant-numeric: tabular-nums; }
.mate { display: flex; align-items: center; gap: 10px; padding: 6px; margin: 0 -6px; border-radius: 12px; text-align: left; min-width: 0; width: calc(100% + 12px); transition: background var(--fast); }
.mate:hover { background: var(--bank-soft); }
.mate div { min-width: 0; } .mate b, .mate small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .mate b { font-weight: 550; } .mate small { color: var(--text-muted); font-size: 12.5px; }
.face { --h: var(--bank-primary); width: 30px; height: 30px; border-radius: 10px; flex: none; display: grid; place-items: center; font-family: var(--font-display); font-weight: 650; font-size: 11.5px;
  background: color-mix(in srgb, var(--h) 20%, var(--surface)); color: color-mix(in srgb, var(--h) 66%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h) 30%, transparent); }
.crest { --h: var(--bank-primary); position: relative; width: 38px; height: 38px; flex: none; display: grid; place-items: center; border-radius: 11px 11px 4px 4px; font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .02em;
  background: linear-gradient(160deg, color-mix(in srgb, var(--h) 34%, var(--surface)), color-mix(in srgb, var(--h) 14%, var(--surface))); color: color-mix(in srgb, var(--h) 68%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h) 32%, transparent), inset 0 -4px 0 color-mix(in srgb, var(--h) 40%, transparent); }
.crest.sm { width: 22px; height: 22px; font-size: 9px; border-radius: 7px 7px 3px 3px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h) 32%, transparent), inset 0 -2px 0 color-mix(in srgb, var(--h) 40%, transparent); }

/* dialogs, sheet, form basics (shared with Contacts and Accounts) */
.scrim { position: absolute; inset: 0; z-index: 10; background: var(--scrim); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px); display: grid; place-items: center; padding: 14px; animation: fade var(--base); }
.dlg { width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; border-radius: 22px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); animation: pop var(--slow) var(--ease-spring); overflow: hidden; }
.dlg-head { padding: 18px 22px 0; display: flex; align-items: center; gap: 10px; }
.dlg-head h3 { font-size: 19px; font-weight: 650; flex: 1; overflow-wrap: anywhere; }
.dlg-body { padding: 14px 22px 18px; overflow-y: auto; color: var(--text-muted); }
.dlg-foot { display: flex; gap: 8px; padding: 14px 22px; background: var(--surface-2); border-top: 1px solid var(--border); }
.dlg-foot .sp { flex: 1; }
.scrim.edge { place-items: stretch end; padding: 10px; }
.sheet { width: min(400px, 100%); display: flex; flex-direction: column; border-radius: 20px; background: var(--surface); border: 1px solid var(--glass-line); box-shadow: var(--shadow-lg); overflow: hidden; animation: slide var(--slow) var(--ease-out); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sheet-body { flex: 1; overflow-y: auto; padding: 16px 22px 20px; display: grid; gap: 14px; align-content: start; }
.pick-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px; border-radius: 14px; text-align: left; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text-muted); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); transition: transform var(--fast) var(--ease-spring), border-color var(--fast), background var(--fast), box-shadow var(--fast); }
.pick-item:hover { transform: translateX(-3px); border-color: var(--bank-ink); background: var(--bank-soft); box-shadow: 0 0 0 3px var(--bank-soft); color: var(--bank-ink); }
.pick-item .ext { width: 38px; height: 38px; flex: none; border-radius: 11px; display: grid; place-items: center; background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.pick-item div { flex: 1; min-width: 0; } .pick-item b { display: block; font-weight: 600; color: var(--text); } .pick-item small { font-size: 12.5px; }
.ltabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--border); overflow-x: auto; overflow-y: hidden; }
.ltabs button { position: relative; padding: 10px 12px 12px; font-weight: 550; color: var(--text-muted); white-space: nowrap; transition: color var(--fast); }
.ltabs button:hover { color: var(--text); }
.ltabs button::after { content: ''; position: absolute; left: 10px; right: 10px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--bank-primary); transform: scaleX(0); transition: transform var(--base) var(--ease-out); }
.ltabs button[aria-selected="true"] { color: var(--bank-ink); } .ltabs button[aria-selected="true"]::after { transform: scaleX(1); }
.sect { padding: 20px 22px; animation: enter var(--base) var(--ease-out); }
.fg { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.fg .full { grid-column: 1 / -1; }
.f label, .f .flab { display: flex; align-items: baseline; gap: 6px; font-size: 12.5px; font-weight: 500; margin-bottom: 5px; }
.f label .tg { font-size: 10.5px; padding: 0 6px; }

.f .err { color: var(--danger-text); font-size: 12px; margin-top: 4px; }
.fpop { width: 100%; min-width: 240px; max-height: 300px; overflow-y: auto; }
.savebar { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; background: var(--surface-2); border-top: 1px solid var(--border); border-radius: 0 0 18px 18px; }
.toast { position: absolute; z-index: 12; left: 50%; bottom: 18px; transform: translate(-50%, 80px); padding: 10px 16px; border-radius: 14px; display: flex; align-items: center; gap: 8px; font-weight: 500; white-space: nowrap; color: var(--chrome-strong); background: var(--chrome-bg); border: 1px solid var(--chrome-line); box-shadow: var(--shadow-lg); transition: transform var(--slow) var(--ease-spring); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 12px 6px 2px 46px; font-size: 12.5px; color: var(--text-muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.legend em { margin-left: auto; font-style: normal; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; } }
/* ---- Activity module: shared bits ---- */
.eyebrow { display: block; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
.face { --h: var(--bank-primary); width: 26px; height: 26px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 10px; font-weight: 650; font-style: normal;
  background: color-mix(in srgb, var(--h) 18%, var(--surface)); color: color-mix(in srgb, var(--h) 70%, var(--text)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--h) 30%, transparent); }
.face.sm { width: 22px; height: 22px; font-size: 9px; }
.faces { display: flex; } .faces .face { margin-left: -6px; box-shadow: 0 0 0 2px var(--surface); } .faces .face:first-child { margin-left: 0; }
.rec { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-width: 0; padding: 2px 9px 2px 3px; border-radius: 999px; font-size: 12px; font-weight: 550; color: var(--text); background: var(--surface-2); box-shadow: inset 0 0 0 1px var(--border); white-space: nowrap; transition: background var(--fast); }
.rec:hover { background: var(--bank-soft); }

.ty { --c: var(--bank-primary); display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: color-mix(in srgb, var(--c) 66%, var(--text)); }
.ty i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.ph .hello { margin: 0 0 2px; }
.sw-row { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch { position: relative; width: 38px; height: 22px; flex: none; border-radius: 999px; background: var(--surface-3); box-shadow: inset 0 0 0 1px var(--border-strong); transition: background var(--base); }
.switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform var(--base) var(--ease-spring); }
.switch[aria-checked="true"] { background: var(--bank-primary); } .switch[aria-checked="true"]::after { transform: translateX(16px); }
textarea { font: inherit; color: inherit; }
.f textarea { width: 100%; min-height: 96px; padding: 10px 12px; border-radius: 11px; border: 1px solid var(--border-strong); background: var(--surface); outline: 0; resize: vertical; transition: border-color var(--fast), box-shadow var(--fast); }
.f textarea:focus { border-color: var(--bank-ink); box-shadow: 0 0 0 4px var(--bank-soft); }
.pop .opt i.face, .fake i.face { width: 22px; height: 22px; border-radius: 50%; background: color-mix(in srgb, var(--h) 18%, var(--surface)); }
.cf { position: fixed; z-index: 1001; width: 7px; height: 11px; border-radius: 2px; pointer-events: none; animation: cf 1000ms var(--ease-out) forwards; }
@keyframes cf { from { transform: translate(-50%, -50%); } 75% { opacity: 1; } to { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)); opacity: 0; } }
.reveal { animation: enter var(--base) var(--ease-out); }

/* ---- My day ---- */
.dayband { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px 22px; align-items: center; padding: 16px 20px; margin-bottom: 14px; }
.dayring { display: flex; align-items: center; gap: 12px; padding-right: 22px; border-right: 1px solid var(--border); }

.dayring small { color: var(--text-muted); font-size: 12.5px; }

.ribbon { position: relative; height: 78px; min-width: 0; }
.nextup { display: none; margin: 0; align-items: center; gap: 6px; color: var(--text-muted); } .nextup b { color: var(--text); }
.ribbon .hr { position: absolute; top: 0; bottom: 18px; width: 0; border-left: 1px dashed var(--border); }
.ribbon .hr span { position: absolute; bottom: -19px; left: -12px; width: 24px; text-align: center; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.ribbon .past { position: absolute; left: 0; top: 0; bottom: 18px; border-radius: 8px 0 0 8px; background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--bank-primary) 6%, transparent)); }
.rb { --c: var(--bank-primary); position: absolute; top: 6px; height: 36px; display: flex; flex-direction: column; justify-content: center; padding: 0 8px; overflow: hidden; border-radius: 9px; text-align: left; font-size: 11.5px; line-height: 1.2;
  background: color-mix(in srgb, var(--c) 16%, var(--surface)); box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 24%, transparent);
  animation: grow-x var(--slow) var(--ease-out) backwards; animation-delay: var(--d); transform-origin: left; transition: transform var(--fast) var(--ease-spring), box-shadow var(--fast); }
@keyframes grow-x { from { transform: scaleX(.2); opacity: 0; } }
.rb:hover { transform: translateY(-2px); box-shadow: inset 3px 0 0 var(--c), 0 6px 14px -6px var(--c); }
.rb b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .rb small { color: var(--text-muted); white-space: nowrap; }
.rt { --c: var(--bank-ink); position: absolute; top: 47px; width: 11px; height: 11px; margin-left: -5px; transform: rotate(45deg); border-radius: 2px; background: var(--c); box-shadow: 0 0 0 2px var(--surface); }
.rt.done { background: var(--ok-text); }
.rnow { position: absolute; top: -4px; bottom: 14px; width: 2px; margin-left: -1px; background: var(--danger-text); border-radius: 2px; }
.rnow::before { content: ''; position: absolute; top: -3px; left: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger-text); animation: beat 2s var(--ease-out) infinite; }
@keyframes beat { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger-text) 45%, transparent); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.qadd { padding: 12px 14px; margin-bottom: 14px; }
.qrow { display: flex; align-items: center; gap: 10px; }
.qrow .plus { width: 34px; height: 34px; border-radius: 11px; flex: none; display: grid; place-items: center; background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); }
.qrow input { flex: 1; min-width: 0; height: 38px; border: 0; outline: 0; background: none; font-size: 15px; }
.qchips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 8px 0 0 44px; min-height: 26px; font-size: 12.5px; color: var(--text-muted); }
.qc { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-weight: 600; background: var(--bank-soft); color: var(--bank-ink); box-shadow: inset 0 0 0 1px var(--bank-soft-line); animation: pop var(--base) var(--ease-spring); }
.tasks { overflow: hidden; }
.tg-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px 8px; font-weight: 650; }
.tg-h i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tg-h small { color: var(--text-muted); font-weight: 500; }
.tg-h .link { margin-left: auto; font-size: 12.5px; }
.tgrp + .tgrp { border-top: 1px solid var(--border); }
.tgrp.late .tg-h { color: var(--danger-text); }
.trow { display: grid; grid-template-columns: 16px 24px minmax(0, 1fr) auto auto 26px 60px; align-items: center; gap: 10px; padding: 9px 16px; transition: background var(--fast), opacity var(--base); animation: enter var(--slow) var(--ease-out) backwards; animation-delay: var(--d); }
.trow:hover { background: color-mix(in srgb, var(--bank-primary) 4%, var(--surface)); }
.trow .grip { color: var(--text-muted); opacity: 0; cursor: grab; transition: opacity var(--fast); }
.trow:hover .grip { opacity: .7; }
.chk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; border: 2px solid var(--border-strong); background: var(--surface); transition: background var(--fast), border-color var(--fast), transform var(--base) var(--ease-spring); }
.chk svg { opacity: 0; transform: scale(.4); transition: opacity var(--fast), transform var(--base) var(--ease-spring); }
.chk:hover { border-color: var(--ok-text); }
.chk[aria-checked="true"] { background: #17936a; border-color: #17936a; transform: scale(1.08); }
.chk[aria-checked="true"] svg { opacity: 1; transform: scale(1); }
.tmain { min-width: 0; display: grid; gap: 3px; }
.tmain b { font-weight: 550; overflow-wrap: anywhere; position: relative; width: fit-content; max-width: 100%; }
.tmain b::after { content: ''; position: absolute; left: 0; right: 0; top: 52%; height: 1.5px; background: var(--text-muted); transform: scaleX(0); transform-origin: left; transition: transform var(--slow) var(--ease-out); }
.trow.done .tmain b { color: var(--text-muted); } .trow.done .tmain b::after { transform: scaleX(1); }
.tmain .rec { justify-self: start; }
.due { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; color: var(--text-muted); }
.due.late { color: var(--danger-text); font-weight: 600; } .due.soon { color: var(--warn-text); font-weight: 600; }
.prio { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; white-space: nowrap; color: color-mix(in srgb, var(--c) 70%, var(--text)); }
.prio i { width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: var(--c); }
.tacts { display: flex; gap: 2px; justify-content: flex-end; opacity: 0; transition: opacity var(--fast); }
.trow:hover .tacts, .trow:focus-within .tacts { opacity: 1; }
.tacts button { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: var(--text-muted); }
.tacts button:hover { background: var(--surface-3); color: var(--text); }
.trow.leaving { animation: leave 420ms var(--ease-out) forwards; }
@keyframes leave { to { opacity: 0; transform: translateX(24px); } }
.trow.land { animation: land 600ms var(--ease-spring); }
@keyframes land { 0% { background: var(--bank-soft); transform: scale(.97); } 100% { background: transparent; } }
.tg-none { padding: 4px 16px 14px 66px; color: var(--text-muted); font-size: 13px; }
.cele { padding: 20px 16px; text-align: center; color: var(--text-muted); }
.cele b { display: block; font-family: var(--font-display); font-size: 17px; color: var(--text); }

/* ---- Calendar ---- */
.calbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
.calbar h3 { font-size: 18px; font-weight: 650; margin: 0 6px; white-space: nowrap; }
.week { overflow: hidden; }
.wk-head, .wk-all, .wk-body { display: grid; grid-template-columns: 54px repeat(7, minmax(0, 1fr)); }
.wk-head { border-bottom: 1px solid var(--border); }
.wk-head div { padding: 10px 8px 8px; text-align: center; font-size: 12px; color: var(--text-muted); font-weight: 600; }
.wk-head b { display: block; margin: 2px auto 0; width: 32px; height: 32px; line-height: 32px; border-radius: 50%; font-family: var(--font-display); font-size: 17px; color: var(--text); }
.wk-head .today b { background: var(--bank-primary); color: var(--bank-on); box-shadow: var(--shadow-bank); }
.wk-all { border-bottom: 1px solid var(--border); background: var(--surface-2); }
.wk-all > div { min-height: 34px; padding: 5px 4px; display: flex; flex-direction: column; gap: 3px; border-left: 1px solid var(--border); min-width: 0; }
.wk-all > div:first-child { border-left: 0; justify-content: center; align-items: flex-end; padding-right: 8px; font-size: 11px; color: var(--text-muted); }
.wk-task { display: flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 550; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); text-align: left; }
.wk-task::before { content: ''; flex: none; width: 7px; height: 7px; border-radius: 2px; transform: rotate(45deg); background: var(--c, var(--bank-ink)); }
.wk-task.done { color: var(--text-muted); text-decoration: line-through; }
.wk-body { position: relative; }
.wk-hours div { height: var(--hp); position: relative; }
.wk-hours span { position: absolute; top: -8px; right: 8px; font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
.wk-col { position: relative; border-left: 1px solid var(--border); background: repeating-linear-gradient(180deg, transparent 0 calc(var(--hp) - 1px), var(--border) calc(var(--hp) - 1px) var(--hp)); cursor: cell; }
.wk-col.weekend { background-color: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.wk-col.today { background-color: color-mix(in srgb, var(--bank-primary) 4%, transparent); }
.ev { --c: var(--bank-primary); position: absolute; left: calc(var(--l) * 100% + 3px); width: calc(var(--w) * 100% - 6px); z-index: 1; display: flex; flex-direction: column; gap: 1px; padding: 5px 7px; overflow: hidden; border-radius: 9px; text-align: left; font-size: 12px; line-height: 1.25; cursor: grab;
  background: color-mix(in srgb, var(--c) 17%, var(--surface)); box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 26%, transparent);
  animation: pop var(--base) var(--ease-spring) backwards; animation-delay: var(--d); transition: box-shadow var(--fast), transform var(--fast) var(--ease-spring); touch-action: none; user-select: none; -webkit-user-select: none; }
.ev:hover { box-shadow: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 50%, transparent), 0 8px 18px -10px var(--c); z-index: 2; }
.ev b, .ev small { flex: none; }
.ev b { font-weight: 600; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ev small { color: color-mix(in srgb, var(--c) 60%, var(--text)); font-size: 11px; font-variant-numeric: tabular-nums; }
.ev.short { flex-direction: row; align-items: center; gap: 6px; padding-top: 2px; padding-bottom: 2px; }
.ev.moving { z-index: 6; cursor: grabbing; opacity: .92; transform: scale(1.02); box-shadow: inset 3px 0 0 var(--c), var(--shadow-lg); transition: none; }
.ev.ghosted { opacity: .35; }
.wk-now { position: absolute; left: 0; right: 0; height: 2px; z-index: 3; background: var(--danger-text); pointer-events: none; }
.wk-now::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: var(--danger-text); animation: beat 2s var(--ease-out) infinite; }
.slot-hint { position: absolute; left: 3px; right: 3px; z-index: 0; border-radius: 9px; border: 1.5px dashed var(--bank-soft-line); background: color-mix(in srgb, var(--bank-primary) 6%, transparent); display: grid; place-items: center; font-size: 11.5px; font-weight: 600; color: var(--bank-ink); pointer-events: none; animation: fade var(--fast); }
.month { overflow: hidden; }
.mo-head, .mo-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.mo-head div { padding: 9px 10px; font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); }
.mo-cell { min-height: 98px; padding: 6px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px; min-width: 0; animation: fade var(--slow) backwards; animation-delay: var(--d); }
.mo-cell:nth-child(7n) { border-right: 0; }
.mo-cell.out { background: var(--surface-2); } .mo-cell.out .n { color: var(--text-muted); opacity: .6; }
.mo-cell .n { font-size: 12.5px; font-weight: 600; width: 24px; height: 24px; line-height: 24px; text-align: center; border-radius: 50%; }
.mo-cell.today .n { background: var(--bank-primary); color: var(--bank-on); }
.mo-ev { --c: var(--bank-primary); display: flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 550; text-align: left; white-space: nowrap; overflow: hidden; background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.mo-ev i { width: 6px; height: 6px; border-radius: 50%; flex: none; background: var(--c); }
.mo-ev span { overflow: hidden; text-overflow: ellipsis; }
.mo-more { font-size: 11.5px; font-weight: 600; color: var(--bank-ink); text-align: left; padding-left: 6px; }
.evpop { position: absolute; z-index: 9; width: 310px; max-width: calc(100% - 20px); padding: 16px; border-radius: 18px; background: var(--surface); border: 1px solid var(--border-strong); box-shadow: var(--shadow-lg); animation: pop var(--base) var(--ease-spring); }
.evpop h3 { font-size: 17px; font-weight: 650; margin: 6px 26px 6px 0; overflow-wrap: anywhere; }
.evpop .x { position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; color: var(--text-muted); }
.evpop .x:hover { background: var(--surface-2); color: var(--text); }
.evpop dl { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px 8px; margin: 12px 0 14px; align-items: center; color: var(--text-muted); font-size: 13px; }
.evpop dd { margin: 0; color: var(--text); min-width: 0; overflow-wrap: anywhere; }
.evpop .acts { display: flex; gap: 8px; }
.evpop .acts .btn { flex: 1; height: 34px; }
.agenda .ag-day { padding: 10px 14px 6px; font-weight: 650; display: flex; align-items: baseline; gap: 8px; }
.agenda .ag-day small { color: var(--text-muted); font-weight: 500; }
.agenda .ag-day.today { color: var(--bank-ink); }
.ag-ev { --c: var(--bank-primary); display: grid; grid-template-columns: 52px 3px minmax(0, 1fr); gap: 10px; align-items: center; width: 100%; padding: 8px 14px; text-align: left; }
.ag-ev time { font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.ag-ev i { align-self: stretch; border-radius: 2px; background: var(--c); }
.ag-ev b { display: block; font-weight: 600; } .ag-ev small { color: var(--text-muted); font-size: 12px; }
.ag-ev:hover { background: var(--bank-soft); }

/* ---- Activity pulse ---- */
.pulse-top { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; margin-bottom: 14px; }
.heatcard { padding: 16px 18px; min-width: 0; }
.heatwrap { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
.heatdays { display: grid; grid-template-rows: repeat(7, 15px); gap: 4px; font-size: 10.5px; color: var(--text-muted); }
.heatdays span { line-height: 15px; }
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 15px); grid-auto-columns: 15px; gap: 4px; }
.hc { width: 15px; height: 15px; border-radius: 4px; background: var(--surface-3); transition: transform var(--fast) var(--ease-spring), box-shadow var(--fast); animation: fade var(--slow) backwards; animation-delay: var(--d); }
.hc.l1 { background: color-mix(in srgb, var(--bank-ink) 25%, var(--surface-3)); }
.hc.l2 { background: color-mix(in srgb, var(--bank-ink) 48%, var(--surface-3)); }
.hc.l3 { background: color-mix(in srgb, var(--bank-ink) 72%, var(--surface-3)); }
.hc.l4 { background: var(--bank-ink); }
.hc.fut { background: transparent; box-shadow: inset 0 0 0 1px var(--border); pointer-events: none; }
.hc:hover { transform: scale(1.3); z-index: 1; }
.hc[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--bank-ink); }
.heatlegend { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; margin-top: 10px; font-size: 12.5px; color: var(--text-muted); }
.heatlegend .scale { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; }
.heatlegend .scale .hc { width: 11px; height: 11px; border-radius: 3px; animation: none; }
.heatlegend .scale .hc:hover { transform: none; }

  return shown.map((x) => `<button type="button" class="opt" role="${multi ? 'menuitemcheckbox' : 'menuitemradio'}" aria-checked="${multi ? MF.att.includes(x[0]) : cur === x[0]}" data-fv="${kind}|${x[0]}">${x[2] || ''}${esc(x[1])}${x[3] ? `<span class="kind">${x[3]}</span>` : ''}<span class="tick">${ic('check', 15)}</span></button>`).join('') || '<div class="none">Nothing matches.</div>';
}
function openFpop(kind) {
  closeFpop(); fp = kind;
  $('slot-' + kind).innerHTML = `<div class="pop fpop" id="fpop"><input id="fpQ" placeholder="Search" aria-label="Search" autocomplete="off"><div id="fpList">${fpList(kind)}</div></div>`;
  $('fpQ').focus();
}
function closeFpop() { fp = null; document.querySelectorAll('.fslot').forEach((x) => (x.innerHTML = '')); }
function setFv(kind, v) {
  if (kind === 'matt') { const a = MF.att; a.includes(v) ? a.splice(a.indexOf(v), 1) : a.push(v); const keep = $('fpQ').value; meetView(); openFpop('matt'); $('fpQ').value = keep; $('fpList').innerHTML = fpList('matt', keep); return; }
  if (kind === 'ltype') LF.type = v; if (kind === 'lrec') LF.rec = v; if (kind === 'lout') LF.outcome = v;
  if (kind === 'mtype') MF.type = v; if (kind === 'mrec') MF.rec = v; if (kind === 'mrem') MF.remind = v;
  closeFpop();
  if (kind[0] === 'l') logView(); else meetView();
  const b = $('fk-' + kind); if (b) b.focus();
}

/* ---------- overlay: meeting card and task delete ---------- */
function overlay() {
  const o = $('overlay');
  if (delTask) {
    const t = T.find((x) => x.id === delTask);
    o.innerHTML = `<div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-modal="true" aria-label="Delete task"><div class="dlg-head"><h3>Delete this task?</h3></div><div class="dlg-body">“${esc(t.title)}” goes for good.</div>
      <div class="dlg-foot"><span class="sp"></span><button class="btn" data-close>Keep task</button><button class="btn danger" id="delYes">${ic('trash')}Delete task</button></div></div></div>`;
    return;
  }
  if (!evPop) { o.innerHTML = ''; return; }
  const m = M.find((x) => x.id === evPop.id); if (!m) { o.innerHTML = ''; return; }
  const t = tyOf(m.type), W = app.clientWidth, H = app.clientHeight;
  const left = Math.max(10, Math.min(W - 320, evPop.x)), top = Math.max(10, Math.min(H - 330, evPop.y));
  o.innerHTML = `<div class="evpop" role="dialog" aria-label="${esc(m.title)}" style="left:${left}px;top:${top}px">
    <button class="x" data-close aria-label="Close">${ic('x', 16)}</button>
    <span class="ty" style="--c:${t[1]}"><i></i>${m.type}</span><h3>${esc(m.title)}</h3>
    <dl><dt>${ic('clock', 15)}</dt><dd>${m.day - TODAY_IDX === 0 ? 'Today' : dLabel(m.day - TODAY_IDX)} · ${hm(m.start)}–${hm(m.start + m.dur)} <span class="muted">(${span(m.dur)})</span></dd>
      <dt>${ic('pin', 15)}</dt><dd>${esc(m.where)}</dd>
      <dt>${ic('users', 15)}</dt><dd style="display:flex;align-items:center;gap:8px"><span class="faces">${m.who.map((u) => face(u, 'sm')).join('')}</span>${m.who.map((u) => USERS[u][0].split(' ')[0]).join(', ')}</dd>
      ${m.rec ? `<dt>${ic('link', 15)}</dt><dd>${rec(m.rec)}</dd>` : ''}</dl>
    <div class="acts"><button class="btn" data-editev="${m.id}">${ic('edit', 15)}Edit</button><button class="btn pri" data-logev="${m.id}">${ic('check', 15)}Log outcome</button></div>
  </div>`;
}

/* ---------- events ---------- */
app.addEventListener('click', (e) => {
  if (e.target.closest('.ev') && suppressClick) { suppressClick = false; return; }
  const t = e.target, c = (s) => t.closest(s); let el;
  if ((el = c('[data-fv]'))) { const [k, v] = el.dataset.fv.split('|'); return setFv(k, v); }
  if (c('#fpop')) return;
  if ((el = c('[data-fpop]'))) { if (fp === el.dataset.fpop) closeFpop(); else openFpop(el.dataset.fpop); return; }
  if (fp) closeFpop();
  if ((el = c('[data-pick]'))) { const [k, v] = el.dataset.pick.split(':'); const set = { owner: owners, prio: prioF, calwho: calWho, ftype: fType, fwho: fWho }[k]; set.has(v) ? set.delete(v) : set.add(v); return render(); }
  if (c('[data-tool]')) { pop = null; render(); return toast('Opens in Setup'); }
  if (c('#pop')) return;
  if ((el = c('[data-pop]'))) { pop = pop === el.dataset.pop ? null : el.dataset.pop; popQ = ''; render(); const pq = $('popQ'); if (pq) pq.focus(); return; }
  if (pop) { pop = null; popQ = ''; render(); }
  if (c('[data-close]') || t.id === 'scrim') { evPop = null; delTask = null; return overlay(); }
  if (c('#delYes')) { T.splice(T.findIndex((x) => x.id === delTask), 1); delTask = null; render(); return toast('Task deleted'); }
  if ((el = c('[data-tick]'))) return tick(el.dataset.tick, el);
  if ((el = c('[data-tdel]'))) { delTask = el.dataset.tdel; return overlay(); }
  if (c('[data-tedit]')) return toast('Opens the task on its full page');
  if (c('[data-donetoggle]')) { doneOpen = !doneOpen; return render(); }
  if (c('[data-newtask]')) { $('qa').focus(); return; }
  if (c('#clear')) { q = ''; prioF.clear(); owners = new Set(['PN']); return render(); }
  if (c('#fclear')) { fq = ''; fType.clear(); fWho.clear(); fDay = null; return render(true); }
  if ((el = c('[data-day]'))) { fDay = el.dataset.day === 'clear' || fDay === +el.dataset.day ? null : +el.dataset.day; return render(); }
  if ((el = c('[data-rec]'))) return toast('Opens ' + R[el.dataset.rec][1]);
  if ((el = c('[data-taskgo]'))) { landed = el.dataset.taskgo; screen = 'today'; doneOpen = doneOpen || T.find((x) => x.id === landed).done; return render(true); }
  if ((el = c('[data-editev]'))) { const m = M.find((x) => x.id === el.dataset.editev); editMeeting = m.id; MF = { title: m.title, type: m.type, date: isoOf(m.day - TODAY_IDX), start: m.start, dur: m.dur, rec: m.rec || '', att: [...m.who], where: m.where, remind: '15 minutes before', notes: '' }; return show('meeting', 1); }
  if ((el = c('[data-logev]'))) { const m = M.find((x) => x.id === el.dataset.logev); show('log'); LF.type = m.type === 'Visit' ? 'Visit' : m.type; LF.rec = m.rec || ''; LF.dur = m.dur; LF.date = isoOf(m.day - TODAY_IDX); LF.time = hm(m.start); return logView(); }
  if ((el = c('[data-ev]')) && !el.classList.contains('ev')) { const r = el.getBoundingClientRect(), a = app.getBoundingClientRect(); evPop = { id: el.dataset.ev, x: r.left - a.left, y: r.bottom - a.top + 8 }; return overlay(); }
  if (c('[data-mx]')) return toast('Opens the meeting');
  if ((el = c('[data-cv]'))) { calView = el.dataset.cv; weekOff = 0; return render(true); }
  if ((el = c('[data-wk]'))) { weekOff = el.dataset.wk === 'today' ? 0 : weekOff + +el.dataset.wk; if (calView === 'month') return toast(weekOff ? 'Moves a month' : 'Back to this month'); return render(true); }
  if ((el = c('[data-dur]'))) { LF.dur = +el.dataset.dur; el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === el)); return logPreview(); }
  if ((el = c('[data-fdue]'))) { followDue = +el.dataset.fdue; el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === el)); return logPreview(); }
  if ((el = c('[data-mdur]'))) { MF.dur = +el.dataset.mdur; el.parentElement.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === el)); return meetPreview(true); }
  if (c('[data-follow]')) { e.preventDefault(); LF.follow = !LF.follow; logView(); if (LF.follow) $('l-ftitle').focus(); return; }
  if ((el = c('[data-go]'))) return show(el.dataset.go);
});
app.addEventListener('input', (e) => {
  const t = e.target;
  if (t.id === 'q') { q = t.value; const p = t.selectionStart; render(); const n = $('q'); n.focus(); n.setSelectionRange(p, p); }
  else if (t.id === 'fq') { fq = t.value; const p = t.selectionStart; render(); const n = $('fq'); n.focus(); n.setSelectionRange(p, p); }
  else if (t.id === 'popQ') { popQ = t.value; const p = t.selectionStart; render(); const n = $('popQ'); n.focus(); n.setSelectionRange(p, p); }
  else if (t.id === 'fpQ') $('fpList').innerHTML = fpList(fp, t.value);
  else if (t.id === 'qa') quickChips();
  else if (t.closest('#lform')) { if (t.id === 'l-date') LF.date = t.value; if (t.id === 'l-time') LF.time = t.value; if (t.id === 'l-notes') LF.notes = t.value; if (t.id === 'l-ftitle') LF.ftitle = t.value; t.closest('.f')?.classList.remove('bad'); t.closest('.f')?.querySelector('.err')?.remove(); logPreview(); }
  else if (t.closest('#mform')) { if (t.id === 'm-title') MF.title = t.value; if (t.id === 'm-date') MF.date = t.value; if (t.id === 'm-start' && t.value) { const [h, m] = t.value.split(':').map(Number); MF.start = h * 60 + m; } if (t.id === 'm-where') MF.where = t.value; if (t.id === 'm-notes') MF.notes = t.value; t.closest('.f')?.classList.remove('bad'); t.closest('.f')?.querySelector('.err')?.remove(); meetPreview(t.id !== 'm-title'); }
});
app.addEventListener('keydown', (e) => {
  if (e.target.id === 'qa' && e.key === 'Enter') { e.preventDefault(); addQuick(); }
  if (e.target.classList.contains('switch') && (e.key === ' ' || e.key === 'Enter')) { e.preventDefault(); LF.follow = !LF.follow; logView(); }
});
app.addEventListener('submit', (e) => {
  e.preventDefault();
  const bad = (f, msg) => { const el = $(f); el.classList.add('bad'); el.querySelector('.err')?.remove(); el.insertAdjacentHTML('beforeend', `<div class="err">${msg}</div>`); };
  if (e.target.id === 'lform') {
    if (!LF.rec) { bad('f-rec', 'Pick who or what this was with.'); return $('fk-lrec').focus(); }
    const off = offOf(LF.date), [hh, mm] = LF.time.split(':').map(Number);
    const meta = LF.type === 'Call' ? `${LF.outcome}${LF.outcome === 'Connected' ? ' · ' + span(LF.dur) : ''}` : ['Meeting', 'Visit'].includes(LF.type) ? span(LF.dur) : '';
    F.push({ id: 'f' + seq++, day: off, t: hh * 60 + mm, who: 'PN', type: LF.type, obj: LF.rec, extra: '', meta, det: LF.notes });
    const h = HEAT.find((x) => x.off === off); if (h) h.n++;
    if (LF.follow) T.push({ id: 't' + seq++, title: LF.ftitle || 'Follow up with ' + R[LF.rec][1], due: followDue, time: null, prio: 'Medium', done: false, owner: 'PN', rec: LF.rec, order: -seq });
    const extra = LF.follow; fDay = null; show('pulse'); toast('Activity logged' + (extra ? ' and follow-up task added' : ''));
  }
  if (e.target.id === 'mform') {
    if (!MF.title.trim()) { bad('f-title', 'Give the meeting a title.'); return $('m-title').focus(); }
    const idx = offOf(MF.date) + TODAY_IDX;
    if (editMeeting) Object.assign(M.find((m) => m.id === editMeeting), { title: MF.title.trim(), type: MF.type, day: idx, start: MF.start, dur: MF.dur, rec: MF.rec || null, who: MF.att.filter((a) => USERS[a]), where: MF.where || 'To be confirmed' });
    else if (idx >= 0 && idx <= 6) M.push({ id: 'm' + seq++, title: MF.title.trim(), type: MF.type, day: idx, start: MF.start, dur: MF.dur, rec: MF.rec || null, who: MF.att.filter((a) => USERS[a]).length ? MF.att.filter((a) => USERS[a]) : ['PN'], where: MF.where || 'To be confirmed' });
    const was = editMeeting; calView = 'week'; weekOff = 0; show('calendar'); toast(was ? 'Meeting updated' : 'Added to your calendar');
  }
});

/* drag a meeting to another time or day (week view); a click without a drag opens its card */
let suppressClick = false;
app.addEventListener('pointerdown', (e) => {
  const ev = e.target.closest('.wk-col .ev'); const col = e.target.closest('.wk-col');
  if (ev && e.button === 0) { const m = M.find((x) => x.id === ev.dataset.ev); const r = ev.getBoundingClientRect(); drag = { id: m.id, x: e.clientX, y: e.clientY, grab: e.clientY - r.top, day: m.day, start: m.start, on: false, el: ev }; return; }
  if (col && !ev && e.button === 0 && screen === 'calendar') {
    const r = col.getBoundingClientRect(), min = 480 + Math.floor(((e.clientY - r.top) / HP) * 2) * 30;
    if (min > 1110) return;
    col.insertAdjacentHTML('beforeend', `<div class="slot-hint" style="top:${((min - 480) / 60) * HP}px;height:${HP - 3}px">${hm(min)}</div>`);
    setTimeout(() => { show('meeting'); MF.date = isoOf(+col.dataset.col - TODAY_IDX); MF.start = min; meetView(); $('m-title').focus(); }, 260);
  }
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.on && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 5) return;
  drag.on = true; evPop = null;
  const hit = document.elementFromPoint(e.clientX, e.clientY), col = hit && hit.closest('.wk-col');
  const m = M.find((x) => x.id === drag.id);
  if (col) { const r = col.getBoundingClientRect(); drag.day = +col.dataset.col; drag.start = Math.max(480, Math.min(1140 - m.dur, 480 + Math.round((((e.clientY - drag.grab - r.top) / HP) * 60) / 15) * 15)); }
  if (!drag.raf) drag.raf = requestAnimationFrame(() => { if (drag) { drag.raf = 0; render(); } });
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.on) { const a = app.getBoundingClientRect(), r = d.el.getBoundingClientRect(); evPop = { id: d.id, x: r.left - a.left, y: r.bottom - a.top + 8 }; suppressClick = true; setTimeout(() => (suppressClick = false), 0); return overlay(); }
  suppressClick = true; setTimeout(() => (suppressClick = false), 0);
  const m = M.find((x) => x.id === d.id), moved = m.day !== d.day || m.start !== d.start;
  m.day = d.day; m.start = d.start; render();
  if (moved) toast(`Moved to ${d.day - TODAY_IDX === 0 ? 'today' : dLabel(d.day - TODAY_IDX)} ${hm(d.start)}`);
});

/* reorder tasks inside a group (desktop) */
let dragRow = null;
app.addEventListener('dragstart', (e) => { const r = e.target.closest('.trow'); if (!r) return; dragRow = r.dataset.row; e.dataTransfer.effectAllowed = 'move'; r.style.opacity = '.4'; });
app.addEventListener('dragend', (e) => { const r = e.target.closest('.trow'); if (r) r.style.opacity = ''; dragRow = null; });
app.addEventListener('dragover', (e) => { const r = e.target.closest('.trow'); if (dragRow && r && r.closest('.tgrp') === document.querySelector(`[data-row="${dragRow}"]`)?.closest('.tgrp')) e.preventDefault(); });
app.addEventListener('drop', (e) => {
  const r = e.target.closest('.trow'); if (!dragRow || !r || r.dataset.row === dragRow) return; e.preventDefault();
  const a = T.find((x) => x.id === dragRow), b = T.find((x) => x.id === r.dataset.row), group = [...r.closest('.tgrp').querySelectorAll('.trow')].map((x) => T.find((t) => t.id === x.dataset.row));
  const without = group.filter((x) => x !== a); without.splice(without.indexOf(b) + (group.indexOf(a) < group.indexOf(b) ? 1 : 0), 0, a);
  without.forEach((x, i) => (x.order = i)); landed = a.id; dragRow = null; render(); toast('Order saved');
});
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; if (fp) closeFpop(); else if (pop) { pop = null; render(); } else if (evPop || delTask) { evPop = null; delTask = null; overlay(); } });
$('screens').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.s); });
let rz, lastW = 0;
new ResizeObserver(() => { clearTimeout(rz); rz = setTimeout(() => { if (app.clientWidth !== lastW) { lastW = app.clientWidth; if (screen === 'calendar' || screen === 'today') render(); } }, 120); }).observe(app);
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
$('themeBtn').addEventListener('click', () => { document.documentElement.dataset.theme = isDark() ? 'light' : 'dark'; });
const BANKS = [['H', '#1d3a6e', '#1d3a6e', '#9db8ee'], ['M', '#9b1c3a', '#8a1933', '#f2a3b5'], ['C', '#0f6b52', '#0d5c47', '#7fd6b9']];
$('banks').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const [letter, primary, inkL, inkD] = BANKS[+b.dataset.bank], r = document.documentElement.style;
  r.setProperty('--bank-primary', primary); r.setProperty('--bank-ink-light', inkL); r.setProperty('--bank-ink-dark', inkD);
  USERS.PN[1] = primary; LOGO = letter; $('logo').textContent = letter;
  $('banks').querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
});
lastW = app.clientWidth;
render(true);
</script>
