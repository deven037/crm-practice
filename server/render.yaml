services:
  - type: web
    name: crm-practice-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: CORS_ORIGIN
        value: https://automation-crm.netlify.app,http://localhost:5173
      - key: LOGIN_RATE_LIMIT_MAX
        value: "50"
      - key: RESET_RATE_LIMIT_MAX
        value: "10"
      - key: ANALYSIS_GITHUB_REPOSITORY
        value: deven037/crm-data-science-lab
      - key: ANALYSIS_GITHUB_REF
        value: main
      - key: ANALYSIS_GITHUB_TOKEN
        sync: false
      - key: ANALYSIS_WORKFLOW_SECRET
        sync: false
      - key: PUBLIC_API_URL
        value: https://crm-practice-api.onrender.com
