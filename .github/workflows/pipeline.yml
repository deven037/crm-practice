name: CRM pipeline

on:
  pull_request:
    branches: [dev, release, main]
  push:
    branches: [release, main]

permissions:
  contents: read

concurrency:
  group: crm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Checks (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Front end (tsc + vite build)
        run: |
          npm ci
          npm run build
      - name: API (tsc build)
        working-directory: server
        run: |
          npm ci
          npm run build
