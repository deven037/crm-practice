# CRM pipeline (AIO-127; owner decision 2026-10-28: checks on PRs only).
#
#   PR into dev, release or main -> checks (typecheck, unit tests, build)
#   manual                       -> the same checks on any branch
#
# Nothing deploys from here: Render auto-deploys release (staging) and main (production) when a PR
# merges, and the office merges a PR only after these checks pass. main only moves after Deven's
# production card, so production still deploys only after his approval.
name: CRM pipeline

on:
  pull_request:
    branches: [dev, release, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Front end (unit tests, tsc + vite build)
        run: |
          npm ci
          npm test
          npm run build
      - name: API (tsc build)
        working-directory: server
        run: |
          npm ci
          npm run build
